  // ---- interstitial: level card ----
  function startInterstitial(nextLevel) {
    scene = 'inter'; sceneT = 0;
    interData = { lv: nextLevel, shown: false };
    confettiBurst(70, W/2, H*0.58);
    SFX.win();
  }
  function drawInterstitial() {
    const p = Math.min(1, sceneT / 26);            // slide-in progress
    const ease = 1 - Math.pow(1-p, 3);
    ctx.save();
    ctx.drawImage(BG, -40, -40, W+80, H+80);
    ctx.fillStyle = 'rgba(35,24,15,.72)'; ctx.fillRect(0, 0, W, H);

    drawSteam();
    drawOven(W*0.5, H*0.26, 0.95);

    // banner sweeps in from the left, overshoots, settles
    const bw = W - 40, bh = 74;
    const bx = -bw + (W/2 - bw/2 + bw) * ease;
    const by = H*0.44;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(-0.035 + (1-ease)*0.2);
    ctx.fillStyle = '#c0302c';
    ctx.fillRect(0, 0, bw, bh);
    ctx.strokeStyle = '#23180f'; ctx.lineWidth = 3; ctx.strokeRect(0, 0, bw, bh);
    ctx.fillStyle = '#e0a63c'; ctx.fillRect(0, bh-7, bw, 7);
    ctx.fillStyle = '#3d6b3a'; ctx.fillRect(0, 0, bw, 5);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f2e4c8';
    ctx.font = '900 30px Anton, Impact, sans-serif';
    ctx.fillText('LEVEL ' + interData.lv, bw/2, 40);
    ctx.font = 'italic 12px "DM Serif Display", Georgia, serif';
    ctx.fillStyle = 'rgba(242,228,200,.8)';
    const sub = interData.lv >= 3 ? 'no aim guide — 1.5× points' : 'the oven is hot';
    ctx.fillText(sub, bw/2, 60);
    ctx.restore();

    // Giovanni celebrating below
    piz.happy = 1; piz.bounce = Math.max(0, 1 - sceneT/40);
    piz.toss = 0.8; piz.spin = sceneT * 0.14;
    drawPizzaiolo();

    // flying pizzas tumble across the card
    for (const f of FLYPIZZA) {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.scale(f.sc, f.sc);
      ctx.fillStyle='#f0b64a';
      ctx.beginPath(); ctx.arc(0,0,15,0,7); ctx.fill();
      ctx.strokeStyle='#c9873a'; ctx.lineWidth=3.5; ctx.stroke();
      ctx.fillStyle='#c0302c';
      for (const [px,py] of [[-5,-4],[6,-2],[-1,6],[7,6]]) { ctx.beginPath(); ctx.arc(px,py,3,0,7); ctx.fill(); }
      ctx.restore();
    }
    drawDancingSlice(W*0.82, H*0.66, 1.0);
    drawCat(catX, H - 46, catNap > 0, catVX);

    // APPROVATO! stamp thumps down after the banner lands
    if (sceneT > 34) {
      const sp = Math.min(1, (sceneT - 34) / 9);
      const sc = 2.4 - 1.4 * (1 - Math.pow(1-sp, 3));
      ctx.save();
      ctx.translate(W*0.5, H*0.44 + 96);
      ctx.rotate(-0.22);
      ctx.scale(sc, sc);
      ctx.globalAlpha = Math.min(1, sp*1.6) * 0.9;
      ctx.strokeStyle = '#3d6b3a'; ctx.lineWidth = 2.6;
      ctx.strokeRect(-56, -15, 112, 30);
      ctx.fillStyle = '#3d6b3a';
      ctx.font = '900 19px Anton, Impact, sans-serif'; ctx.textAlign='center';
      ctx.fillText('APPROVATO!', 0, 7);
      ctx.restore();
      ctx.globalAlpha = 1;
      if (sp < 0.15 && !interData.thumped) {
        interData.thumped = true;
        confettiBurst(30, W*0.5, H*0.52);
        SFX.rank(2);
      }
    }

    drawConfetti();
    ctx.restore();
  }

  // ---- player progression ---------------------------------------------
  // XP accrues across runs and never resets — the between-session hook.
  // Perks are picked by the player at each rank, so builds diverge.

  function rankFromXP(xp) {
    let r = 0;
    for (let i = 0; i < RANK_XP.length; i++) if (xp >= RANK_XP[i]) r = i;
    return r;
  }
  function xpToNext(xp) {
    const r = rankFromXP(xp);
    if (r >= RANK_XP.length - 1) return null;
    return { need: RANK_XP[r+1] - xp, span: RANK_XP[r+1] - RANK_XP[r], into: xp - RANK_XP[r] };
  }
  function hasPerk(id) { return (SAVE.data().perks || []).indexOf(id) >= 0; }


  function awardXP(n) {
    const sv = SAVE.data();
    const before = rankFromXP(sv.xp || 0);
    sv.xp = (sv.xp || 0) + n;
    const after = rankFromXP(sv.xp);
    if (after > before) {
      sv.rank = after;
      pendingPerk = true;
      SFX.power();
    }
    SAVE.save();
    return after > before;
  }

  // ---- run snapshot ---------------------------------------------------
  // Only the state needed to rebuild a playable board. Effects, particles
  // and the cast are all cosmetic and get regenerated on restore.
  function snapshotRun() {
    if (!running || over) return;
    SAVE.saveRun({
      v: 1,
      grid: grid.map(r => r.slice()),
      level, score, shots, offsetRow, combo, bestCombo, misses,
      shotsFired, popsMade, cur, next, charge, armed,
      mode: mode.key,
      when: Date.now()
    });
  }

  function restoreRun(r) {
    if (MODES[r.mode]) mode = MODES[r.mode];
    reset(r.level);                       // rebuilds all the cosmetic pools
    grid = r.grid.map(row => row.slice());
    score = r.score; shots = r.shots; offsetRow = r.offsetRow;
    combo = r.combo || 0; bestCombo = r.bestCombo || 0; misses = r.misses || 0;
    shotsFired = r.shotsFired || 0; popsMade = r.popsMade || 0;
    cur = r.cur; next = r.next;
    charge = r.charge || 0; armed = !!r.armed;
    GUIDED = level <= mode.guideThru;
    // Node modifiers layer on top of the difficulty mode.
    if (activeNode) {
      if (activeNode.type === 'blind') GUIDED = false;
      if (activeNode.type === 'boss')  GUIDED = false;
      if (dmod('blind', false))        GUIDED = false;   // district-wide
    }
    lvEl.textContent = level; scEl.textContent = score;
  }

  // ---- death cinematic: la grande onda ---------------------------------
  // A wave of marinara climbs the screen, swallows the board, then GAME
  // OVER is spelled out in food that drops in letter by letter.


  function buildLetters() {
    LETTERS.length = 0;
    const word1 = 'GAME', word2 = 'OVER';
    const cell = 5.2;                       // pixel size of one glyph cell
    const gw = 5 * cell, gap = cell * 1.6;
    for (const [li, word] of [[0, word1], [1, word2]]) {
      const totalW = word.length * gw + (word.length - 1) * gap;
      const startX = (W - totalW) / 2;
      const baseY = H * 0.34 + li * (7 * cell + cell * 2.4);
      for (let ci = 0; ci < word.length; ci++) {
        const g = GLYPHS[word[ci]];
        const gx = startX + ci * (gw + gap);
        for (let ry = 0; ry < 7; ry++) {
          for (let rx = 0; rx < 5; rx++) {
            if (g[ry][rx] !== '1') continue;
            LETTERS.push({
              tx: gx + rx * cell, ty: baseY + ry * cell,
              x: gx + rx * cell + (Math.random()-.5) * 60,
              y: -30 - Math.random() * 220,
              ci: (Math.random() * ITEMS.length) | 0,
              sc: cell / (R * 2) * 1.75,
              rot: Math.random() * 7, vr: (Math.random()-.5) * .5,
              delay: (li * word.length + ci) * 7 + Math.random() * 10,
              landed: false, squash: 0
            });
          }
        }
      }
    }
  }

  // ---- death scene: LA PIZZA IN FACCIA --------------------------------
  // Giovanni hurls a pizza at the screen. It spins in from the board,
  // scaling up on a fake-perspective curve until it fills the view, SPLATS
  // against the glass, and the toppings slide down the inside. GAME OVER
  // is then pressed into the cheese in food letters.
  //
  // Every element blits from the sprite cache or draws with flat fills —
  // no per-frame gradients, which is what stalled the old sauce wave.
  function startDeathWave() {
    waveOn = true; waveT = 0; waveDone = false;
    waveY = 0;                       // reused as the splat's settle timer
    WAVEBITS.length = 0;
    buildLetters();
    // toppings that will slide down the glass after impact
    for (let i = 0; i < 22; i++) {
      WAVEBITS.push({
        x: W * (0.12 + Math.random() * 0.76),
        y: H * (0.16 + Math.random() * 0.5),
        ci: (Math.random() * ITEMS.length) | 0,
        sc: 0.34 + Math.random() * 0.42,
        rot: Math.random() * 7,
        vr: (Math.random() - 0.5) * 0.12,
        vy: 0.5 + Math.random() * 1.5,
        slip: 0,
        ph: Math.random() * 7
      });
    }
    shake = 6;
    SFX.launch();
    pizSay('miss');
  }

  // Perspective curve: slow and small at first, then a rush at the end.
  function pizzaScale(t) {
    const k = Math.min(1, t / 46);
    return 0.14 + Math.pow(k, 2.6) * 7.4;
  }

  function stepDeathWave() {
    waveT++;

    // --- approach: 0..46 frames, pizza flies at the screen ---
    if (waveT < 46) {
      if (waveT === 30) { SFX.wall(); shake = 4; }
      if (waveT % 6 === 0) speedRays(3, 'rgba(255,220,150,.3)');
      return;
    }

    // --- impact frame ---
    if (waveT === 46) {
      shake = 26; hitstop = 9;
      SFX.cascade(10);
      SFX.surge();
      for (let i = 0; i < 30; i++) {
        const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7;
        particles.push({ x: W/2, y: H*0.42, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, ci: 0 });
      }
      speedRays(22, 'rgba(255,190,90,.45)');
      return;
    }

    // --- aftermath: toppings slide, letters press in ---
    waveY = Math.min(1, waveY + 0.02);          // splat settle 0..1

    for (const b of WAVEBITS) {
      b.slip += 0.012;
      b.y += b.vy * Math.min(1, b.slip);        // eases into a slow slide
      b.vy = Math.min(2.6, b.vy + 0.012);
      b.rot += b.vr; b.vr *= 0.97;
      if (b.y > H + 30) { b.y = H + 30; }
    }

    if (waveT > 74) {
      for (const L of LETTERS) {
        if (L.delay > 0) { L.delay--; continue; }
        if (L.landed) { L.squash = L.squash > 0.02 ? L.squash * 0.86 : 0; continue; }
        L.y += (L.ty - L.y) * 0.19;
        L.x += (L.tx - L.x) * 0.19;
        L.rot += L.vr; L.vr *= 0.92;
        if (Math.abs(L.y - L.ty) < 1.2) {
          L.landed = true; L.y = L.ty; L.x = L.tx;
          L.rot = 0; L.squash = 0.45;
          if (Math.random() < 0.2) SFX.pop(2);
        }
      }
      if (!waveDone && LETTERS.length && LETTERS.every(L => L.landed)) {
        waveDone = true;
        SFX.rank(4);
        speedRays(16, 'rgba(192,48,40,.4)');
        for (const L of LETTERS) if (Math.random() < 0.3) sparkle(L.x, L.y, '#ffd98a');
      }
    }
  }

  // The pizza is redrawn every frame at a different size, and the motion
  // smear needs 4 copies. Painting it fresh each time cost ~380 ops/frame,
  // so render it once at high resolution and scale the blit instead.
  let PIZZA_SPR = null;
  const PIZZA_SPR_R = 96;
  function buildPizzaSprite() {
    const size = PIZZA_SPR_R * 2;
    const cv2 = document.createElement('canvas');
    cv2.width = size * DPR; cv2.height = size * DPR;
    const c = cv2.getContext('2d');
    c.scale(DPR, DPR);
    c.translate(PIZZA_SPR_R, PIZZA_SPR_R);
    paintPizza(c, PIZZA_SPR_R * 0.94);
    PIZZA_SPR = cv2;
  }

  // Flat fills only — no gradients, so this stays cheap even uncached.
  function paintPizza(c, rad) {
    c.fillStyle = '#e8a83f';
    c.beginPath(); c.arc(0, 0, rad, 0, 7); c.fill();
    c.strokeStyle = '#b8752a'; c.lineWidth = Math.max(2, rad * 0.13);
    c.stroke();
    c.fillStyle = '#c33329';
    c.beginPath(); c.arc(0, 0, rad * 0.86, 0, 7); c.fill();
    c.fillStyle = '#f4d06a';
    c.beginPath(); c.arc(0, 0, rad * 0.8, 0, 7); c.fill();
    c.fillStyle = '#f8e08c';
    for (let i = 0; i < 7; i++) {
      const a = i * 0.897, r = rad * (0.2 + (i % 3) * 0.2);
      c.beginPath();
      c.ellipse(Math.cos(a)*r, Math.sin(a)*r, rad*0.19, rad*0.14, a, 0, 7);
      c.fill();
    }
    c.fillStyle = '#a92b25';
    for (let i = 0; i < 8; i++) {
      const a = i * 0.785 + 0.3, r = rad * (0.3 + (i % 2) * 0.3);
      c.beginPath(); c.arc(Math.cos(a)*r, Math.sin(a)*r, rad*0.115, 0, 7); c.fill();
    }
    c.fillStyle = '#3f7a3c';
    for (let i = 0; i < 5; i++) {
      const a = i * 1.257 + 0.9, r = rad * 0.55;
      c.save(); c.translate(Math.cos(a)*r, Math.sin(a)*r); c.rotate(a);
      c.beginPath(); c.ellipse(0, 0, rad*0.1, rad*0.05, 0, 0, 7); c.fill();
      c.restore();
    }
  }

  let SPLAT_SPR = null;
  function paintSplat(c, dy) {
    const cx = W/2, cy = H*0.42, lobes = 13;
    c.fillStyle = '#c33329';
    c.beginPath();
    for (let i = 0; i <= lobes; i++) {
      const a = (i / lobes) * Math.PI * 2;
      const wob = 1 + Math.sin(a * 3 + 0.7) * 0.16 + Math.sin(a * 5 - 1.2) * 0.1;
      const rr = Math.max(W, H) * 0.78 * wob;
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.92;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill();
    c.fillStyle = '#f0c862';
    c.beginPath();
    for (let i = 0; i <= lobes; i++) {
      const a = (i / lobes) * Math.PI * 2 + 0.4;
      const wob = 1 + Math.sin(a * 4 - 0.5) * 0.19 + Math.sin(a * 2 + 1) * 0.12;
      const rr = Math.max(W, H) * 0.6 * wob;
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.95 + dy;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill();
  }
  function buildSplatSprite() {
    const cv2 = document.createElement('canvas');
    cv2.width = W * DPR; cv2.height = H * DPR;
    const c = cv2.getContext('2d');
    c.scale(DPR, DPR);
    paintSplat(c, 0);
    SPLAT_SPR = cv2;
  }

  function drawFlyingPizza(cx, cy, rad, rot) {
    if (!PIZZA_SPR) { // first frame before the sprite exists
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
      paintPizza(ctx, rad); ctx.restore(); return;
    }
    const d = rad * 2.13;                       // sprite is drawn at 0.94 of half-size
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.drawImage(PIZZA_SPR, -d/2, -d/2, d, d);
    ctx.restore();
  }

  function drawDeathWave() {
    // ---- approach phase: pizza spinning toward the viewer ----
    if (waveT < 46) {
      const t = waveT;
      const sc = pizzaScale(t);
      const rad = R * 2.2 * sc;
      // it launches from Giovanni's corner and curves to centre screen
      const k = Math.min(1, t / 46);
      const cx = 70 + (W/2 - 70) * (k * k);
      const cy = H - 90 + (H*0.42 - (H - 90)) * (k * k);
      // motion smear behind it
      ctx.globalAlpha = 0.22;
      for (let i = 1; i <= 3; i++) {
        const bk = Math.max(0, k - i * 0.045);
        const bsc = pizzaScale(bk * 46);
        drawFlyingPizza(70 + (W/2 - 70) * (bk*bk),
                        H - 90 + (H*0.42 - (H - 90)) * (bk*bk),
                        R * 2.2 * bsc, t * 0.24 - i * 0.3);
      }
      ctx.globalAlpha = 1;
      drawFlyingPizza(cx, cy, rad, t * 0.24);
      return;
    }

    // ---- impact + aftermath: the splat on the glass ----
    const settle = waveY;

    // The splat shape is fixed, so it's baked once into SPLAT_SPR rather
    // than rebuilding 26 path segments every frame.
    const cx = W/2, cy = H*0.42;
    if (SPLAT_SPR) ctx.drawImage(SPLAT_SPR, 0, settle * 12, W, H);
    else paintSplat(ctx, 0);

    // grease runs sliding down the glass
    ctx.fillStyle = 'rgba(196,52,42,.55)';
    for (let i = 0; i < 9; i++) {
      const gx = W * (0.08 + i * 0.105);
      const gl = (40 + ((i * 53) % 90)) * settle;
      ctx.beginPath();
      ctx.roundRect(gx - 5, cy, 10, gl, 5);
      ctx.fill();
    }

    // toppings sliding down, cached blits
    for (const b of WAVEBITS) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      drawItem(0, 0, b.ci, b.sc);
      ctx.restore();
    }

    // a highlight so it reads as being ON the glass, not behind it
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(W*0.32, H*0.24, W*0.2, H*0.1, -0.5, 0, 7);
    ctx.fill();
    ctx.globalAlpha = 1;

    // ---- GAME OVER pressed into the cheese ----
    for (const L of LETTERS) {
      if (L.delay > 0) continue;
      if (L.rot === 0 && L.squash === 0) {
        drawItem(L.x, L.y, L.ci, L.sc);
      } else {
        ctx.save();
        ctx.translate(L.x, L.y);
        if (L.rot) ctx.rotate(L.rot);
        if (L.squash) ctx.scale(1 + L.squash * 0.45, 1 - L.squash * 0.35);
        drawItem(0, 0, L.ci, L.sc);
        ctx.restore();
      }
    }

    if (waveDone) {
      ctx.globalAlpha = 0.14 + 0.07 * Math.sin(waveT * 0.08);
      ctx.fillStyle = '#e0a63c';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ---- world map ------------------------------------------------------
  // A branching path of nodes, Mario-style. Each node is a level with a
  // modifier, so the run has texture rather than being level 1..N of the
  // same thing. The player picks which fork to take, which is the actual
  // decision the map exists to create.
  // ---- skill choice ---------------------------------------------------
  function offerSkill() {
    const choices = drawSkillChoices();
    if (!choices.length) return false;         // everything maxed
    osub.onclick = null;
    otitle.textContent = 'LEVEL UP'; otitle.className = '';
    osub.innerHTML =
      '<div style="font-family:\'Space Mono\',monospace;font-style:normal;font-size:10px;letter-spacing:.05em">' +
      '<div style="opacity:.75;margin-bottom:9px">Pick one. It sticks for the whole run.</div>' +
      choices.map(id => {
        const k = SKILLS[id], lv = skillLv(id);
        return '<button class="skillpick" data-s="' + id + '" style="display:block;width:100%;' +
          'margin:5px 0;padding:10px 12px;text-align:left;background:linear-gradient(180deg,#4a3550,#33223c);' +
          'border:2px solid #1a1119;border-radius:3px;color:#f7ecd6;font:inherit;font-size:10px;' +
          'cursor:pointer;animation:none">' +
          '<b style="color:#f0b74a;font-size:11px">' + k.name + '</b>' +
          '<span style="float:right;opacity:.55;font-size:9px">' + k.it + '</span><br>' +
          '<span style="opacity:.75">' + k.desc + '</span><br>' +
          '<span style="color:#96b260;font-size:9px">' + k.per(lv + 1) + '</span>' +
          '<span style="float:right;opacity:.5;font-size:9px">' +
          '\u25a0'.repeat(lv) + '\u25a1'.repeat(SKILL_MAX - lv) + '</span>' +
          '</button>';
      }).join('') + '</div>';
    btn.style.display = 'none';
    overlay.classList.remove('title');
    overlay.classList.add('on');
    osub.onclick = (e) => {
      const t = e.target.closest ? e.target.closest('.skillpick') : null;
      if (!t) return;
      addSkill(t.dataset.s);
      SFX.power();
      osub.onclick = null;
      btn.style.display = '';
      if (endQueue.length) runEndQueue();
      else { overlay.classList.remove('on'); }
    };
    return true;
  }

  // ---- perk trial -------------------------------------------------------
  // Perks are earned, not handed out: a short reflex test between rounds.
  // Three rounds of "tap the ingredient Giovanni called for" with a
  // shrinking timer. Win two of three and you get the skill pick; lose and
  // you get lire instead, so a miss still pays something.
  let trial = null;
  let onDone = null;          // shared result callback for whichever mini-game is active
  let miniGameId = null;      // which of the 10 is currently running

  // ---- mini-game rotation -----------------------------------------------
  // Ten short games, one per round. Picked by round number (deterministic,
  // so the sequence is learnable) walking the list so nothing repeats until
  // the whole set is spent — same pattern as the twist scheduler.
  const MINIGAMES = [
    'ordine', 'presto', 'memoria', 'bilancia', 'incastro',
    'ritmo', 'saltain', 'specchio', 'conto', 'assaggio'
  ];
  function miniGameFor(lv) {
    return MINIGAMES[(lv + MINIGAMES.length - 1) % MINIGAMES.length];
  }

  function startTrial(cb) {
    onDone = cb;
    miniGameId = miniGameFor(level);
    MUSIC.stop();                 // mini-games get quiet, so their own SFX read clearly
    SFX.ui();
    ({
      ordine: startTrialOrdine, presto: startPresto, memoria: startMemoria,
      bilancia: startBilancia, incastro: startIncastro, ritmo: startRitmo,
      saltain: startSaltaIn, specchio: startSpecchio, conto: startConto,
      assaggio: startAssaggio
    })[miniGameId]();
  }
  function stepMiniGame() {
    ({
      ordine: stepOrdine, presto: stepPresto, memoria: stepMemoria,
      bilancia: stepBilancia, incastro: stepIncastro, ritmo: stepRitmo,
      saltain: stepSaltaIn, specchio: stepSpecchio, conto: stepConto,
      assaggio: stepAssaggio
    })[miniGameId]();
  }
  function drawMiniGame() {
    ({
      ordine: drawOrdine, presto: drawPresto, memoria: drawMemoria,
      bilancia: drawBilancia, incastro: drawIncastro, ritmo: drawRitmo,
      saltain: drawSaltaIn, specchio: drawSpecchio, conto: drawConto,
      assaggio: drawAssaggio
    })[miniGameId]();
  }
  function tapMiniGame(mx, my) {
    ({
      ordine: ordineTap, presto: prestoTap, memoria: memoriaTap,
      bilancia: bilanciaTap, incastro: incastroTap, ritmo: ritmoTap,
      saltain: saltaInTap, specchio: specchioTap, conto: contoTap,
      assaggio: assaggioTap
    })[miniGameId](mx, my);
  }


  function startTrialOrdine() {
    trial = {
      round: 0, wins: 0, need: 3,
      targets: [], want: 0,
      t: 0, limit: 96, state: 'ready', flashT: 0, resultT: 0
    };
    scene = 'trial'; sceneT = 0;
    overlay.classList.remove('on', 'title');
    nextOrdineRound();
  }

  function nextOrdineRound() {
    if (!trial) return;
    if (trial.round >= trial.need) {
      trial.state = 'done';
      trial.resultT = 0;
      const won = trial.wins >= 2;
      if (won) { SFX.rank(3); twinkleBurst(W/2, H*0.4, 34, '#cfe07a', W*0.8); }
      else     { SFX.lose(); }
      return;
    }
    // Four choices, one correct. Difficulty ramps: less time each round.
    const pool = ITEMS.map((_, i) => i);
    const picks = [];
    while (picks.length < 4) {
      const k = pool[(Math.random() * pool.length) | 0];
      if (picks.indexOf(k) < 0) picks.push(k);
    }
    trial.targets = picks.map((ci, i) => ({
      ci,
      x: W * (0.22 + (i % 2) * 0.56),
      y: H * (0.42 + Math.floor(i / 2) * 0.22),
      pop: 0
    }));
    trial.want = picks[(Math.random() * picks.length) | 0];
    trial.t = 0;
    trial.limit = 100 - trial.round * 18;      // 100 -> 82 -> 64 frames
    trial.state = 'play';
    trial.round++;
  }

  function ordineTap(mx, my) {
    if (!trial || trial.state !== 'play') {
      if (trial && trial.state === 'done' && trial.resultT > 40) finishOrdine();
      return;
    }
    for (const t of trial.targets) {
      if (Math.hypot(mx - t.x, my - t.y) < R * 1.5) {
        const right = t.ci === trial.want;
        t.pop = 1;
        if (right) {
          trial.wins++;
          SFX.pop(trial.wins);
          twinkleBurst(t.x, t.y, 12, ITEMS[t.ci].lit, 40);
        } else {
          SFX.wall(); shake = 8;
        }
        trial.state = 'gap'; trial.flashT = 0;
        return;
      }
    }
  }

  function finishOrdine() {
    if (!trial) return;
    const won = trial.wins >= 2;
    // The callback lives on the shared module-level `onDone`, set by the
    // startTrial() dispatcher — not on the trial object itself. Reading
    // trial.onDone here silently swallowed the result for every game.
    const cb = onDone;
    trial = null; onDone = null;
    scene = 'play';
    if (cb) cb(won);
  }

  function stepOrdine() {
    if (!trial) return;
    if (trial.state === 'play') {
      trial.t++;
      if (trial.t > trial.limit) {           // ran out of time
        SFX.wall(); shake = 6;
        trial.state = 'gap'; trial.flashT = 0;
      }
    } else if (trial.state === 'gap') {
      trial.flashT++;
      for (const t of trial.targets) if (t.pop > 0) t.pop = Math.max(0, t.pop - 0.06);
      if (trial.flashT > 26) nextOrdineRound();
    } else if (trial.state === 'done') {
      trial.resultT++;
      if (trial.resultT > 150) finishOrdine();   // auto-continue
    }
  }

  function drawOrdine() {
    if (!trial) return;   // resolved and cleared this same frame
    if (!trial) return;
    ctx.drawImage(BG, -40, -40, W + 80, H + 80);
    ctx.fillStyle = 'rgba(26,17,25,.82)';
    ctx.fillRect(0, 0, W, H);

    // header
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f0b74a';
    ctx.font = '900 20px Anton, Impact, sans-serif';
    ctx.fillText("L'ORDINE!", W / 2, 46);
    ctx.fillStyle = 'rgba(247,236,214,.6)';
    ctx.font = '9px "Space Mono", ui-monospace, Menlo, monospace';
    ctx.fillText('win 2 of 3 to earn your skill', W / 2, 62);

    // round pips
    for (let i = 0; i < trial.need; i++) {
      const px2 = W / 2 + (i - 1) * 22, py2 = 78;
      const played = i < trial.round - (trial.state === 'play' ? 1 : 0);
      ctx.beginPath(); ctx.arc(px2, py2, 6, 0, 7);
      ctx.fillStyle = !played ? 'rgba(247,236,214,.18)'
                    : (i < trial.wins ? '#96b260' : '#d13a30');
      ctx.fill();
      ctx.strokeStyle = 'rgba(247,236,214,.35)'; ctx.lineWidth = 1.2; ctx.stroke();
    }

    if (trial.state === 'done') {
      const won = trial.wins >= 2;
      ctx.fillStyle = won ? '#96b260' : '#d13a30';
      ctx.font = '900 30px Anton, Impact, sans-serif';
      ctx.fillText(won ? 'BRAVO!' : 'PECCATO...', W / 2, H * 0.44);
      ctx.fillStyle = '#f7ecd6';
      ctx.font = '11px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.fillText(won ? 'pick your skill' : 'lire instead \u2014 try again next round',
                   W / 2, H * 0.44 + 26);
      ctx.fillStyle = 'rgba(247,236,214,.5)';
      ctx.font = '9px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.fillText('tap to continue', W / 2, H * 0.44 + 50);
      drawTwinkles();
      return;
    }

    // the order Giovanni wants
    ctx.fillStyle = 'rgba(247,236,214,.75)';
    ctx.font = '10px "Space Mono", ui-monospace, Menlo, monospace';
    ctx.fillText('BRING ME:', W / 2, H * 0.20);
    drawItem(W / 2, H * 0.20 + 34, trial.want, 1.5);

    // timer bar
    if (trial.state === 'play') {
      const f = 1 - trial.t / trial.limit;
      const bw = W * 0.62, bx = (W - bw) / 2, by = H * 0.20 + 66;
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(bx, by, bw, 7);
      ctx.fillStyle = f > 0.4 ? '#96b260' : f > 0.2 ? '#f0b74a' : '#d13a30';
      ctx.fillRect(bx, by, bw * Math.max(0, f), 7);
      ctx.strokeStyle = 'rgba(247,236,214,.35)'; ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, 7);
    }

    // the four choices
    for (const t of trial.targets) {
      const bob = Math.sin(sceneT * 0.06 + t.x) * 2;
      const sc = 1.35 + t.pop * 0.5;
      if (trial.state === 'gap' && t.ci === trial.want) {
        ctx.globalAlpha = 0.4 + 0.3 * Math.sin(sceneT * 0.3);
        ctx.fillStyle = '#96b260';
        ctx.beginPath(); ctx.arc(t.x, t.y + bob, R * 2.1, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      drawItem(t.x, t.y + bob, t.ci, sc);
    }
    drawTwinkles();
  }


  // ---- 2: PRESTO! — tap the odd one out before it hides again -----------
  // A grid of bubbles, all one colour except one intruder that flashes in
  // briefly. Three rounds, win two.
  function startPresto() {
    trial = { kind:'presto', round:0, wins:0, need:3, cells:[], odd:-1,
              t:0, limit:70, state:'ready', flashT:0, resultT:0 };
    scene='trial'; sceneT=0; overlay.classList.remove('on','title');
    nextPresto();
  }
  function nextPresto() {
    if (trial.round >= trial.need) { trial.state='done'; trial.resultT=0;
      (trial.wins>=2) ? (SFX.jingle(), twinkleBurst(W/2,H*0.4,30,'#cfe07a',W*0.8)) : SFX.fail();
      return; }
    const base = (Math.random()*ITEMS.length)|0;
    let odd = (Math.random()*ITEMS.length)|0; while (odd===base) odd=(Math.random()*ITEMS.length)|0;
    const n = 9, cells = [];
    const oddAt = (Math.random()*n)|0;
    for (let i=0;i<n;i++) cells.push({
      ci: i===oddAt ? odd : base,
      x: W*(0.24 + (i%3)*0.26), y: H*(0.34 + Math.floor(i/3)*0.17), hit:0
    });
    trial.cells = cells; trial.odd = oddAt;
    trial.t = 0; trial.limit = 76 - trial.round*14;
    trial.state='play'; trial.round++;
  }
  function prestoTap(mx,my) {
    if (trial.state!=='play') { if (trial.state==='done' && trial.resultT>40) finishOrdine(); return; }
    for (let i=0;i<trial.cells.length;i++) {
      const c = trial.cells[i];
      if (Math.hypot(mx-c.x,my-c.y) < R*1.2) {
        c.hit=1;
        if (i===trial.odd) { trial.wins++; SFX.pop(trial.wins); twinkleBurst(c.x,c.y,10,'#fff',30); }
        else { SFX.wall(); shake=6; }
        trial.state='gap'; trial.flashT=0; return;
      }
    }
  }
  function stepPresto() {
    if (trial.state==='play') { trial.t++; if (trial.t>trial.limit) { SFX.wall(); shake=5; trial.state='gap'; trial.flashT=0; } }
    else if (trial.state==='gap') { trial.flashT++; for (const c of trial.cells) if (c.hit>0) c.hit=Math.max(0,c.hit-0.07);
      if (trial.flashT>24) nextPresto(); }
    else if (trial.state==='done') { trial.resultT++; if (trial.resultT>150) finishOrdine(); }
  }
  function drawPresto() {
    if (!trial) return;   // resolved and cleared this same frame
    ctx.drawImage(BG,-40,-40,W+80,H+80); ctx.fillStyle='rgba(26,17,25,.82)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#f0b74a'; ctx.font='900 20px Anton, Impact, sans-serif';
    ctx.fillText('PRESTO!', W/2, 46);
    ctx.fillStyle='rgba(247,236,214,.6)'; ctx.font='9px "Space Mono", ui-monospace, Menlo, monospace';
    ctx.fillText('tap the odd one out', W/2, 62);
    for (let i=0;i<trial.need;i++){ const px2=W/2+(i-1)*22, py2=78;
      const played=i<trial.round-(trial.state==='play'?1:0);
      ctx.beginPath(); ctx.arc(px2,py2,6,0,7);
      ctx.fillStyle = !played?'rgba(247,236,214,.18)':(i<trial.wins?'#96b260':'#d13a30'); ctx.fill();
      ctx.strokeStyle='rgba(247,236,214,.35)'; ctx.lineWidth=1.2; ctx.stroke(); }
    if (trial.state==='done') {
      const won=trial.wins>=2;
      ctx.fillStyle=won?'#96b260':'#d13a30'; ctx.font='900 30px Anton, Impact, sans-serif';
      ctx.fillText(won?'BRAVO!':'PECCATO...', W/2, H*0.44);
      ctx.fillStyle='#f7ecd6'; ctx.font='11px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.fillText(won?'pick your skill':'lire instead', W/2, H*0.44+26);
      drawTwinkles(); return;
    }
    if (trial.state==='play') { const f=1-trial.t/trial.limit; const bw=W*0.62, bx=(W-bw)/2, by=H*0.24;
      ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(bx,by,bw,7);
      ctx.fillStyle=f>0.4?'#96b260':f>0.2?'#f0b74a':'#d13a30'; ctx.fillRect(bx,by,bw*Math.max(0,f),7); }
    for (const c of trial.cells) {
      if (trial.state==='gap' && trial.cells.indexOf(c)===trial.odd) {
        ctx.globalAlpha=0.4+0.3*Math.sin(sceneT*0.3); ctx.fillStyle='#96b260';
        ctx.beginPath(); ctx.arc(c.x,c.y,R*1.6,0,7); ctx.fill(); ctx.globalAlpha=1; }
      drawItem(c.x, c.y, c.ci, 1.05 + c.hit*0.4);
    }
    drawTwinkles();
  }

  // ---- 3: MEMORIA — repeat the flashing sequence -------------------------
  function startMemoria() {
    trial = { kind:'memoria', round:0, wins:0, need:3, seq:[], input:[],
              cells:[], showT:0, showIdx:0, state:'ready', resultT:0, glow:-1 };
    scene='trial'; sceneT=0; overlay.classList.remove('on','title');
    nextMemoria();
  }
  function nextMemoria() {
    if (trial.round >= trial.need) { trial.state='done'; trial.resultT=0;
      (trial.wins>=2) ? (SFX.jingle(), twinkleBurst(W/2,H*0.4,30,'#cfe07a',W*0.8)) : SFX.fail();
      return; }
    const n = 4;
    trial.cells = Array.from({length:n},(_,i)=>({
      ci: i, x: W*(0.22+(i%2)*0.56), y: H*(0.36+Math.floor(i/2)*0.22), pulse:0
    }));
    const len = 2 + trial.round;                 // 2 -> 3 -> 4 taps to repeat
    trial.seq = Array.from({length:len},()=>(Math.random()*n)|0);
    trial.input = []; trial.showIdx = 0; trial.showT = 0; trial.glow = -1;
    trial.state = 'show'; trial.round++;
  }
  function memoriaTap(mx,my) {
    if (trial.state!=='play') { if (trial.state==='done' && trial.resultT>40) finishOrdine(); return; }
    for (const c of trial.cells) {
      if (Math.hypot(mx-c.x,my-c.y) < R*1.3) {
        c.pulse = 1;
        trial.input.push(c.ci);
        const idx = trial.input.length-1;
        if (trial.input[idx] !== trial.seq[idx]) { SFX.wall(); shake=6; trial.state='fail'; trial.showT=0; return; }
        SFX.pop(idx);
        if (trial.input.length === trial.seq.length) { trial.wins++; trial.state='succeed'; trial.showT=0; twinkleBurst(c.x,c.y,10,'#fff',30); }
        return;
      }
    }
  }
  function stepMemoria() {
    if (trial.state==='show') {
      trial.showT++;
      if (trial.showT===1 && trial.showIdx<trial.seq.length) trial.glow = trial.seq[trial.showIdx];
      if (trial.showT>26) {
        trial.showT=0; trial.glow=-1; trial.showIdx++;
        if (trial.showIdx>=trial.seq.length) { trial.state='play'; trial.playT=0; }
      }
    } else if (trial.state==='play') {
      // Sitting on 'play' with no tap would hang forever, so it times out
      // to a fail after a few seconds of idling.
      trial.playT = (trial.playT||0) + 1;
      if (trial.playT > 220) { SFX.wall(); shake=6; trial.state='fail'; trial.showT=0; }
    } else if (trial.state==='fail' || trial.state==='succeed') {
      trial.showT++; for (const c of trial.cells) if (c.pulse>0) c.pulse=Math.max(0,c.pulse-0.06);
      if (trial.showT>34) nextMemoria();
    } else if (trial.state==='done') { trial.resultT++; if (trial.resultT>150) finishOrdine(); }
  }
  function drawMemoria() {
    if (!trial) return;   // resolved and cleared this same frame
    ctx.drawImage(BG,-40,-40,W+80,H+80); ctx.fillStyle='rgba(26,17,25,.82)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#f0b74a'; ctx.font='900 20px Anton, Impact, sans-serif';
    ctx.fillText('MEMORIA', W/2, 46);
    ctx.fillStyle='rgba(247,236,214,.6)'; ctx.font='9px "Space Mono", ui-monospace, Menlo, monospace';
    ctx.fillText(trial.state==='show' ? 'watch...' : 'repeat the order', W/2, 62);
    for (let i=0;i<trial.need;i++){ const px2=W/2+(i-1)*22, py2=78;
      const played=i<trial.round-1;
      ctx.beginPath(); ctx.arc(px2,py2,6,0,7);
      ctx.fillStyle = !played?'rgba(247,236,214,.18)':(i<trial.wins?'#96b260':'#d13a30'); ctx.fill();
      ctx.strokeStyle='rgba(247,236,214,.35)'; ctx.lineWidth=1.2; ctx.stroke(); }
    if (trial.state==='done') {
      const won=trial.wins>=2;
      ctx.fillStyle=won?'#96b260':'#d13a30'; ctx.font='900 30px Anton, Impact, sans-serif';
      ctx.fillText(won?'BRAVO!':'PECCATO...', W/2, H*0.44);
      ctx.fillStyle='#f7ecd6'; ctx.font='11px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.fillText(won?'pick your skill':'lire instead', W/2, H*0.44+26);
      drawTwinkles(); return;
    }
    for (const c of trial.cells) {
      const on = c.ci === trial.glow;
      if (on) { ctx.globalAlpha=0.5+0.3*Math.sin(sceneT*0.4); ctx.fillStyle='#f0b74a';
        ctx.beginPath(); ctx.arc(c.x,c.y,R*1.7,0,7); ctx.fill(); ctx.globalAlpha=1; }
      drawItem(c.x, c.y, c.ci, 1.2 + c.pulse*0.35 + (on?0.15:0));
    }
    // progress dots for how many taps entered so far
    if (trial.state==='play') {
      ctx.fillStyle='rgba(247,236,214,.5)';
      for (let i=0;i<trial.seq.length;i++) {
        ctx.beginPath(); ctx.arc(W/2 + (i-(trial.seq.length-1)/2)*16, H*0.86, 4, 0, 7);
        ctx.fillStyle = i<trial.input.length ? '#f0b74a' : 'rgba(247,236,214,.25)'; ctx.fill();
      }
    }
    drawTwinkles();
  }

  // ---- 4: BILANCIA — stop the swinging needle in the golden zone --------
  function startBilancia() {
    trial = { kind:'bilancia', round:0, wins:0, need:3, ang:0, dir:1, speed:0.05,
              zoneA:0, zoneB:0, state:'ready', resultT:0, stoppedAt:null, flashT:0 };
    scene='trial'; sceneT=0; overlay.classList.remove('on','title');
    nextBilancia();
  }
  function nextBilancia() {
    if (trial.round >= trial.need) { trial.state='done'; trial.resultT=0;
      (trial.wins>=2) ? (SFX.jingle(), twinkleBurst(W/2,H*0.4,30,'#cfe07a',W*0.8)) : SFX.fail();
      return; }
    trial.ang = -1; trial.dir = 1;
    trial.speed = 0.045 + trial.round*0.018;
    const zoneW = 0.36 - trial.round*0.07;         // narrower every round
    const c = -0.3 + Math.random()*0.6;
    trial.zoneA = c - zoneW/2; trial.zoneB = c + zoneW/2;
    trial.state='play'; trial.stoppedAt=null; trial.idleT=0; trial.round++;
  }
  function bilanciaTap(mx,my) {
    if (trial.state==='done') { if (trial.resultT>40) finishOrdine(); return; }
    if (trial.state!=='play') return;
    trial.stoppedAt = trial.ang;
    const good = trial.ang >= trial.zoneA && trial.ang <= trial.zoneB;
    if (good) { trial.wins++; SFX.pop(trial.wins); twinkleBurst(W/2,H*0.5,12,'#fff',36); }
    else { SFX.wall(); shake=6; }
    trial.state='gap'; trial.flashT=0;
  }
  function stepBilancia() {
    if (trial.state==='play') {
      trial.ang += trial.dir*trial.speed;
      if (trial.ang>1) { trial.ang=1; trial.dir=-1; } if (trial.ang<-1) { trial.ang=-1; trial.dir=1; }
      // The needle sweeps forever on its own, so an idle player needs a
      // hard cap or the round never ends.
      trial.idleT = (trial.idleT||0) + 1;
      if (trial.idleT > 360) { trial.stoppedAt = trial.ang; SFX.wall(); shake=5; trial.state='gap'; trial.flashT=0; trial.idleT=0; }
    } else if (trial.state==='gap') { trial.flashT++; if (trial.flashT>44) nextBilancia(); }
    else if (trial.state==='done') { trial.resultT++; if (trial.resultT>150) finishOrdine(); }
  }
  function drawBilancia() {
    if (!trial) return;   // resolved and cleared this same frame

  // ---- 5: INCASTRO — tap all bubbles of the called colour, none other ----
  function startIncastro() {

      return; }
    const n = 10, palette = Math.min(4, ITEMS.length);
    const want = (Math.random()*palette)|0;
    const total = 3;   // exactly this many of the target colour
    const cells = [];
    const wantSlots = new Set();
    while (wantSlots.size < total) wantSlots.add((Math.random()*n)|0);
    for (let i=0;i<n;i++) cells.push({
      ci: wantSlots.has(i) ? want : (want + 1 + ((Math.random()*(palette-1))|0)) % palette,
      x: W*(0.18+(i%3)*0.32), y: H*(0.32+Math.floor(i/3)*0.16), hit:0, isWant: wantSlots.has(i)
    });
    trial.cells = cells; trial.want = want; trial.found = 0; trial.wrong = false;
    trial.t = 0; trial.limit = 130 - trial.round*20; trial.state='play'; trial.round++;
  }

      if (c.hit>0.5) continue;
      if (Math.hypot(mx-c.x,my-c.y) < R*1.1) {
        c.hit = 1;
        if (c.isWant) { trial.found++; SFX.pop(trial.found); twinkleBurst(c.x,c.y,8,ITEMS[c.ci].lit,26);
          if (trial.found>=3) { trial.wins++; trial.state='gap'; trial.flashT=0; } }
        else { trial.wrong = true; SFX.wall(); shake=8; trial.state='gap'; trial.flashT=0; }
        return;

  function startSaltaIn() {

      return; }

      x: W*(0.18+(i%3)*0.32), y: H*(0.34+Math.floor(i/3)*0.16)

      ctx.fillStyle = !played?'rgba(247,236,214,.18)':(i<trial.wins?'#96b260':'#d13a30'); ctx.fill();
      ctx.strokeStyle='rgba(247,236,214,.35)'; ctx.lineWidth=1.2; ctx.stroke(); }
    if (trial.state==='done') {
      const won=trial.wins>=2;
      ctx.fillStyle=won?'#96b260':'#d13a30'; ctx.font='900 30px Anton, Impact, sans-serif';
      ctx.fillText(won?'BRAVO!':'PECCATO...', W/2, H*0.44);
      ctx.fillStyle='#f7ecd6'; ctx.font='11px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.fillText(won?'pick your skill':'lire instead', W/2, H*0.44+26);
      drawTwinkles(); return;
    }
    drawItem(W/2, 92, trial.target, 0.7);
    if (trial.state==='show') for (const c of trial.cells) drawItem(c.x,c.y,c.ci,1);
    else {
      for (const c of trial.choices) {
        ctx.fillStyle = c.hit ? '#96b260' : 'rgba(74,53,80,.8)';
        ctx.beginPath(); ctx.arc(c.x,c.y,20,0,7); ctx.fill();
        ctx.strokeStyle='#1a1119'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#f7ecd6'; ctx.font='900 15px Anton, Impact, sans-serif';
        ctx.fillText(String(c.n), c.x, c.y+5);
      }
    }
    drawTwinkles();
  }

  // ---- 10: ASSAGGIO — taste-test: tap the freshest (brightest) ingredient
  function startAssaggio() {
    trial = { kind:'assaggio', round:0, wins:0, need:3, cells:[], best:0,
              t:0, limit:80, state:'ready', flashT:0, resultT:0 };
    scene='trial'; sceneT=0; overlay.classList.remove('on','title');
    nextAssaggio();
  }
  function nextAssaggio() {
    if (trial.round >= trial.need) { trial.state='done'; trial.resultT=0;
      (trial.wins>=2) ? (SFX.jingle(), twinkleBurst(W/2,H*0.4,30,'#cfe07a',W*0.8)) : SFX.fail();
      return; }
    const ci = (Math.random()*ITEMS.length)|0;
    const n = 5;
    const bestIdx = (Math.random()*n)|0;
    const cells = [];
    for (let i=0;i<n;i++) cells.push({
      ci, x: W*(0.16+i*0.17), y: H*0.5, sc: i===bestIdx ? 1.15 : 0.78 + Math.random()*0.16, hit:0
    });
    trial.cells = cells; trial.best = bestIdx;
    trial.t=0; trial.limit=76-trial.round*13; trial.state='play'; trial.round++;
  }
  function assaggioTap(mx,my) {
    if (trial.state!=='play') { if (trial.state==='done' && trial.resultT>40) finishOrdine(); return; }
    for (let i=0;i<trial.cells.length;i++) {
      const c = trial.cells[i];
      if (Math.hypot(mx-c.x,my-c.y) < R*1.3) {
        c.hit=1;
        if (i===trial.best) { trial.wins++; SFX.pop(trial.wins); twinkleBurst(c.x,c.y,10,'#fff',30); }
        else { SFX.wall(); shake=6; }
        trial.state='gap'; trial.flashT=0; return;
      }
    }
  }
  function stepAssaggio() {
    if (trial.state==='play') { trial.t++; if (trial.t>trial.limit) { SFX.wall(); shake=5; trial.state='gap'; trial.flashT=0; } }
    else if (trial.state==='gap') { trial.flashT++; for (const c of trial.cells) if(c.hit>0) c.hit=Math.max(0,c.hit-0.06);
      if (trial.flashT>26) nextAssaggio(); }
    else if (trial.state==='done') { trial.resultT++; if (trial.resultT>150) finishOrdine(); }
  }
  function drawAssaggio() {
    if (!trial) return;   // resolved and cleared this same frame
    ctx.drawImage(BG,-40,-40,W+80,H+80); ctx.fillStyle='rgba(26,17,25,.82)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#f0b74a'; ctx.font='900 20px Anton, Impact, sans-serif';
    ctx.fillText('ASSAGGIO', W/2, 46);
    ctx.fillStyle='rgba(247,236,214,.6)'; ctx.font='9px "Space Mono", ui-monospace, Menlo, monospace';
    ctx.fillText('tap the biggest one', W/2, 62);
    for (let i=0;i<trial.need;i++){ const px2=W/2+(i-1)*22, py2=78;
      const played=i<trial.round-(trial.state==='play'?1:0);
      ctx.beginPath(); ctx.arc(px2,py2,6,0,7);
      ctx.fillStyle = !played?'rgba(247,236,214,.18)':(i<trial.wins?'#96b260':'#d13a30'); ctx.fill();
      ctx.strokeStyle='rgba(247,236,214,.35)'; ctx.lineWidth=1.2; ctx.stroke(); }
    if (trial.state==='done') {
      const won=trial.wins>=2;
      ctx.fillStyle=won?'#96b260':'#d13a30'; ctx.font='900 30px Anton, Impact, sans-serif';
      ctx.fillText(won?'BRAVO!':'PECCATO...', W/2, H*0.44);
      ctx.fillStyle='#f7ecd6'; ctx.font='11px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.fillText(won?'pick your skill':'lire instead', W/2, H*0.44+26);
      drawTwinkles(); return;
    }
    for (const c of trial.cells) drawItem(c.x, c.y, c.ci, c.sc + c.hit*0.3);
    drawTwinkles();
  }

  function skillLv(id) { const k = SAVE.data().skills || {}; return k[id] || 0; }
  function addSkill(id) {
    const sv = SAVE.data();
    sv.skills = sv.skills || {};
    if ((sv.skills[id] || 0) >= SKILL_MAX) return false;
    sv.skills[id] = (sv.skills[id] || 0) + 1;
    SAVE.save();
    return true;
  }
  // Draw three that aren't maxed. Falls back to fewer near the end of a run.
  function drawSkillChoices() {
    const pool = Object.keys(SKILLS).filter(id => skillLv(id) < SKILL_MAX);
    const out = [];
    while (out.length < Math.min(3, pool.length)) {
      const id = pool[(Math.random() * pool.length) | 0];
      if (out.indexOf(id) < 0) out.push(id);
    }
    return out;
  }

  // ---- world: six districts, sixty nodes -------------------------------
  // Districts are themed stretches with their own palette and node mix, so
  // the run reads as a journey through a city rather than a ladder. Any
  // cleared node stays open, and any node adjacent to cleared ground can be
  // replayed or taken later — you are never locked out of a branch.
  // Each district applies a rule to EVERY node inside it, on top of whatever
  // that node's own type does. That's what makes a district a place rather
  // than a reshuffled bag of the same six levels.
  const DISTRICTS = [
    { key:'trattoria', name:'THE TRATTORIA', sub:'where you learn the trade',
      col:'#e0a63c', mix:['normal','normal','ice','dense'],
      rule:'Family kitchen — one extra miss allowed.',
      icon:'fork', mods:{ misses:+1 } },

    { key:'mercato',   name:'THE MARKET',    sub:'everything is for sale',
      col:'#4a8046', mix:['normal','rush','dense','normal'],
      rule:'Haggling pays — +40% lire, but boards start one row deeper.',
      icon:'coin', mods:{ gold:1.4, rows:+1 } },

    { key:'notte',     name:'THE LATE SHIFT',sub:'the city sleeps, you do not',
      col:'#c98a52', mix:['night','blind','normal','ice'],
      rule:'Dim service — five bubble types instead of six.',
      icon:'moon', mods:{ palette:-1 } },

    { key:'porto',     name:'THE DOCKS',     sub:'salt air and cold storage',
      col:'#6aa8c8', mix:['ice','rush','normal','dense'],
      rule:'Sea draught — every shot drifts. Oven runs 30% hotter.',
      icon:'anchor', mods:{ drift:0.045, charge:1.3 } },

    { key:'forno',     name:'THE BAKERY',    sub:'fire, flour, and no mercy',
      col:'#d13a30', mix:['rush','dense','blind','normal'],
      rule:'Furnace heat — sauce falls faster, but bombas hit twice as hard.',
      icon:'flame', mods:{ misses:-1, bomba:2 } },

    { key:'palazzo',   name:'THE PALAZZO',   sub:'they are all watching now',
      col:'#c0302c', mix:['blind','dense','night','rush'],
      rule:'Under judgement — no aim guide anywhere. Double everything.',
      icon:'crown', mods:{ blind:true, score:2, gold:2 } }
  ];
  function districtOf(n) { return n ? DISTRICTS[n.district] : null; }
  function dmod(key, dflt) {
    const d = districtOf(activeNode);
    if (!d || !d.mods || d.mods[key] === undefined) return dflt;
    return d.mods[key];
  }

  const NODES_PER_DISTRICT = 10;
  const ROW_PX = 62;               // vertical spacing between map rows

  // ---- level identity --------------------------------------------------
  // The map is gone, but the variety it provided is not: each level derives
  // a type and a district deterministically from its number, so level 7 is
  // always the same kind of level and the run still has texture and
  // escalation without a screen to navigate.
  // Ordered so no two new mechanics land on the same level. The aim guide
  // vanishes at level 3 on Normal, so level 3 is a plain board: one change
  // at a time, or it reads as the physics breaking rather than a new rule.
  // ---- twists ----------------------------------------------------------
  // From level 4 on, every round carries one twist: a boon or a handicap.
  // Deterministic per level so the sequence is learnable, and alternating
  // so you're never handed two penalties back to back. These sit on top of
  // the level type and the district rule, which is what keeps a run from
  // settling into a rhythm.
  const TWIST_START = 4;
  const BOONS = [
    { id:'doppia',   name:'DOPPIA PORZIONE', it:'double portion',
      desc:'Every pop scores double',            good:true, mods:{ score:2 } },
    { id:'fornone',  name:'FORNO ACCESO',     it:'oven lit',
      desc:'Start with the BOMBA already armed', good:true, mods:{ preArm:true } },
    { id:'manolarga', name:'MANO LARGA',      it:'wide hand',
      desc:'Two extra misses before the sauce',  good:true, mods:{ misses:2 } },
    { id:'guida',    name:'OCCHIO DEL CHEF',  it:"chef's eye",
      desc:'The aim guide returns for this round', good:true, mods:{ forceGuide:true } },
    { id:'oro',      name:'PIOGGIA D\'ORO',   it:'golden rain',
      desc:'Triple lire from this round',        good:true, mods:{ gold:3 } },
    { id:'lento',    name:'SALSA PIGRA',      it:'lazy sauce',
      desc:'The sauce falls half as often',      good:true, mods:{ misses:3 } }
  ];
  const HANDICAPS = [
    { id:'fretta',   name:'FRETTA',           it:'in a hurry',
      desc:'The sauce falls twice as fast',      good:false, mods:{ missMul:0.5, score:1.6 } },
    { id:'nebbia',   name:'NEBBIA',           it:'fog',
      desc:'No aim guide, whatever the level',   good:false, mods:{ blind:true, score:1.8 } },
    { id:'tremore',  name:'MANO TREMANTE',    it:'shaking hand',
      desc:'Every shot drifts as it flies',      good:false, mods:{ drift:0.045, score:1.7 } },
    { id:'stretta',  name:'CUCINA STRETTA',   it:'cramped kitchen',
      desc:'The board starts two rows deeper',   good:false, mods:{ rows:2, score:1.7 } },
    { id:'spento',   name:'FORNO SPENTO',     it:'oven out',
      desc:'The oven charges at half speed',     good:false, mods:{ charge:0.5, score:1.6 } },
    { id:'scarso',   name:'DISPENSA SCARSA',  it:'bare pantry',
      desc:'One fewer bubble type to match',     good:false, mods:{ palette:-1, score:1.5 } }
  ];

  // Alternate boon / handicap, and walk each list so nothing repeats until
  // the whole pool is spent.
  // Scores how punishing a round already is before a twist is applied, so
  // handicaps can be capped rather than piled on. Pattern-matching single
  // collisions failed: it just funnelled every clash onto one handicap.
  function baseLoad(lv) {
    const ty = levelType(lv);
    const dist = DISTRICTS[Math.min(DISTRICTS.length - 1, Math.floor((lv - 1) / 10))];
    const m = dist.mods || {};
    let load = 0;
    if (ty === 'dense' || ty === 'boss') load += 2;
    if (ty === 'blind') load += 2;
    if (ty === 'rush') load += 1;
    if (ty === 'ice') load += 1;
    if (m.blind) load += 2;
    if (m.misses && m.misses < 0) load += 1;
    if (m.rows) load += 1;
    if (m.drift) load += 1;
    if (lv > 30) load += 1;              // late levels are deep on their own
    return load;
  }
  const HANDICAP_WEIGHT = {
    fretta:2, nebbia:3, tremore:2, stretta:3, spento:1, scarso:2
  };
  const LOAD_CEILING = 5;

  function levelTwist(lv) {
    if (lv < TWIST_START) return null;
    const n = lv - TWIST_START;
    const wantBoon = (n % 2) === 0;
    if (wantBoon) return BOONS[Math.floor(n / 2) % BOONS.length];

    // Pick the scheduled handicap, but if the round is already heavy, walk
    // the list for a lighter one. Guarantees a hard round never gets the
    // heaviest penalty on top.
    const load = baseLoad(lv);
    const startIdx = Math.floor(n / 2) % HANDICAPS.length;
    let best = null;
    for (let i = 0; i < HANDICAPS.length; i++) {
      const cand = HANDICAPS[(startIdx + i) % HANDICAPS.length];
      const w = HANDICAP_WEIGHT[cand.id] || 2;
      if (load + w <= LOAD_CEILING) return cand;
      if (!best || w < (HANDICAP_WEIGHT[best.id] || 2)) best = cand;
    }
    return best;   // everything is heavy: take the lightest available
  }

  function tmod(key, dflt) {
    const t = activeTwist;
    if (!t || !t.mods || t.mods[key] === undefined) return dflt;
    return t.mods[key];
  }
  let activeTwist = null;

  const LEVEL_CYCLE = ['normal','dense','normal','rush','ice','night','blind','dense','rush','boss'];

  function levelType(lv) {
    // Boss every 10th, otherwise a fixed rotation so the rhythm is learnable.
    if (lv % 10 === 0) return 'boss';
    return LEVEL_CYCLE[(lv - 1) % LEVEL_CYCLE.length];
  }
  function levelDistrict(lv) {
    return DISTRICTS[Math.min(DISTRICTS.length - 1, Math.floor((lv - 1) / 10))];
  }
  // activeNode is still the handle every modifier reads from; it's now
  // synthesised from the level rather than picked on a map.
  function setLevelIdentity(lv) {
    activeTwist = levelTwist(lv);
    const type = levelType(lv);
    const dIdx = Math.min(DISTRICTS.length - 1, Math.floor((lv - 1) / 10));
    activeNode = { id: lv, type, district: dIdx, row: lv, links: [] };
    return activeNode;
  }
  function isReplay() { return false; }      // no revisiting without a map

  function openShop() {

    function render() {
