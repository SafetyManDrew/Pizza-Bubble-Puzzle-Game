<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1119">
  <meta name="description" content="A 1970s Italian deli bubble shooter. Sling ingredients, build cascades, and don't let the marinara reach you.">
  <meta property="og:title" content="Mamma Mia! Pomodoro Panic">
  <meta property="og:description" content="A 1970s Italian deli bubble shooter. Sling ingredients, build cascades, and don't let the marinara reach you.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pomodoro Panic">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MAMMA MIA! POMODORO PANIC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --paper:  #f7ecd6;
    --ink:    #1a1119;          /* aubergine-black, not mud-brown */
    --marina: #d13a30;
    --basil:  #4a8046;
    --gold:   #f0b74a;
    --awning: #b32a20;
    --wine:   #3a2418;          /* deep surface tint */
    --slate:  #2a1d2b;          /* raised surface */
    --cream:  #fffaf0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--ink);
    background-image:
      radial-gradient(ellipse at 50% -5%, rgba(240,183,74,.16) 0%, transparent 55%),
      radial-gradient(ellipse at 15% 100%, rgba(209,58,48,.13) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(74,128,70,.10) 0%, transparent 50%),
      linear-gradient(170deg, #241630 0%, #1a1119 45%, #150e14 100%);
    color: var(--paper);
    font-family: 'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:6px; overflow:hidden; }

  header { width:100%; max-width:430px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 6px; }

  h1 {
    font-family:'Anton', system-ui, sans-serif;
    font-size:17px; letter-spacing:.02em; text-transform:uppercase;
    color:var(--gold); line-height:1;
    text-shadow: 2px 2px 0 var(--awning), 3px 3px 0 rgba(0,0,0,.5), 0 0 18px rgba(240,183,74,.22);
  }
  h1 small {
    display:block; font-family:'DM Serif Display', serif; font-style:italic;
    font-size:10px; letter-spacing:.16em; color:var(--paper);
    opacity:.55; text-shadow:none; margin-top:2px;
  }

  .stats { display:flex; gap:12px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#a08a68; text-align:right; }
  .stats b { display:block; color:var(--paper); font-size:15px; font-family:"Anton", "Arial Black", Impact, sans-serif; letter-spacing:.04em; }

  #stage {
    position:relative; border-radius:4px; overflow:hidden; background:var(--paper);
    transform-origin: center center;
    box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--gold), 0 0 0 9px var(--ink),
                0 0 34px rgba(240,183,74,.16), 0 24px 70px rgba(0,0,0,.75);
  }
  canvas { display:block; touch-action:none; }

  #overlay {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:15px; text-align:center; padding:26px;
    background:
      radial-gradient(ellipse at 50% 32%, rgba(61,27,46,.55) 0%, transparent 62%),
      radial-gradient(ellipse at 50% 100%, rgba(179,42,32,.28) 0%, transparent 55%),
      linear-gradient(165deg, rgba(36,22,48,.96) 0%, rgba(21,14,20,.97) 100%);
    backdrop-filter: blur(3px);
  }
  #overlay.on { display:flex; }

  #otitle {
    font-family:"Anton", "Arial Black", Impact, sans-serif; font-size:33px; line-height:.95; text-transform:uppercase;
    color:var(--gold);
    text-shadow: 2px 2px 0 var(--awning), 4px 4px 0 rgba(0,0,0,.55),
                 0 0 26px rgba(240,183,74,.35);
    transform:rotate(-2deg);
  }
  #otitle.lose { color:#e8695f; animation:none; }

  /* Attract-mode sign: a slow sway with an occasional shop-neon flicker. */
  @keyframes signSway {
    0%,100% { transform:rotate(-2deg) translateY(0); }
    50%     { transform:rotate(-1deg) translateY(-4px); }
  }
  @keyframes signFlicker {
    0%,100%      { opacity:1; }
    46%,49%      { opacity:1; }
    47%          { opacity:.45; }
    48%          { opacity:.85; }
    92%          { opacity:.6; }
    93%          { opacity:1; }
  }
  #overlay.title #otitle {
    animation: signSway 3.4s ease-in-out infinite, signFlicker 6.5s linear infinite;
  }
  @keyframes btnPulse {
    0%,100% { box-shadow:4px 4px 0 var(--awning); }
    50%     { box-shadow:4px 4px 0 var(--awning), 0 0 18px rgba(224,166,60,.55); }
  }
  #overlay.title button { animation: btnPulse 1.9s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    #overlay.title #otitle, #overlay.title button { animation:none !important; }
  }

  #osub {
    font-family:'DM Serif Display', Georgia, 'Times New Roman', serif; font-style:italic; font-size:13.5px;
    line-height:1.6; color:var(--paper); opacity:.85; max-width:290px;
  }

  button {
    font-family:"Anton", "Arial Black", Impact, sans-serif; font-size:15px; letter-spacing:.1em; text-transform:uppercase;
    padding:13px 30px; border:3px solid var(--ink); border-radius:2px;
    background:linear-gradient(180deg,#f7c95e,#e0a63c); color:var(--ink); cursor:pointer;
    box-shadow: 4px 4px 0 var(--awning), 0 6px 22px rgba(240,183,74,.28);
    transition: transform .07s, box-shadow .07s, filter .12s;
  }
  button:active { transform:translate(4px,4px); box-shadow:0 0 0 var(--awning); }
  button:hover { filter:brightness(1.07); }
  button:focus-visible { outline:3px solid #fff; outline-offset:4px; }

  #modes { display:none; gap:7px; }
  #overlay.title #modes { display:flex; }
  .modebtn {
    font-family:"Anton", "Arial Black", Impact, sans-serif; font-size:11px; letter-spacing:.05em;
    padding:7px 11px; border:2px solid var(--ink); border-radius:2px;
    background:linear-gradient(180deg,#4a3550,#33223c); color:rgba(247,236,214,.9); cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.4); display:flex; flex-direction:column;
    align-items:center; gap:2px; line-height:1; transition:transform .08s, background .12s;
    animation:none !important;
  }
  .modebtn i { font-family:'DM Serif Display', Georgia, 'Times New Roman', serif; font-style:italic;
               font-size:8.5px; opacity:.7; letter-spacing:0; }
  .modebtn.on { background:linear-gradient(180deg,#f7c95e,#e0a63c); color:var(--ink);
                transform:translateY(-3px); box-shadow:3px 3px 0 var(--awning), 0 5px 16px rgba(240,183,74,.3); }
  .modebtn:active { transform:translate(2px,2px); }

  #rankbar { display:none; width:min(280px,86%); flex-direction:column; gap:4px; }
  #overlay.title #rankbar { display:flex; }
  #ranktop { display:flex; justify-content:space-between;
             font-family:'Space Mono',monospace; font-size:9px;
             letter-spacing:.08em; color:var(--gold); }
  #rankxp { opacity:.65; color:var(--paper); }
  #ranktrack {
    height:7px; background:rgba(0,0,0,.45); border:1px solid rgba(242,228,200,.3);
    border-radius:4px; overflow:hidden;
  }
  #rankfill {
    height:100%; width:0%; border-radius:4px;
    background:linear-gradient(90deg,#d13a30,#f0b74a);
    box-shadow:0 0 12px rgba(240,183,74,.45);
    transition:width .5s ease;
  }

  /* In-page dialog. window.prompt/confirm are suppressed or ignored by many
     mobile browsers, which is why Import silently did nothing. */
  #modal {
    position:absolute; inset:0; display:none; z-index:20;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(10,7,12,.88); backdrop-filter:blur(4px);
  }
  #modal.on { display:flex; }
  #modalBox {
    width:min(320px,94%); background:linear-gradient(180deg,#33223c,#241630);
    border:3px solid var(--ink); border-radius:6px; padding:18px 16px;
    box-shadow:0 0 0 3px var(--gold), 0 18px 50px rgba(0,0,0,.75);
    display:flex; flex-direction:column; gap:11px; text-align:center;
  }
  #modalTitle { font-family:"Anton", "Arial Black", Impact, sans-serif; font-size:17px; color:var(--gold);
                letter-spacing:.05em; }
  #modalMsg { font-size:10px; line-height:1.6; color:rgba(247,236,214,.8); }
  #modalField {
    width:100%; box-sizing:border-box; padding:9px; border-radius:4px;
    border:2px solid var(--ink); background:rgba(0,0,0,.4); color:var(--paper);
    font-family:'Space Mono',monospace; font-size:10px; resize:none;
    word-break:break-all; min-height:76px;
  }
  #modalBtns { display:flex; gap:8px; justify-content:center; }
  #modalBtns button {
    font-family:"Anton", "Arial Black", Impact, sans-serif; font-size:12px; letter-spacing:.05em;
    padding:9px 16px; border:2px solid var(--ink); border-radius:3px;
    cursor:pointer; box-shadow:3px 3px 0 var(--awning); animation:none !important;
  }
  #modalOk { background:linear-gradient(180deg,#f7c95e,#e0a63c); color:var(--ink); }
  #modalCancel { background:linear-gradient(180deg,#4a3550,#33223c); color:var(--paper); }

  #savetools { display:none; gap:6px; }
  #overlay.title #savetools { display:flex; }
  .stbtn {
    font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:.08em;
    padding:4px 9px; border:1px solid rgba(242,228,200,.3); border-radius:3px;
    background:rgba(0,0,0,.25); color:rgba(242,228,200,.7); cursor:pointer;
    box-shadow:none; animation:none !important; text-transform:uppercase;
  }
  .stbtn:active { transform:translate(1px,1px); }
  #resumeBtn { background:#3d6b3a; color:var(--paper); }

  #perklist { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; }
  .perkchip {
    font-family:'Space Mono',monospace; font-size:8px; letter-spacing:.05em;
    padding:2px 6px; border-radius:3px; background:rgba(224,166,60,.2);
    border:1px solid rgba(224,166,60,.5); color:var(--gold);
  }

  footer { font-size:9px; letter-spacing:.1em; color:#6d5b44; text-align:center; text-transform:uppercase; max-width:430px; line-height:1.7; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Mamma Mia!<small>Pomodoro Panic</small></h1>
    <div class="stats">
      <span>Lv <b id="lv">1</b></span>
      <span>Lire <b id="sc">0</b></span>
      <span>Record <b id="hi">0</b></span>
      <span id="streakBox" style="display:none">Streak <b id="st">0</b></span>
      <span id="starBox" style="display:none">&#9733; <b id="stel">0</b></span>
      <button id="mute" title="Audio" style="background:none;border:1px solid rgba(242,228,200,.35);
        color:#f2e4c8;font:inherit;font-size:12px;padding:2px 8px;border-radius:4px;cursor:pointer">&#9835;</button>
    </div>
  </header>

  <div id="stage">
    <div id="modal">
      <div id="modalBox">
        <div id="modalTitle"></div>
        <div id="modalMsg"></div>
        <textarea id="modalField" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
        <div id="modalBtns">
          <button id="modalCancel">Cancel</button>
          <button id="modalOk">OK</button>
        </div>
      </div>
    </div>
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div id="otitle">Mamma Mia!</div>
      <div id="osub">The house recipe. Aim guide through level 2, then you shoot blind.</div>
      <div id="modes">
        <button class="modebtn" data-mode="facile"><b>EASY</b><i>per la nonna</i></button>
        <button class="modebtn on" data-mode="normale"><b>NORMAL</b><i>come si deve</i></button>
        <button class="modebtn" data-mode="brutale"><b>HARD</b><i>mamma mia!!</i></button>
      </div>
      <div id="rankbar">
        <div id="ranktop"><span id="rankname">LAVAPIATTI</span><span id="rankxp">0 XP</span></div>
        <div id="ranktrack"><div id="rankfill"></div></div>
        <div id="perklist"></div>
      </div>
      <button id="resumeBtn" style="display:none">Resume</button>
      <button id="btn">Open Up!</button>
      <div id="savetools">
        <button class="stbtn" id="shareBtn">Share</button>
        <button class="stbtn" id="boardBtn">High Scores</button>
        <button class="stbtn" id="expBtn">Export</button>
        <button class="stbtn" id="impBtn">Import</button>
        <button class="stbtn" id="wipeBtn">Erase</button>
      </div>
    </div>
  </div>

  <footer>Point to aim &middot; drag low for power &middot; release to fire &middot; space swaps</footer>
</div>

<script>
(() => {
  'use strict';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const otitle = document.getElementById('otitle');
  const osub = document.getElementById('osub');
  const btn = document.getElementById('btn');
  const lvEl = document.getElementById('lv');
  const scEl = document.getElementById('sc');
  const hiEl = document.getElementById('hi');

  // ---- geometry: bigger sling zone at the bottom ----------------------
  const COLS = 9, ROWS = 14, R = 18, D = R * 2;
  const ROWH = D * 0.866;
  const W = COLS * D + R;
  const SLINGZONE = 176;                       // launcher bay + full room for Giovanni
  const SHOOTY = ROWS * ROWH + D + 74;
  const H = SHOOTY + SLINGZONE - 4;            // extra room for the cast
  const SHOOTX = W / 2;
  const MAXPULL = 108;                         // longer, easier draw

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.scale(DPR, DPR);

  // ---- the case -------------------------------------------------------
  const ITEMS = [
    { id:'tomato',  base:'#d84438', lit:'#ffb0a4', dark:'#7d1a18' },
    { id:'pizza',   base:'#e09428', lit:'#ffd68f', dark:'#7a4a0c' },
    { id:'olive',    base:'#8fa63c', lit:'#cfe07a', dark:'#3f4a14' },
    { id:'mozz',     base:'#f7f0dc', lit:'#ffffff', dark:'#b8ab8a' },
    { id:'lemon',   base:'#f2d840', lit:'#fff6a8', dark:'#9c8214' },
    { id:'prosc',   base:'#e07a86', lit:'#ffc0c4', dark:'#8a3040' }
  ];

  // ---- nonna's mouth --------------------------------------------------
  const ATTACKS = [
    'POMODORO PIERCER!!', 'PEPPERONI STORM!!', 'BASILICO BLADE!!',
    'MOZZARELLA MAYHEM!!', 'LIMONE FLASH!!', 'PROSCIUTTO PUNISHER!!',
    'MARINARA TSUNAMI!!', 'FORNO INFERNO!!', 'GABAGOOL CANNON!!',
    'PESTO OVERDRIVE!!', 'ANTIPASTO ANNIHILATION!!', 'OLIVA OBLITERATION!!'
  ];
  const RANKS = [
    { n:3,  t:'BUONO',        c:'#e0a63c' },
    { n:5,  t:'MOLTO BENE!',  c:'#3d6b3a' },
    { n:7,  t:'PERFETTO!!',   c:'#c0302c' },
    { n:10, t:'SUPER COMBO!!!',c:'#8a5a9c' },
    { n:14, t:'NONNA APPROVES',c:'#c0302c' }
  ];

  // ---- audio ----------------------------------------------------------
  // Synthesized on the fly — no asset loading, no latency, ships anywhere.
  // Every voice is a short envelope on an oscillator or noise burst.
  const SFX = (() => {
    let ac = null, master = null, muted = false;
    function ctx() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.34;
        master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }
    function env(node, t, a, d, peak) {
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
      node.connect(g); g.connect(master);
      return g;
    }
    function tone(freq, dur, type, peak, slideTo) {
      const c = ctx(); if (!c || muted) return;
      const t = c.currentTime;
      const o = c.createOscillator();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      env(o, t, 0.008, dur, peak == null ? 0.3 : peak);
      o.start(t); o.stop(t + dur + 0.05);
    }
    let noiseBuf = null;
    function noise(dur, peak, filtFreq, filtQ) {
      const c = ctx(); if (!c || muted) return;
      const t = c.currentTime;
      if (!noiseBuf) {
        noiseBuf = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const s = c.createBufferSource();
      s.buffer = noiseBuf; s.loop = true;
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = filtFreq || 900;
      f.Q.value = filtQ || 1;
      s.connect(f);
      env(f, t, 0.006, dur, peak == null ? 0.25 : peak);
      s.start(t); s.stop(t + dur + 0.05);
    }
    // Pentatonic ladder — pops climb it as the combo builds, so a long
    // chain literally plays a rising melody instead of the same blip.
    const LADDER = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5, 1568, 1760, 2093];
    return {
      unlock() { ctx(); },
      get muted() { return muted; },
      toggle() {
        muted = !muted;
        if (!muted) { ctx(); tone(660, 0.08, 'triangle', 0.25); }
        try { localStorage.setItem('mm_muted', muted ? '1' : '0'); } catch (e) {}
        return muted;
      },
      init() { try { muted = localStorage.getItem('mm_muted') === '1'; } catch (e) {} },
      pull()   { noise(0.05, 0.06, 320, 4); },
      launch() { tone(180, 0.16, 'sawtooth', 0.22, 70); noise(0.07, 0.14, 1600, 2); },
      wall()   { tone(880, 0.04, 'square', 0.07); },
      land()   { tone(150, 0.09, 'sine', 0.2, 95); noise(0.04, 0.08, 500, 3); },
      pop(step) {
        const f = LADDER[Math.min(step, LADDER.length - 1)];
        tone(f, 0.12, 'triangle', 0.26);
        tone(f * 2, 0.07, 'sine', 0.1);
      },
      cascade(n) {
        const c = ctx(); if (!c || muted) return;
        for (let i = 0; i < Math.min(n, 10); i++)
          setTimeout(() => tone(300 + i * 55, 0.1, 'triangle', 0.16), i * 42);
        tone(70, 0.5, 'sine', 0.3, 40);
        noise(0.35, 0.16, 260, 1);
      },
      rank(tier) { // tier 0..4
        const c = ctx(); if (!c || muted) return;
        const root = [392, 440, 523.25, 587.33, 659.25][Math.min(tier, 4)];
        [1, 1.25, 1.5, 2].forEach((m, i) =>
          setTimeout(() => tone(root * m, 0.34, 'triangle', 0.2), i * 55));
      },
      surge()  { tone(90, 0.7, 'sawtooth', 0.26, 46); noise(0.6, 0.2, 200, 0.8); },
      power()  { tone(523, 0.1, 'square', 0.2); setTimeout(() => tone(1046, 0.22, 'square', 0.2), 90); },
      win() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          setTimeout(() => tone(f, 0.4, 'triangle', 0.24), i * 110));
      },
      lose() {
        [392, 349.23, 293.66, 220].forEach((f, i) =>
          setTimeout(() => tone(f, 0.45, 'sawtooth', 0.2), i * 150));
      },
      ui() { tone(760, 0.05, 'square', 0.14); },

      // ---- classic arcade voices ----
      // Coin: the two-note ding every arcade game has, for lire pickups.
      coin() {
        const c = ctx(); if (!c || muted) return;
        const t = c.currentTime;
        const a = c.createOscillator(); a.type = 'square';
        a.frequency.setValueAtTime(988, t);
        a.frequency.setValueAtTime(1319, t + 0.06);
        env(a, t, 0.005, 0.24, 0.2);
        a.start(t); a.stop(t + 0.3);
      },
      // Explosion: filtered noise sweeping down, for the bomba.
      boom() {
        const c = ctx(); if (!c || muted) return;
        noise(0.42, 0.34, 260, 0.7);
        const t = c.currentTime;
        const o = c.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(180, t);
        o.frequency.exponentialRampToValueAtTime(28, t + 0.4);
        env(o, t, 0.006, 0.4, 0.3);
        o.start(t); o.stop(t + 0.45);
      },
      // Rising four-note fanfare for a level clear.
      jingle() {
        const c = ctx(); if (!c || muted) return;
        const t = c.currentTime;
        [523, 659, 784, 1047].forEach((f, i) => {
          const o = c.createOscillator(); o.type = 'square';
          o.frequency.setValueAtTime(f, t + i * 0.09);
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, t + i * 0.09);
          g.gain.exponentialRampToValueAtTime(0.22, t + i * 0.09 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.18);
          o.connect(g); g.connect(master);
          o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.2);
        });
      },
      // Descending "aww" for a failed mini-game.
      fail() {
        const c = ctx(); if (!c || muted) return;
        const t = c.currentTime;
        [440, 392, 330].forEach((f, i) => {
          const o = c.createOscillator(); o.type = 'triangle';
          o.frequency.setValueAtTime(f, t + i * 0.11);
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, t + i * 0.11);
          g.gain.exponentialRampToValueAtTime(0.2, t + i * 0.11 + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.11 + 0.22);
          o.connect(g); g.connect(master);
          o.start(t + i * 0.11); o.stop(t + i * 0.11 + 0.24);
        });
      }
    };
  })();


  // ---- MUSIC: a 16-bit-style Italian soundtrack -------------------------
  // Fully synthesized, no audio files — square/triangle leads over a
  // pizzicato-style bass, built to read as a chiptune tarantella. Runs on
  // its own AudioContext (mirrors SFX's lazy-init pattern) so it can be
  // muted independently and never fights SFX for the same gain node.
  const MUSIC = (() => {
    let ac = null, master = null, muted = false, playing = false;
    let nextNoteTime = 0, step = 0, timer = null;
    const TEMPO = 148;                      // bpm — brisk, tarantella-ish
    const STEP_DUR = 60 / TEMPO / 2;        // eighth notes

    function ctx() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.16;           // sits under SFX, never competes
        master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }

    function note(freq, t, dur, type, peak) {
      if (!freq) return;                    // 0 = rest
      const o = ac.createOscillator();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.02);
    }
    // Short plucked bass — decays fast, reads as pizzicato rather than a
    // sustained synth pad, which is what keeps this feeling 16-bit rather
    // than ambient.
    function pluck(freq, t, dur) {
      const o = ac.createOscillator();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.8);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur);
    }

    // Percussion. A chiptune tarantella without a drum track reads as
    // ambient; the kick/snare/hat is what makes it arcade.
    let nBuf = null;
    function noiseHit(t, dur, freq, q, peak) {
      if (!nBuf) {
        nBuf = ac.createBuffer(1, ac.sampleRate * 0.4, ac.sampleRate);
        const d = nBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const src = ac.createBufferSource();
      src.buffer = nBuf;
      const f = ac.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const g = ac.createGain();
      g.gain.setValueAtTime(peak, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.02);
    }
    function kick(t) {
      const o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.11);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.42, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.17);
    }
    const snare = t => noiseHit(t, 0.11, 1900, 0.8, 0.18);
    const hat   = t => noiseHit(t, 0.035, 8000, 1.4, 0.07);

    // A minor, I-VI-VII-i tarantella turn — reads as the "Italian folk
    // dance" shape without quoting any real melody.
    const A = 220;
    const SCALE = { // relative semitone offsets from A, for building runs
      i: 0, ii: 2, iii: 3, iv: 5, v: 7, vi: 8, vii: 10, viii: 12
    };
    const hz = semi => A * Math.pow(2, semi / 12);

    // 16-step bass line (2 bars), root notes of i - VI - VII - i
    const BASS = [0,0,0,0, -4,-4,-4,-4, -2,-2,-2,-2, 0,0,0,0].map(o => hz(o));
    // Lead melody: a bouncing figure over the same progression, with rests
    // (0) so it doesn't feel like a wall of notes.
    const LEAD_PATTERNS = [
      [12,0,15,12, 8,0,11,8, 10,0,13,10, 12,15,12,0],
      [15,12,17,15, 11,8,13,11, 13,10,15,13, 15,12,15,0],
      [19,15,12,15, 15,11,8,11, 17,13,10,13, 19,15,19,0],
    ];
    let leadChoice = 0;

    function scheduleBar() {
      const c = ctx(); if (!c) return;
      const lead = LEAD_PATTERNS[leadChoice];
      for (let i = 0; i < 16; i++) {
        const t = nextNoteTime + i * STEP_DUR;
        // bass on the strong eighths
        if (i % 4 === 0) pluck(BASS[i], t, STEP_DUR * 3.4);
        // drums: kick on 1 and 3, snare on 2 and 4, hats on the offbeats
        if (i % 8 === 0) kick(t);
        if (i % 8 === 4) snare(t);
        if (i % 2 === 1) hat(t);
        // lead, square wave for the chiptune edge
        const semi = lead[i];
        if (semi) note(hz(semi), t, STEP_DUR * 0.85, 'square', 0.09);
        // a triangle harmony an octave down every other bar for texture
        if (semi && i % 2 === 0 && leadChoice === 2) note(hz(semi - 12), t, STEP_DUR*1.6, 'triangle', 0.05);
      }
      nextNoteTime += 16 * STEP_DUR;
      leadChoice = (leadChoice + 1) % LEAD_PATTERNS.length;
    }

    function scheduler() {
      const c = ctx(); if (!c) return;
      // look ahead and top up the schedule; avoids relying on setInterval
      // precision for audio timing.
      while (nextNoteTime < c.currentTime + 0.8) scheduleBar();
      timer = setTimeout(scheduler, 150);
    }

    return {
      get muted() { return muted; },
      get playing() { return playing; },
      start() {
        if (playing) return;
        const c = ctx(); if (!c) return;
        playing = true;
        nextNoteTime = c.currentTime + 0.05;
        leadChoice = 0;
        scheduler();
      },
      stop() {
        playing = false;
        if (timer) clearTimeout(timer);
        timer = null;
      },
      toggle() {
        muted = !muted;
        if (master) master.gain.value = muted ? 0 : 0.16;
        try { localStorage.setItem('mm_music_muted', muted ? '1' : '0'); } catch (e) {}
        return muted;
      },
      restoreMute() {
        try { muted = localStorage.getItem('mm_music_muted') === '1'; } catch (e) {}
        if (master) master.gain.value = muted ? 0 : 0.16;
      },
      unlock() { ctx(); }
    };
  })();

  // ---- persistence ----------------------------------------------------
  // Wrapped so a blocked/absent localStorage degrades to in-memory only.
  const SAVE = (() => {
    const KEY = 'mm_save_v1';
    const RUNKEY = 'mm_run_v1';
    const blank = { hi: 0, best: 1, streak: 0, lastPlay: '', totalPops: 0, plays: 0,
                    xp: 0, rank: 0, perks: [], mode: 'normale', modeHi: {},
                    boards: {}, lastName: '',
                    // RPG layer
                    gold: 0, gear: { oven:0, gloves:0, apron:0, cellar:0 },
                    node: 0, mapSeed: 0, cleared: [], curse: null, skills: {},
                    mapVer: 0, stelle: 0, tips: {} };
    // Deep clone, or nested objects stay shared with the template and
    // wipe() restores mutated data instead of clearing it.
    const fresh = () => JSON.parse(JSON.stringify(blank));
    let d = fresh();
    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) d = Object.assign(fresh(), JSON.parse(raw));
      } catch (e) {}
      return d;
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
    return {
      data: () => d,
      load, save,
      // Day-streak bookkeeping. Giovanni greets returning players by name
      // of the streak, which is the cheapest retention hook available.
      touchDay() {
        const today = new Date().toDateString();
        if (d.lastPlay === today) return d.streak;
        const y = new Date(Date.now() - 864e5).toDateString();
        d.streak = (d.lastPlay === y) ? d.streak + 1 : 1;
        d.lastPlay = today; d.plays++; save();
        return d.streak;
      },

      // ---- run state: resume an interrupted game ----
      // Stores the live board so closing the tab mid-level isn't a loss.
      // Written on every settle, so a crash costs at most one shot.
      saveRun(snap) {
        try { localStorage.setItem(RUNKEY, JSON.stringify(snap)); } catch (e) {}
      },
      loadRun() {
        try {
          const raw = localStorage.getItem(RUNKEY);
          if (!raw) return null;
          const r = JSON.parse(raw);
          // Reject anything that doesn't look like a board we can restore.
          if (!r || !Array.isArray(r.grid) || typeof r.level !== 'number') return null;
          return r;
        } catch (e) { return null; }
      },
      clearRun() { try { localStorage.removeItem(RUNKEY); } catch (e) {} },

      // ---- export / import ----
      // Browser storage is easy to lose (cleared cache, private mode, a new
      // device). A copyable code means progress isn't trapped in one browser.
      exportCode() {
        try { return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }
        catch (e) { return ''; }
      },
      importCode(code) {
        try {
          const obj = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
          // Must be a plain object carrying at least one field we recognise.
          // An array or a shapeless blob would otherwise silently wipe
          // progress by merging into defaults.
          if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
          const known = ['hi','xp','rank','perks','plays','totalPops','best','modeHi'];
          if (!known.some(k => Object.prototype.hasOwnProperty.call(obj, k))) return false;
          // Merge rather than replace, so a save from an older build that
          // lacks newer fields still loads with sane defaults.
          d = Object.assign(fresh(), obj);
          if (!Array.isArray(d.perks)) d.perks = [];
          if (typeof d.modeHi !== 'object' || !d.modeHi) d.modeHi = {};
          if (typeof d.xp !== 'number' || !isFinite(d.xp) || d.xp < 0) d.xp = 0;
          if (typeof d.hi !== 'number' || !isFinite(d.hi) || d.hi < 0) d.hi = 0;
          save();
          return true;
        } catch (e) { return false; }
      },
      wipe() {
        d = fresh();
        save();
        try { localStorage.removeItem(RUNKEY); } catch (e) {}
      },

      // ---- high score table ----
      // Ten entries per mode, so facile runs never crowd out brutale ones.
      board(modeKey) {
        d.boards = d.boards || {};
        return (d.boards[modeKey] || []).slice();
      },
      qualifies(modeKey, sc) {
        const b = this.board(modeKey);
        return sc > 0 && (b.length < 10 || sc > b[b.length - 1].sc);
      },
      addScore(modeKey, name, sc, lv) {
        d.boards = d.boards || {};
        const b = d.boards[modeKey] || [];
        const entry = { n: (name || '???').toUpperCase().slice(0, 3), sc, lv, t: Date.now() };
        b.push(entry);
        b.sort((x, y) => y.sc - x.sc);
        d.boards[modeKey] = b.slice(0, 10);
        save();
        return d.boards[modeKey].indexOf(entry);
      }
    };
  })();

  // ---- state ----------------------------------------------------------
  let grid, cur, next, shot, particles, drops, flashes, rays, rings, sparks;
  let level, score, shots, offsetRow, running, over, combo, bestCombo;
  let popups, hiScore = 0, newRecord = false, lastGain = 0, shotsFired, popsMade;
  let sauceDrips, droplets, herbs, splats, surge = 0, frame = 0;
  // Death-scene state. Declared here, with the rest of the game state,
  // because lose() runs startDeathWave() and `let` bindings further down
  // the file are still in the temporal dead zone at that point.
  let waveY = 0, waveOn = false, waveT = 0, waveDone = false;
  const WAVEBITS = [];        // debris carried on the surge
  const LETTERS = [];         // the food letters, one entry per glyph

  // ---- flow + meta state ----
  // All of this is written by lose(), win(), reset() and settle(), which are
  // defined earlier in the file than the systems that own them. `let` and
  // `const` are not hoisted like `function` is, so declaring these further
  // down put them in the temporal dead zone: the first death threw
  // "Cannot access 'waveOn' before initialization" and killed the frame
  // loop. Keeping every mutable cross-cutting binding here avoids that
  // whole class of bug regardless of where the systems are defined.
  let endQueue = [];
  let winCardHTML = '', loseCardHTML = '';
  let lastPlace = -1;
  let pendingInitials = null;
  let scene = 'title';          // 'title' | 'inter' | 'play'
  let sceneT = 0;               // frames elapsed in current scene
  let interData = null;
  // Difficulty table. Pure data with no dependencies, so it lives up here
  // where reset()/settle()/lose() can all reach it safely.
  const MODES = {
    facile: {
      key:'facile', label:'EASY', it:'per la nonna',
      density:0.80, guideThru:4, missBonus:2, scoreMult:0.85,
      rowsAdj:-1, paletteAdj:-1, blurb:'Aim guide through level 4. Roomier boards \u2014 Nonna will let this one slide.'
    },
    normale: {
      key:'normale', label:'NORMAL', it:'come si deve',
      density:0.88, guideThru:2, missBonus:0, scoreMult:1.0,
      rowsAdj:0, paletteAdj:0, blurb:'The house recipe. Aim guide through level 2, then you shoot blind.'
    },
    brutale: {
      key:'brutale', label:'HARD', it:'mamma mia!!',
      density:0.94, guideThru:1, missBonus:-1, scoreMult:1.45,
      rowsAdj:1, paletteAdj:1, blurb:'Guide gone after level 1. Packed boards, 1.45\u00d7 points. Nonna is not being kind.'
    }
  };
  let mode = MODES.normale;

  // Progression tables. Also pure data, also reached from lose()/win().
  const PERKS = {
    forno:   { id:'forno',   name:'FORNO VELOCE',  desc:'Oven charges 30% faster' },
    salsa:   { id:'salsa',   name:'SALSA LENTA',   desc:'+1 miss before the sauce drops' },
    catena:  { id:'catena',  name:'CATENA D\'ORO', desc:'Combo multiplier climbs faster' },
    doppio:  { id:'doppio',  name:'DOPPIO SCOPPIO',desc:'Bomba blast radius +1 ring' },
    fortuna: { id:'fortuna', name:'FORTUNA',       desc:'Start each level with 25% charge' }
  };
  // Rank thresholds — first two land fast to hook, then the curve stretches
  // so the full ladder spans many sessions rather than one sitting.
  const RANK_XP = [0, 600, 1800, 4200, 8500, 15000, 25000, 40000, 62000, 95000];
  // ---- RPG: gear ------------------------------------------------------
  // Bought with gold, permanent, and stacking with perks. Perks are chosen
  // at rank-ups (rare, build-defining); gear is bought steadily (common,
  // incremental). Two currencies so progress never fully stalls.
  const GEAR = {
    oven:   { name:'BRICK OVEN',    max:5, cost:[120,260,520,980,1800],
              desc:'Oven charges faster', per:'+8% charge rate' },
    gloves: { name:'LEATHER GLOVES',max:5, cost:[100,220,450,850,1600],
              desc:'Stronger launch', per:'+4% shot speed' },
    apron:  { name:'HEAVY APRON',   max:3, cost:[200,520,1200],
              desc:'Survive the sauce longer', per:'+1 miss allowed' },
    cellar: { name:'WINE CELLAR',   max:5, cost:[150,320,640,1200,2200],
              desc:'Richer payouts', per:'+6% lire earned' }
  };
  function gearLv(id) { const g = SAVE.data().gear || {}; return g[id] || 0; }
  function gearCost(id) {
    const lv = gearLv(id), t = GEAR[id];
    return lv >= t.max ? null : t.cost[lv];
  }
  function buyGear(id) {
    const sv = SAVE.data(), c = gearCost(id);
    if (c == null || (sv.gold || 0) < c) return false;
    sv.gold -= c;
    sv.gear = sv.gear || {};
    sv.gear[id] = (sv.gear[id] || 0) + 1;
    SAVE.save();
    return true;
  }

  const RANK_NAMES = ['LAVAPIATTI','GARZONE','IMPASTATORE','PIZZAIOLO',
                      'CAPO FORNO','MAESTRO','ARTIGIANO','GRAN MAESTRO',
                      'LEGGENDA','NONNA APPROVED'];
  let pendingPerk = false;      // set when a rank-up owes the player a pick
  let lastXP = 0, rankedUp = false, lastGold = 0, comboGrace = 0, creepWarn = 0;
  let activeNode = null;        // the map node currently being played
  let piz;                      // Giovanni's animation state; initCast() fills it

  // 5x7 bitmap font — each glyph is a column-major list of filled cells.
  const GLYPHS = {
    G:['01110','10001','10000','10111','10001','10001','01111'],
    A:['01110','10001','10001','11111','10001','10001','10001'],
    M:['10001','11011','10101','10101','10001','10001','10001'],
    E:['11111','10000','10000','11110','10000','10000','11111'],
    O:['01110','10001','10001','10001','10001','10001','01110'],
    V:['10001','10001','10001','10001','10001','01010','00100'],
    R:['11110','10001','10001','11110','10100','10010','10001'],
    ' ':['00000','00000','00000','00000','00000','00000','00000']
  };
  let GUIDED = true;                            // aim line only for levels 1-2
  let shake, hitstop, zoom, nagTimer, misses;
  let sling;
  // ---- forno charge ----
  // Cascades and big groups fill the oven. At full it arms one BOMBA shot:
  // a molten bubble that clears its whole neighbourhood on impact. This is
  // the comeback mechanic — the board buries you, then hands you the tool.
  let charge = 0, armed = false, chargeFlash = 0, dayStreak = 0;
  const CHARGE_MAX = 100;
  function addCharge(n) {
    if (armed) return;
    charge = Math.min(CHARGE_MAX, charge + n * (hasPerk('forno') ? 1.3 : 1) * (1 + gearLv('oven') * 0.08) * (1 + skillLv('fuoco') * 0.1) * dmod('charge', 1) * tmod('charge', 1));
    if (charge >= CHARGE_MAX) {
      armed = true; chargeFlash = 1; showTip('bomba');
      cur = -2;                                  // -2 is the bomba sentinel
      SFX.power();
      twinkleBurst(16, SHOOTY - 40, 14, '#ffd98a', 40);
      flash('FORNO PRONTO!', '#e0a63c', 22, H * 0.5, { slam: 1 });
      pizSay('bomb');
      speedRays(12, 'rgba(224,166,60,.35)');
    }
  }

  const makeGrid = () => Array.from({length:ROWS}, () => new Array(COLS).fill(-1));
  const colsIn = r => r % 2 === 0 ? COLS : COLS - 1;
  const cellX = (r,c) => R + c * D + (r % 2 ? R : 0);
  const cellY = r => R + r * ROWH + offsetRow * ROWH;
  const pick = a => a[(Math.random()*a.length)|0];

  function activeItems() {
    const s = new Set();
    for (let r=0;r<ROWS;r++) for (let c=0;c<colsIn(r);c++) if (grid[r][c]>=0) s.add(grid[r][c]);
    return [...s];
  }
  function randItem() {
    const live = activeItems();
    const pool = live.length ? live : [0,1,2,3];
    const lv = skillLv('dispensa');
    if (lv > 0 && live.length > 1) {
      // DISPENSA BUONA weights the draw toward colours that already have a
      // neighbouring pair on the board, so the bubble you get is more often
      // one you can actually use. A uniform draw hands you dead colours,
      // which is the least interesting way to lose.
      if (Math.random() < lv * 0.14) {
        const counts = {};
        for (let r = 0; r < ROWS; r++) {
          const row = grid[r]; if (!row) continue;
          for (let c = 0; c < colsIn(r); c++) {
            const v = row[c];
            if (v >= 0) counts[v] = (counts[v] || 0) + 1;
          }
        }
        // Prefer colours with at least two on the board (a match is possible)
        // Weight by cluster size, not mere presence: activeItems() already
        // filters to on-board colours, so ">=2 exists" was nearly always
        // true and the skill did almost nothing. Favouring the colours with
        // the most on the board is what actually improves a draw.
        let best = -1, bestN = -1;
        for (const i of pool) {
          const n2 = counts[i] || 0;
          if (n2 > bestN) { bestN = n2; best = i; }
        }
        if (best >= 0 && bestN >= 2) return best;
      }
    }
    return pool[(Math.random()*pool.length)|0];
  }

  function seedLevel(n) {
    grid = makeGrid();
    // Rows saturate at the grid limit around level 30, so past that the
    // escalation comes from the ceiling: the sauce begins further down,
    // which shortens every shot and tightens the whole board.
    offsetRow = n <= 24 ? 0 : Math.min(2.2, (n - 24) * 0.06);
    // The base palette hits ITEMS.length by level 4, so a district's palette
    // modifier has to apply AFTER the cap or it does nothing at all.
    const palette = Math.max(3,
      Math.min(4 + Math.floor(n/2) + mode.paletteAdj, ITEMS.length) + dmod('palette', 0) + tmod('palette', 0));

    // ---- difficulty curve --------------------------------------------
    // Rows used to cap at 9 by level 8, which left the last 50 levels flat.
    // The grid holds 14, so the curve now climbs the whole way: a fast
    // ramp early, then a slow grind that keeps escalating to level 60.
    const nodeRows = activeNode && activeNode.type === 'dense' ? 2
                   : activeNode && activeNode.type === 'boss'  ? 2 : 0;
    // Level 1 must stay gentle — it's the tutorial in disguise.
    const curve = n <= 10 ? 3.4 + n * 0.5          // 3.9 -> 8.4 over ten levels
                          : 8.4 + (n - 10) * 0.07; // 8.4 -> 11.9 over the rest
    const rows = Math.max(3, Math.min(
      Math.round(curve) + mode.rowsAdj + nodeRows + dmod('rows', 0) + tmod('rows', 0), 12));

    // Density also creeps, so late boards are packed as well as deep.
    const baseDens = activeNode && activeNode.type === 'dense'
      ? 0.97
      : Math.min(0.97, mode.density + Math.min(0.09, Math.max(0, n - 6) * 0.0018));

    for (let r=0;r<rows;r++) for (let c=0;c<colsIn(r);c++)
      if (Math.random() < baseDens) grid[r][c] = (Math.random()*palette)|0;
    for (let c=0;c<colsIn(0);c++) if (grid[0][c]<0) grid[0][c] = (Math.random()*palette)|0;
  }

  function reset(n) {
    level = n; seedLevel(n);
    cur = randItem(); next = randItem();
    shot = null;
    particles = []; drops = []; flashes = []; rays = []; rings = []; sparks = []; popups = [];
    droplets = []; splats = []; surge = 0;
    sauceDrips = [];
    // 13 drips instead of 5, staggered so the ceiling always has several
    // at different stages of stretching rather than pulsing in unison.
    for (let i=0;i<13;i++) sauceDrips.push({
      x: 14 + Math.random()*(W-28),
      w: 2.4 + Math.random()*4.6,
      len: 2 + Math.random()*16,
      grow: .03 + Math.random()*.075,
      sway: Math.random()*Math.PI*2
    });
    // Chopped veg suspended in the marinara — basil, onion, garlic, pepper,
    // carrot rounds and peppercorns. Mixed sizes so the sauce reads chunky.
    herbs = [];
    const VEG = ['basil','onion','garlic','pepper','carrot','pepcorn','basil','carrot'];
    for (let i=0;i<34;i++) herbs.push({
      x: Math.random(), y: .10+Math.random()*.80,
      r: Math.random()*Math.PI,
      kind: VEG[(Math.random()*VEG.length)|0],
      sc: 0.75 + Math.random()*0.75,
      bob: Math.random()*Math.PI*2
    });
    splats = []; TWINKLES.length = 0;
    shake = 0; hitstop = 0; zoom = 0; shots = 0; combo = 0; comboGrace = 0; bestCombo = 0;
    misses = 0; nagTimer = 320; over = false; shotsFired = 0; popsMade = 0; creepWarn = 0;
    charge = (hasPerk('fortuna') ? CHARGE_MAX * 0.25 : 0) + CHARGE_MAX * skillLv('fortuna') * 0.12;
    charge = Math.min(CHARGE_MAX, charge);
    armed = false; chargeFlash = 0;
    // Must come after `armed = false` or the reset immediately undoes it.
    if (tmod('preArm', false)) { charge = CHARGE_MAX; armed = true; cur = -2; }
    initCast();
    sling = { active:false, aim:-Math.PI/2, power:0, wobble:0, grab:false, startX:0, startY:0 };
    GUIDED = level <= mode.guideThru;
    // Node modifiers layer on top of the difficulty mode.
    if (activeNode) {
      if (activeNode.type === 'blind') GUIDED = false;
      if (activeNode.type === 'boss')  GUIDED = false;
      if (dmod('blind', false))        GUIDED = false;   // district-wide
      if (tmod('blind', false))        GUIDED = false;   // handicap
      if (tmod('forceGuide', false))   GUIDED = true;    // boon overrides all
    }
    lvEl.textContent = level; scEl.textContent = score; hiEl.textContent = hiScore;
  }

  // ---- graph ----------------------------------------------------------
  function neighbors(r,c) {
    const odd = r%2===1, out=[];
    const cand = [[r,c-1],[r,c+1],[r-1,odd?c:c-1],[r-1,odd?c+1:c],[r+1,odd?c:c-1],[r+1,odd?c+1:c]];
    for (const [rr,cc] of cand) if (rr>=0&&rr<ROWS&&cc>=0&&cc<colsIn(rr)) out.push([rr,cc]);
    return out;
  }
  function matchGroup(r,c) {
    const color = grid[r][c], seen = new Set([r+','+c]), stack=[[r,c]], g=[];
    while (stack.length) {
      const [cr,cc] = stack.pop(); g.push([cr,cc]);
      for (const [nr,nc] of neighbors(cr,cc)) {
        const k = nr+','+nc;
        if (!seen.has(k) && grid[nr][nc]===color) { seen.add(k); stack.push([nr,nc]); }
      }
    }
    return g;
  }
  function findFloating() {
    const anch = new Set(), stack=[];
    for (let c=0;c<colsIn(0);c++) if (grid[0][c]>=0) { anch.add('0,'+c); stack.push([0,c]); }
    while (stack.length) {
      const [cr,cc] = stack.pop();
      for (const [nr,nc] of neighbors(cr,cc)) {
        const k = nr+','+nc;
        if (grid[nr][nc]>=0 && !anch.has(k)) { anch.add(k); stack.push([nr,nc]); }
      }
    }
    const loose=[];
    for (let r=0;r<ROWS;r++) for (let c=0;c<colsIn(r);c++)
      if (grid[r][c]>=0 && !anch.has(r+','+c)) loose.push([r,c]);
    return loose;
  }

  // ---- fx spawners ----------------------------------------------------
  const MAX_PARTICLES = 260;
  const MAX_DROPLETS = 120;
  function burst(x,y,ci,n) {
    if (particles.length > MAX_PARTICLES) return;
    for (let i=0;i<(n||12);i++) {
      const a = Math.random()*Math.PI*2, s = 1.6+Math.random()*4.4;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.4,life:1,ci,sz:2.4+Math.random()*2.4});
    }
  }
  function ring(x,y,color,max) {
    rings.push({ x, y, r:4, max:max||70, life:1, color });
  }
  function speedRays(count, color) {
    if (rays.length > 60) return;
    for (let i=0;i<count;i++)
      rays.push({ a: Math.random()*Math.PI*2, len: 60+Math.random()*160, off: Math.random()*90, life:1, color, w: 2+Math.random()*7 });
  }
  function sparkle(x,y,color) {
    if (sparks.length > 70) return;
    sparks.push({ x, y, life:1, color, sz: 7+Math.random()*11, rot: Math.random()*Math.PI, vy:-0.5-Math.random() });
  }

  // ---- twinkle layer ---------------------------------------------------
  // Small four-point stars that pop, hold, then fade. Cheap (no gradients,
  // no sprites) so they can be scattered liberally for a sense of polish.
  const TWINKLES = [];
  const MAX_TWINKLES = 90;
  function twinkle(x, y, color, sizeMul) {
    if (TWINKLES.length >= MAX_TWINKLES) return;
    TWINKLES.push({
      x, y, life: 1,
      col: color || '#fff4c8',
      sz: (2.6 + Math.random() * 3.6) * (sizeMul || 1),
      rot: Math.random() * Math.PI,
      spin: (Math.random() - 0.5) * 0.14,
      vx: (Math.random() - 0.5) * 0.7,
      vy: -0.25 - Math.random() * 0.55,
      decay: 0.018 + Math.random() * 0.022
    });
  }
  function twinkleBurst(x, y, n, color, spread) {
    const sp = spread || 26;
    for (let i = 0; i < n; i++)
      twinkle(x + (Math.random()-.5)*sp, y + (Math.random()-.5)*sp, color);
  }
  function stepTwinkles() {
    for (let i = TWINKLES.length - 1; i >= 0; i--) {
      const t = TWINKLES[i];
      t.x += t.vx; t.y += t.vy; t.vy += 0.008;
      t.rot += t.spin; t.life -= t.decay;
      if (t.life <= 0) TWINKLES.splice(i, 1);
    }
  }
  function drawTwinkles() {
    for (const t of TWINKLES) {
      // ease so it pops in fast and lingers before vanishing
      const e = t.life > 0.8 ? (1 - t.life) * 5 : t.life / 0.8;
      const r = t.sz * e;
      if (r <= 0.2) continue;
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.rotate(t.rot);
      ctx.globalAlpha = Math.min(1, e * 1.2);
      ctx.fillStyle = t.col;
      // four-point star: two crossed lens shapes
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r*0.18, -r*0.18, r, 0);
      ctx.quadraticCurveTo(r*0.18, r*0.18, 0, r);
      ctx.quadraticCurveTo(-r*0.18, r*0.18, -r, 0);
      ctx.quadraticCurveTo(-r*0.18, -r*0.18, 0, -r);
      ctx.fill();
      ctx.globalAlpha = Math.min(1, e) * 0.5;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.28, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function flash(text, color, size, y, opt) {
    flashes.push(Object.assign({
      text, color, size: size||30, y: y||H*0.34,
      life: 1, sk: (Math.random()-0.5)*0.14, slam:1, sub:null, ghost:false
    }, opt||{}));
  }
  function popup(x, y, text, color, size) {
    popups.push({ x, y, text, color, size: size||16, life: 1, vy: -0.9 });
  }

  // ---- fire -----------------------------------------------------------
  const clampAim = a => Math.max(-Math.PI + 0.24, Math.min(-0.24, a));

  function release() {
    if (shot || over || !running) return;
    const p = sling.power;
    sling.active = false;
    if (p < 0.1) { sling.power = 0; return; }
    const a = clampAim(sling.aim);
    const speed = (5 + p * 9) * (1 + gearLv('gloves') * 0.04) * (1 + skillLv('braccio') * 0.05);
    shot = { x:SHOOTX, y:SHOOTY, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, ci:cur, trail:[] };
    // The bomba is consumed by settle(); don't advance the queue past it.
    if (cur !== -2 && cur !== -3) { cur = next; next = randItem(); }
    SFX.launch();
    sling.wobble = 1;
    if (p > 0.85) { speedRays(9, 'rgba(224,166,60,.5)'); shake = 4; }
    sling.power = 0;
  }

  function nearestCell(x,y) {
    let best=null, bd=Infinity;
    // Search outward from the derived cell; fall back to a full scan only
    // if nothing free is nearby.
    const rBase = Math.round((y - R - offsetRow*ROWH) / ROWH);
    for (let r = Math.max(0, rBase-2); r <= Math.min(ROWS-1, rBase+2); r++) {
      const n = colsIn(r), off = r % 2 ? R : 0;
      const cBase = Math.round((x - R - off) / D);
      for (let c = Math.max(0, cBase-2); c <= Math.min(n-1, cBase+2); c++) {
        if (grid[r][c]>=0) continue;
        const dx=x-(R+c*D+off), dy=y-(R+r*ROWH+offsetRow*ROWH), d=dx*dx+dy*dy;
        if (d<bd) { bd=d; best=[r,c]; }
      }
    }
    if (best) return best;
    for (let r=0;r<ROWS;r++) for (let c=0;c<colsIn(r);c++) {
      if (grid[r][c]>=0) continue;
      const dx=x-cellX(r,c), dy=y-cellY(r), d=dx*dx+dy*dy;
      if (d<bd) { bd=d; best=[r,c]; }
    }
    return best;
  }

  function settle(x,y,ci) {
    const cell = nearestCell(x,y);
    if (!cell) return lose();
    const [r,c] = cell;

    // ---- MOZZARELLA MATTA (wild) ----
    // The genre-standard rainbow bubble: it becomes whichever colour it
    // lands against, picking the neighbour with the biggest cluster so it
    // always makes the most useful match available.
    if (ci === -3) {
      let bestCi = -1, bestN = 0;
      const tally = {};
      for (const [nr,nc] of neighbors(r,c)) {
        const v = grid[nr][nc];
        if (v >= 0) tally[v] = (tally[v] || 0) + 1;
      }
      for (const k of Object.keys(tally))
        if (tally[k] > bestN) { bestN = tally[k]; bestCi = +k; }
      if (bestCi < 0) {                        // touching nothing: pick live
        const live = activeItems();
        bestCi = live.length ? live[(Math.random()*live.length)|0] : 0;
      }
      ci = bestCi;
      ring(cellX(r,c), cellY(r), '#ffffff', 120);
      twinkleBurst(cellX(r,c), cellY(r), 16, '#ffffff', 44);
      SFX.power();
      pizSay('bomb');                 // a special: maximum delight
    }

    // ---- BOMBA ----
    // Doesn't place or match: detonates, clearing itself and every
    // neighbour, then lets gravity do the rest through the normal path.
    if (ci === -2) {
      armed = false; charge = 0;
      const bx = cellX(r,c), by = cellY(r);
      shake = 18; hitstop = 11; zoom = 0.06;
      SFX.cascade(8);
      ring(bx, by, '#ffb347', 190);
      ring(bx, by, '#fff2c4', 120);
      speedRays(20, 'rgba(224,120,40,.45)'); SFX.boom();
      twinkleBurst(bx, by, 22, '#ffd98a', 90);
      let hit = [[r,c], ...neighbors(r,c)];
      if (hasPerk('doppio')) {
        // second ring: every neighbour's neighbours, de-duped
        const seen = new Set(hit.map(([a,b]) => a+':'+b));
        for (const [nr,nc] of neighbors(r,c))
          for (const [mr,mc] of neighbors(nr,nc)) {
            const k = mr+':'+mc;
            if (!seen.has(k)) { seen.add(k); hit.push([mr,mc]); }
          }
      }
      let blown = 0;
      for (const [br,bc] of hit) {
        if (grid[br][bc] >= 0) {
          burst(cellX(br,bc), cellY(br), grid[br][bc], 18);
          sparkle(cellX(br,bc), cellY(br), '#ffd98a');
          grid[br][bc] = -1; blown++;
        }
      }
      for (let i=0;i<26;i++) {
        const a = Math.random()*Math.PI*2, sp = 2+Math.random()*5;
        particles.push({ x:bx, y:by, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, ci:1 });
      }
      const loose = findFloating();
      for (const [lr,lc] of loose) {
        drops.push({ x:cellX(lr,lc), y:cellY(lr), vx:(Math.random()-.5)*3.4, vy:-2.4-Math.random()*1.6, ci:grid[lr][lc], rot:0, vr:(Math.random()-.5)*.45 });
        grid[lr][lc] = -1;
      }
      // Payout must beat the cascade that earned the charge, or the meter
      // reads as a downgrade. Blast pays a flat premium, drops scale hard,
      // and the blind-aim multiplier applies as it does everywhere else.
      const bombMult = (1 + (level-1)*0.1) * (GUIDED ? 1 : 1.5);
      const bPts = Math.round(
        (250 + blown * 120 + loose.length * (90 + loose.length * 14)) * bombMult
        * (1 + skillLv('scoppio') * 0.18) * dmod('bomba', 1)
      );
      score += bPts; scEl.textContent = score;
      if (score > hiScore) { hiScore = score; newRecord = true; }
      hiEl.textContent = hiScore;
      popup(bx, by, '+' + bPts, '#e0a63c', 24);
      flash('BOMBA!!', '#e0703c', 34, H*0.36, { slam:1 });
      pizSay('big');
      shotsFired++; misses = 0;
      cur = next; next = randItem();
      let clr = true;
      for (let rr=0; rr<ROWS && clr; rr++)
        for (let cc=0; cc<colsIn(rr); cc++) if (grid[rr][cc]>=0) { clr=false; break; }
      if (clr) return win();
      return;
    }

    grid[r][c] = ci;
    if (r >= ROWS-1 || cellY(r)+R > SHOOTY-D*1.4) return lose();

    const group = matchGroup(r,c);

    shotsFired++;
    if (group.length >= 3) {
      combo++; misses = 0; popsMade++;
      bestCombo = Math.max(bestCombo, combo);

      const gx = cellX(r,c), gy = cellY(r);
      shake = Math.min(14, 4 + group.length * 0.9);
      hitstop = group.length >= 6 ? 9 : 4;
      zoom = Math.min(0.05, group.length * 0.006);

      SFX.pop(Math.min(combo - 1, 10));
      twinkleBurst(gx, gy, 3 + Math.min(7, group.length), ITEMS[ci].lit, 34);
      ring(gx, gy, ITEMS[ci].lit, 40 + group.length * 12);
      for (const [gr,gc] of group) {
        burst(cellX(gr,gc), cellY(gr), grid[gr][gc], 10 + group.length);
        sparkle(cellX(gr,gc), cellY(gr), ITEMS[grid[gr][gc]].lit);
        grid[gr][gc] = -1;
      }
      // ===== SCORING =====
      // Base pops escalate: bubbles past the 3rd are worth progressively more.
      let popPts = 0;
      for (let k = 0; k < group.length; k++) popPts += 10 + k * 5;

      const loose = findFloating();
      for (const [lr,lc] of loose) {
        drops.push({ x:cellX(lr,lc), y:cellY(lr), vx:(Math.random()-.5)*3, vy:-2-Math.random()*1.5, ci:grid[lr][lc], rot:0, vr:(Math.random()-.5)*.4 });
        grid[lr][lc] = -1;
      }
      // Cascades pay far better, and scale with how many fell at once.
      const dropPts = loose.length * (30 + loose.length * 6);

      const total = group.length + loose.length;

      // Streak: consecutive shots that popped something.
      const streakMult = 1 + Math.min(combo - 1, 9) * (hasPerk('catena') ? 0.34 : 0.25);
      const replayCut = (activeNode && isReplay(activeNode)) ? 0.4 : 1;
      const nodeMult = (!activeNode ? 1
        : activeNode.type === 'rush'  ? 2
        : activeNode.type === 'blind' ? 3
        : activeNode.type === 'boss'  ? 2.5
        : activeNode.type === 'dense' ? 1.4
        : activeNode.type === 'ice'   ? 1.8
        : activeNode.type === 'night' ? 1.6 : 1) * replayCut * dmod('score', 1) * tmod('score', 1) * prestigeMult();
      const levelMult  = (1 + (level - 1) * 0.1) * (GUIDED ? 1 : 1.5) * mode.scoreMult
                       * (1 + gearLv('cellar') * 0.06) * nodeMult;

      let gained = Math.round((popPts + dropPts) * streakMult * levelMult);

      // Bonuses
      const bonuses = [];
      if (loose.length >= 3) { const b = loose.length * 40; gained += b; bonuses.push(['VALANGA', b]); }
      if (group.length >= 6) { const b = group.length * 25; gained += b; bonuses.push(['GRANDE', b]); }
      if (combo >= 3)        { const b = combo * 60;        gained += b; bonuses.push(['CATENA ×'+combo, b]); }

      // Oven fills from cascades and fat groups, not from chip shots.
      if (loose.length >= 3) showTip('forno');
      addCharge(loose.length * 7 + Math.max(0, group.length - 3) * 5 + 3);
      if (loose.length >= 3) {
        SFX.cascade(loose.length);
        for (let i = 0; i < Math.min(18, loose.length * 2); i++)
          twinkle(Math.random()*W, H*0.2 + Math.random()*H*0.4, '#ffe9a8', 1.2);
      }

      score += gained;
      scEl.textContent = score;
      if (score > hiScore) { hiScore = score; newRecord = true; }
      hiEl.textContent = hiScore;
      lastGain = gained;

      // floating score popup at the impact point
      popup(gx, gy, '+' + gained, gained >= 800 ? '#8a5a9c' : gained >= 350 ? '#c0302c' : '#3d6b3a', gained >= 350 ? 22 : 17);
      let by = gy + 26;
      for (const [label, amt] of bonuses) {
        popup(gx, by, label + ' +' + amt, '#e0a63c', 12);
        by += 15;
      }

      // the cast reacts
      if (total >= 6) pizSay('big');
      else if (Math.random() < 0.75) pizSay('pop');

      let rank = null;
      for (const rk of RANKS) if (total >= rk.n) rank = rk;

      if (rank) {
        SFX.rank(RANKS.indexOf(rank));
        flash(rank.t, rank.c, total >= 10 ? 38 : total >= 7 ? 32 : 25, H*0.32, { slam:1 });
        if (total >= 7) { speedRays(14, 'rgba(192,48,40,.4)'); ring(W/2, H*0.32, rank.c, 200); }
      }
      if (total >= 6) {
        flash(pick(ATTACKS), '#f2e4c8', 20, H*0.46, { sk:(Math.random()-.5)*.2 });
        speedRays(10, 'rgba(35,24,15,.22)');
      }
      if (combo >= 2) flash('CATENA ×' + combo, '#c0302c', 17 + combo, H*0.57);
      if (combo >= 5) speedRays(18, 'rgba(138,90,156,.35)');

      let empty = true;
      for (let rr=0; rr<ROWS && empty; rr++)
        for (let cc=0; cc<colsIn(rr); cc++) if (grid[rr][cc]>=0) { empty=false; break; }
      if (empty) return win();

    } else {
      // CATENA LUNGA buys grace: a miss burns a grace shot before the
      // chain actually breaks, so a long combo survives one bad angle.
      const grace = skillLv('catena');
      if (grace > 0 && combo > 0 && comboGrace < grace) {
        comboGrace++;
        flash('CATENA TIENE', '#e0a63c', 13, H*0.52);
      } else {
        if (combo >= 3) flash('CATENA ROTTA', '#8a7355', 15, H*0.5);
        combo = 0; comboGrace = 0;
      }
      misses++; shots++;
      // The mood always reacts; only the spoken line is occasional, so he
      // doesn't chatter on every single shot.
      piz.mad = Math.min(1, piz.mad + 0.55);
      piz.happy = 0; piz.ecstatic = 0; piz.lean = 1; piz.bounce = 1;
      for (let i = 0; i < 2 && piz.fume.length < 14; i++)
        piz.fume.push({ x: (Math.random()-.5)*14, y: -58 - Math.random()*6,
                        r: 2 + Math.random()*2.5, life: 1, vy: -0.5 - Math.random()*0.4 });
      if (Math.random() < 0.6) pizSay('miss');
      if (misses >= 4) misses = 0;

      const manoLv = skillLv('mano');
      let limit = Math.max(2, 6 - Math.floor(level/2) + mode.missBonus + (hasPerk('salsa') ? 1 : 0) + gearLv('apron') + (manoLv >= 3 ? 2 : manoLv >= 1 ? 1 : 0));
      if (activeNode && activeNode.type === 'rush') limit = Math.max(1, Math.ceil(limit / 2));
      if (activeNode && activeNode.type === 'night') limit += 2;
      limit = Math.max(1, Math.round((limit + dmod('misses', 0) + tmod('misses', 0)) * tmod('missMul', 1)));
      if (shots >= limit) {
        shots = 0; offsetRow += 0.5; shake = 9;
        surge = 1; SFX.surge(); showTip('sauce');
        speedRays(8, 'rgba(168,36,29,.35)');
        // sauce splatters down
        // The flood: a curtain of droplets across the full width, every
        // hanging drip lurches downward, and a few pinch off immediately.
        const cy2 = 7 + offsetRow*ROWH;
        for (let i=0;i<52;i++)
          droplets.push({ x: Math.random()*W, y: cy2 + Math.random()*10,
            vy: 1.2+Math.random()*3.2, r: 1.6+Math.random()*3.2, life: 1, str: 0,
            veg: Math.random() < 0.5
              ? ['basil','onion','carrot','pepper','pepcorn'][(Math.random()*5)|0] : null,
            vr: (Math.random()-.5)*0.35, rot: Math.random()*7 });
        for (const dp of sauceDrips) {
          dp.len += 9 + Math.random()*13;
          dp.w = Math.min(7.5, dp.w + Math.random()*1.6);
        }
        // three drips let go at once
        for (let i=0;i<3;i++) {
          const dp = sauceDrips[(Math.random()*sauceDrips.length)|0];
          droplets.push({ x: dp.x, y: cy2 + dp.len, vy: 2.4, r: dp.w*0.9, life: 1, str: 0 });
        }
        flash('LA SALSA SALE!', '#c0302c', 18, H*0.63, { sk:0 });
        pizSay('miss');
        for (let rr=0;rr<ROWS;rr++) for (let cc=0;cc<colsIn(rr);cc++)
          if (grid[rr][cc]>=0 && cellY(rr)+R > SHOOTY-D*1.4) return lose();
      }
    }
  }

  function win() {
    over = true; running = false;
    SAVE.clearRun();
    SFX.win(); SFX.jingle();
    twinkleBurst(W/2, H*0.4, 30, '#f7ecd6', W*0.8);
    const sv = SAVE.data();
    sv.best = Math.max(sv.best, level + 1);
    sv.totalPops += popsMade;

    // ===== CLEAR BONUS =====
    const acc = shotsFired ? popsMade / shotsFired : 0;
    const clearBonus = 500 * level;
    const accBonus   = Math.round(acc * 1000);
    const chainBonus = bestCombo * 100;
    // Rows still hanging above the counter were never a threat — reward speed.
    const speedBonus = Math.max(0, (14 - shotsFired)) * 50;
    const totalBonus = clearBonus + accBonus + chainBonus + speedBonus;

    score += totalBonus;
    scEl.textContent = score;
    if (score > hiScore) { hiScore = score; newRecord = true; }
    sv.hi = Math.max(sv.hi, hiScore);
    sv.modeHi = sv.modeHi || {};
    sv.modeHi[mode.key] = Math.max(sv.modeHi[mode.key] || 0, score);
    // XP scales with the mode so brutale runs advance rank faster.
    const xpGain = Math.round((totalBonus * 0.16 + level * 40) * mode.scoreMult);
    const goldGain = Math.round((60 + level * 22 + bestCombo * 8) * mode.scoreMult);
    const rich = (1 + skillLv('ricchezza') * 0.1) * dmod('gold', 1) * tmod('gold', 1);
    sv.gold = (sv.gold || 0) + Math.round(goldGain * rich); lastGold = Math.round(goldGain * rich);
    const ranked = awardXP(xpGain);
    lastXP = xpGain; rankedUp = ranked;
    SAVE.save();

    otitle.textContent = 'Chiuso!'; otitle.className = '';
    osub.innerHTML =
      '<div style="font-family:\'Space Mono\',monospace;font-style:normal;font-size:11px;' +
      'letter-spacing:.06em;line-height:1.9;text-align:left;display:inline-block">' +
      row('LEVEL ' + level + ' CLEAR', clearBonus) +
      row('ACCURACY ' + Math.round(acc*100) + '%', accBonus) +
      row('BEST CHAIN ×' + bestCombo, chainBonus) +
      row('VELOCITÀ', speedBonus) +
      '<div style="border-top:1px solid rgba(242,228,200,.3);margin:6px 0 4px"></div>' +
      row('TOTAL', score, true) +
      row('XP EARNED', lastXP) +
      row('LIRE EARNED', lastGold) +
      (rankedUp ? '<div style="color:#e0a63c;margin-top:5px;font-weight:700">▲ RANKED UP ▲</div>' : '') +
      (newRecord ? '<div style="color:#e0a63c;margin-top:7px;font-weight:700">★ NEW PERSONAL BEST ★</div>' : '') +
      '</div>';

    btn.textContent = 'Level ' + (level+1);
    btn.dataset.act = 'next';
    winCardHTML = osub.innerHTML;
    // Cinematic first; then the queue decides what the player sees next.
    startInterstitial(level + 1);
    endQueue = [];
    if (pendingPerk) endQueue.push('perk');
    endQueue.push('skill');            // a pick after every level clear
    endQueue.push('winCard');
    setTimeout(runEndQueue, 1500);
  }

  // ---- end-of-game stage queue ----------------------------------------
  // Perk pick, initials entry and the score card used to be chained through
  // nested early-returns, which broke whenever two fired at once (a death
  // that both ranked you up AND made the board). An explicit queue means
  // each stage runs exactly once, in order, and always hands off cleanly.
  function runEndQueue() {
    const next = endQueue.shift();
    if (!next) return;
    if (next === 'perk')     { if (!offerPerk()) return runEndQueue(); return; }
    if (next === 'skill') {
      // Earn it: win the trial to pick a skill, lose it and take lire.
      if (!drawSkillChoices().length) return runEndQueue();   // all maxed
      overlay.classList.remove('on');
      // The interstitial owns the scene until it's done; the trial takes
      // over from it explicitly so the two can't fight over `scene`.
      startTrial((won) => {
        if (won) { if (!offerSkill()) runEndQueue(); }
        else {
          // A token payout only. This was 120 + level*18, which matched what
          // clearing the whole level paid — so failing the trial cost the
          // player nothing and the skill stopped feeling earned.
          const sv = SAVE.data();
          const consol = 25 + level * 3;
          sv.gold = (sv.gold || 0) + consol; SAVE.save();
          SFX.coin();
          flashToast('No skill \u2014 +' + consol + ' lire');
          runEndQueue();
        }
      });
      return;
    }
    if (next === 'initials') { askInitials(); return; }
    if (next === 'board')    { showBoard(lastPlace); return; }
    if (next === 'winCard')  { showWinCard(); return; }
    if (next === 'loseCard') { showLoseCard(); return; }
  }
  function showWinCard() {
    osub.onclick = null;   // drop the initials delegate
    otitle.textContent = 'Chiuso!'; otitle.className = '';
    osub.innerHTML = winCardHTML;

    sv.modeHi = sv.modeHi || {};
    sv.modeHi[mode.key] = Math.max(sv.modeHi[mode.key] || 0, score);
    const xpGain = Math.round((score * 0.022 + popsMade * 5) * mode.scoreMult);
    const goldGain = Math.round((14 + popsMade * 1.6) * mode.scoreMult);
    const rich = (1 + skillLv('ricchezza') * 0.1) * dmod('gold', 1);
    sv.gold = (sv.gold || 0) + Math.round(goldGain * rich); lastGold = Math.round(goldGain * rich);
    const ranked = awardXP(xpGain);
    lastXP = xpGain; rankedUp = ranked;
    SAVE.save();
    otitle.textContent = 'Basta!'; otitle.className = 'lose';
    osub.innerHTML =
      '<div style="margin-bottom:10px">"' + pick([

      'letter-spacing:.06em;line-height:1.9;text-align:left;display:inline-block">' +
      row('SCORE', score, true) +
      row('ACCURACY', shotsFired ? Math.round(popsMade/shotsFired*100) : 0) +

      '</div>';
    btn.textContent = 'Play Again';

    scene = 'play';
    loseCardHTML = osub.innerHTML;

    startDeathWave();
    endQueue = [];
    if (pendingPerk) endQueue.push('perk');
    if (SAVE.qualifies(mode.key, score)) endQueue.push('initials');
    endQueue.push('loseCard');
    setTimeout(runEndQueue, 3400);
  }

      endQueue = ['board'];
      runEndQueue();

  }
