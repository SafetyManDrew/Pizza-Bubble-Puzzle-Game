  }

  // --- save tools ---
  const resumeBtn = document.getElementById('resumeBtn');
  // Re-read the saved run and update the button. Called at boot and after
  // any operation that could create or destroy a run (import, wipe, death).
  function refreshResume() {
    const r = SAVE.loadRun();
    if (!r) { resumeBtn.style.display = 'none'; return; }
    resumeBtn.style.display = '';
    resumeBtn.textContent = 'Resume \u2014 Lv ' + r.level +
      ' \u00b7 ' + (r.score || 0).toLocaleString();
  }
  refreshResume();
  resumeBtn.addEventListener('click', () => {
    SFX.unlock(); SFX.ui();
    const r = SAVE.loadRun();
    if (!r) { resumeBtn.style.display = 'none'; return; }
    restoreRun(r);
    overlay.classList.remove('on', 'title');
    btn.dataset.act = '';
    scene = 'play'; sceneT = 0;
    CONFETTI.length = 0; STEAM.length = 0; TITLEBITS.length = 0;
    running = true;
    paintRank();
  });

  // ---- sharing ---------------------------------------------------------
  // Uses the Web Share API on mobile (opens the real system share sheet,
  // so it lands in Messages/WhatsApp properly), and falls back to the
  // clipboard on desktop where that API doesn't exist.
  function shareText(extra) {
    const sv = SAVE.data();
    const best = sv.hi || 0;
    const stars = sv.stelle || 0;
    let msg = 'MAMMA MIA! POMODORO PANIC';
    if (extra) msg += '\n' + extra;
    if (best) msg += '\nMy best: ' + best.toLocaleString() + ' lire';
    if (stars) msg += ' \u00b7 ' + stars + '\u2605';
    msg += '\nThink you can beat that?';
    return msg;
  }
  async function doShare(extra) {
    const text = shareText(extra);
    // Some embedded webviews expose no usable location; fall back to the
    // text alone rather than throwing inside an async handler where the
    // rejection would be invisible to the player.
    let url = '';
    try { url = (location && location.href || '').split('#')[0]; } catch (e) {}
    try {
      if (navigator.share) {
        const payload = { title: 'Mamma Mia! Pomodoro Panic', text };
        if (url) payload.url = url;
        await navigator.share(payload);
        return;
      }
    } catch (e) { /* user cancelled the sheet — not an error */ }
    const full = url ? text + '\n' + url : text;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(full);
        flashToast('Copied \u2014 paste it to a friend');
        return;
      }
    } catch (e) {}
    showModal({
      title: 'SHARE',
      msg: 'Copy this and send it to someone.',
      field: true, value: full, readOnly: true, ok: 'Done', noCancel: true
    });
  }

  // ---- in-page dialog -------------------------------------------------
  // Replaces window.prompt/confirm, which mobile browsers suppress. Returns
  // the entered text (or true) on OK, null on cancel, via callback.
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalMsg = document.getElementById('modalMsg');
  const modalField = document.getElementById('modalField');
  const modalOk = document.getElementById('modalOk');
  const modalCancel = document.getElementById('modalCancel');
  let modalDone = null;

  function showModal(opts) {
    modalTitle.textContent = opts.title || '';
    modalMsg.textContent = opts.msg || '';
    if (opts.field) {
      modalField.style.display = '';
      modalField.value = opts.value || '';
      modalField.readOnly = !!opts.readOnly;
    } else {
      modalField.style.display = 'none';
    }
    modalOk.textContent = opts.ok || 'OK';
    modalCancel.style.display = opts.noCancel ? 'none' : '';
    modalDone = opts.done || null;
    modal.classList.add('on');
    // focus()/select() can throw or be no-ops in some mobile webviews, and
    // this runs inside a timeout where a throw would be silent.
    if (opts.field) setTimeout(() => {
      try {
        if (!opts.readOnly && modalField.focus) modalField.focus();
        else if (opts.readOnly && modalField.select) modalField.select();
      } catch (e) {}
    }, 60);
  }
  function closeModal() { modal.classList.remove('on'); modalDone = null; }
  modalCancel.addEventListener('click', () => { SFX.ui(); closeModal(); });
  modalOk.addEventListener('click', () => {
    SFX.ui();
    const f = modalDone, v = modalField.value;
    closeModal();
    if (f) f(v);
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    SFX.ui(); doShare();
  });

  document.getElementById('boardBtn').addEventListener('click', () => {
    SFX.ui();
    showBoard(-1);
    btn.textContent = 'Back';
    btn.dataset.act = 'backToTitle';
  });

  document.getElementById('expBtn').addEventListener('click', () => {
    SFX.ui();
    const code = SAVE.exportCode();
    if (!code) { flashToast('Nothing to export'); return; }
    // Try the clipboard, but always show the code so it can be copied by
    // hand if the clipboard API is unavailable or denied.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(
        () => flashToast('Copied to clipboard'),
        () => {}
      );
    }
    showModal({
      title: 'YOUR SAVE CODE',
      msg: 'Copy this and keep it somewhere safe. Paste it into Import to restore your progress on any device.',
      field: true, value: code, readOnly: true,
      ok: 'Done', noCancel: true
    });
  });

  document.getElementById('impBtn').addEventListener('click', () => {
    SFX.ui();
    showModal({
      title: 'IMPORT SAVE',
      msg: 'Paste your save code below. This replaces your current rank, perks and records.',
      field: true, value: '', ok: 'Load',
      done: (code) => {
        if (!code || !code.trim()) { flashToast('No code entered'); return; }
        if (SAVE.importCode(code)) {
          const sv = SAVE.data();
          hiScore = sv.hi || 0;
          if (sv.mode && MODES[sv.mode]) mode = MODES[sv.mode];
          hiEl.textContent = hiScore;
          paintModes(); paintRank(); refreshResume();
          reset(1);
          flashToast('Save loaded');
          SFX.power();
        } else {
          flashToast('Invalid code');
        }
      }
    });
  });

  document.getElementById('wipeBtn').addEventListener('click', () => {
    SFX.ui();
    showModal({
      title: 'ERASE EVERYTHING?',
      msg: 'This deletes your rank, perks, high scores and saved run. It cannot be undone.',
      ok: 'Erase',
      done: () => {
        SAVE.wipe();
        hiScore = 0; hiEl.textContent = '0';
        mode = MODES.normale;
        refreshResume();
        paintModes(); paintRank();
        reset(1);
        flashToast('Progress erased');
      }
    });
  });

  // Small non-blocking confirmation strip.
  let toastEl = null, toastT = 0;
  function flashToast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:absolute;left:50%;bottom:14px;transform:translateX(-50%);' +
        'background:rgba(35,24,15,.94);color:#f2e4c8;font-family:"Space Mono", ui-monospace, Menlo, monospace;' +
        'font-size:10px;letter-spacing:.06em;padding:7px 14px;border-radius:4px;' +
        'border:1px solid rgba(224,166,60,.5);pointer-events:none;opacity:0;' +
        'transition:opacity .25s;z-index:9';
      document.getElementById('stage').appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastEl.style.opacity = '0'; }, 1800);
  }

  paintModes(); paintRank();
  dayStreak = SAVE.touchDay();
  const stEl = document.getElementById('st');
  const stBox = document.getElementById('streakBox');
  if (dayStreak > 1) { stEl.textContent = dayStreak; stBox.style.display = ''; }
  const stelEl = document.getElementById('stel');
  const starBox = document.getElementById('starBox');
  if ((_sv.stelle || 0) > 0) { stelEl.textContent = _sv.stelle; starBox.style.display = ''; }
  // Ringer notice: iOS silences WebAudio when the physical switch is set
  // to vibrate, even with the in-page unlock trick applied. There is no
  // way to detect that switch's position from the page, so the honest
  // move is to tell people up front rather than let it look like a bug.
  // Shown once on the title screen, dismissible, remembered after that.
  const ringerNote = document.getElementById('ringerNote');
  let ringerSeen = false;
  try { ringerSeen = localStorage.getItem('mm_ringer_seen') === '1'; } catch (e) {}
  function syncRingerNote() {
    const show = !ringerSeen && scene === 'title';
    ringerNote.classList.toggle('hidden', !show);
  }
  document.getElementById('ringerDismiss').addEventListener('click', () => {
    ringerSeen = true;
    try { localStorage.setItem('mm_ringer_seen', '1'); } catch (e) {}
    syncRingerNote();
  });

  const pauseBtn = document.getElementById('pauseBtn');
  function togglePause() {
    if (tutMode) { endTutorial(false); return; }
    if (!running || over || scene !== 'play') return;
    paused = !paused;
    if (paused) MUSIC.stop();
    else if (!MUSIC.muted) MUSIC.start();
    SFX.ui();
    pauseBtn.style.opacity = paused ? '0.4' : '1';
  }
  pauseBtn.addEventListener('click', () => { unlockAudio(); togglePause(); });

  const infoPanel = document.getElementById('infoPanel');
  const infoBody = document.getElementById('infoBody');
  document.getElementById('infoClose').addEventListener('click', () => { infoPanel.style.display = 'none'; });
  function showInfo(html) { infoBody.innerHTML = html; infoPanel.style.display = 'block'; SFX.ui(); }
  document.getElementById('creditsBtn').addEventListener('click', () => showInfo(
    '<b style="color:#f0b74a">MAMMA MIA! POMODORO PANIC</b> \u2014 ' + BUILD_TAG +
    '<br><br><b>Musica</b> (all chip arrangements of public-domain works):' +
    '<br>\u2022 Tarantella Napoletana \u2014 traditional' +
    '<br>\u2022 Funicul\u00ec Funicul\u00e0 \u2014 Luigi Denza, 1880 (d. 1922)' +
    '<br>\u2022 Santa Lucia \u2014 traditional Neapolitan' +
    '<br>\u2022 La Danza \u2014 Gioachino Rossini, 1835 (d. 1868)' +
    '<br>\u2022 Torna a Surriento \u2014 Ernesto De Curtis, 1902 (d. 1937)' +
    '<br>\u2022 Boss theme \u2014 original' +
    '<br><br>All code-drawn art, all synthesized audio, zero network calls.' +
    '<br><br>Grazie for playing.'));
  document.getElementById('statsBtn').addEventListener('click', () => {
    const sv = SAVE.data();
    showInfo('<b style="color:#f0b74a">STATISTICHE</b><br><br>' +
      'Total pops: <b>' + (sv.totalPops || 0) + '</b><br>' +
      'Best level reached: <b>' + (sv.best || 1) + '</b><br>' +
      'Record score: <b>' + (sv.hi || 0) + '</b><br>' +
      'Stelle (full runs): <b>' + (sv.stelle || 0) + '</b>');
  });
  // With no address configured the button would be a dead end, so it simply
  // does not appear. Set FEEDBACK_EMAIL and it shows up automatically.
  if (!FEEDBACK_EMAIL) {
    const fb = document.getElementById('fbBtn');
    if (fb) fb.style.display = 'none';
  }
  document.getElementById('fbBtn').addEventListener('click', () => showInfo(
    '<b style="color:#f0b74a">FEEDBACK</b><br><br>' +
    (FEEDBACK_EMAIL
      ? 'Found a bug? Have an idea? I would like to hear it.' +
        '<br><br><a style="color:#f0b74a" href="mailto:' + FEEDBACK_EMAIL +
        '?subject=Pomodoro%20Panic%20' + BUILD_TAG + '">' + FEEDBACK_EMAIL + '</a>'
      : 'Thanks for playing! Send bugs and ideas wherever you found this game.') +
    '<br><br><span style="opacity:.6">Build ' + BUILD_TAG + '</span>'));

  document.getElementById('tutBtn').addEventListener('click', () => {
    SFX.ui(); startTutorial();
  });

  // Settings-menu consolidation: rarely-used buttons live behind Menu.
  const menuOnly = document.getElementById('menuOnly');
  const menuBtn = document.getElementById('menuBtn');
  // relocate the utility buttons into the collapsed group
  for (const id of ['expBtn', 'impBtn', 'calmBtn']) {
    const el = document.getElementById(id);
    if (el) menuOnly.appendChild(el);
  }
  // add the two accessibility toggles inside the menu
  const tsBtn = document.createElement('button');
  tsBtn.className = 'stbtn'; tsBtn.id = 'tsBtn';
  const hcBtn = document.createElement('button');
  hcBtn.className = 'stbtn'; hcBtn.id = 'hcBtn';
  menuOnly.appendChild(tsBtn); menuOnly.appendChild(hcBtn);
  function paintAccess() {
    tsBtn.textContent = 'Text: ' + (textScale === 1 ? 'Normal' : textScale === 1.2 ? 'Large' : 'Largest');
    hcBtn.textContent = 'Contrast: ' + (hiCon ? 'High' : 'Normal');
  }
  tsBtn.addEventListener('click', () => {
    textScale = textScale === 1 ? 1.2 : textScale === 1.2 ? 1.35 : 1;
    try { localStorage.setItem('mm_textscale', String(textScale)); } catch (e) {}
    SFX.ui(); paintAccess();
  });
  hcBtn.addEventListener('click', () => {
    hiCon = !hiCon;
    try { localStorage.setItem('mm_hicon', hiCon ? '1' : '0'); } catch (e) {}
    SFX.ui(); paintAccess();
  });
  paintAccess();
  const achBtn = document.createElement('button');
  achBtn.className = 'stbtn'; achBtn.textContent = 'Trophies';
  menuOnly.appendChild(achBtn);
  achBtn.addEventListener('click', () => {
    const got = SAVE.data().ach || {};
    let html = '<b style="color:#f0b74a">TROFEI</b><br><br>';
    for (const k in ACH)
      html += (got[k] ? '\u2605 ' : '\u2606 ') + '<b>' + ACH[k] + '</b><br>';
    showInfo(html);
  });
  const slotBtn = document.createElement('button');
  slotBtn.className = 'stbtn'; slotBtn.textContent = 'Profile: ' + SAVE.slot();
  menuOnly.appendChild(slotBtn);
  slotBtn.addEventListener('click', () => {
    SAVE.setSlot(SAVE.slot() === 'A' ? 'B' : 'A');
    SFX.ui();
    try { location.reload(); } catch (e) { slotBtn.textContent = 'Profile: ' + SAVE.slot(); }
  });
  document.getElementById('dailyBtn').addEventListener('click', () => { SFX.ui(); startDaily(); });
  document.getElementById('twoPBtn').addEventListener('click', () => {
    SFX.ui();
    twoP.active = true; twoP.turn = 0; twoP.tot = [0, 0];
    score = 0; scEl.textContent = 0;
    overlay.classList.remove('on', 'title');
    scene = 'play'; running = true; over = false; paused = false;
    flash('GIOCATORE 1!', '#f0b74a', 24, H * 0.4, { slam: 1 });
    startLevel(1); reset(1);
  });
  menuBtn.addEventListener('click', () => {
    const open = menuOnly.style.display !== 'none';
    menuOnly.style.display = open ? 'none' : 'contents';
    menuBtn.textContent = open ? 'Menu \u2699' : 'Close \u2699';
    SFX.ui();
  });

  const calmBtn = document.getElementById('calmBtn');
  function paintCalm() { calmBtn.textContent = 'Calm FX: ' + (calmFX ? 'On' : 'Off'); }
  calmBtn.addEventListener('click', () => {
    calmFX = !calmFX;
    try { localStorage.setItem('mm_calm3', calmFX ? '1' : '0'); } catch (e) {}
    SFX.ui(); paintCalm();
  });
  paintCalm();

  const muteBtn = document.getElementById('mute');
  function paintMute() { muteBtn.style.opacity = SFX.muted ? '0.4' : '1'; }
  muteBtn.addEventListener('click', () => {
    unlockAudio();
    const nowMuted = !SFX.muted;
    SFX.toggle();
    // Keep music in lockstep with the single mute control.
    if (MUSIC.muted !== nowMuted) MUSIC.toggle();
    if (nowMuted) MUSIC.stop();
    else if (running && !over) MUSIC.start();
    paintMute();
  });
  paintMute();

  buildSprites();
  buildGioSprite();
  buildPizzaSprite();
  buildSplatSprite();
  // Anton may still be loading; repaint the sprites once it lands.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
    buildSprites(); buildGioSprite(); buildPizzaSprite(); buildSplatSprite();
  });
  score = 0; reset(1); running = false;
  hiEl.textContent = hiScore;
  scene = 'title'; MUSIC.setSong(titleSong()); sceneT = 0;
  overlay.classList.add('title');
  overlay.classList.add('on');
  step();
})();
</script>
</body>
</html>
