  // ---- onboarding ------------------------------------------------------
  // Contextual one-liners the first time each mechanic appears. Shown once
  // ever, tracked in the save, and never repeated — a tutorial that doesn't
  // interrupt anyone who already knows how to play.
  const TIPS = {
    launch:  'Drag anywhere to aim \u2014 pull low for a slingshot wind-up.',
    guide:   'The dotted line shows where your shot lands.',
    blind:   'No guide from here. You only see your angle \u2014 shots pay 1.5\u00d7.',
    forno:   'Cascades fill the FORNO. Fill it and your next shot is a BOMBA.',
    bomba:   'Fire it into a crowd \u2014 it clears everything around it.',
    sauce:   'Miss too often and the sauce drops. Do not let it reach you.',
    shop:    'Spend lire on gear. It is permanent \u2014 it carries between runs.',
    skill:   'Pick one every level. These last the whole run.'
  };
  function tipSeen(k) { return ((SAVE.data().tips || {})[k]) === 1; }
  function showTip(k) {
    if (tipSeen(k) || !TIPS[k]) return;
    const sv = SAVE.data();
    sv.tips = sv.tips || {}; sv.tips[k] = 1; SAVE.save();
    tipText = TIPS[k]; tipLife = 1;
  }
  let tipText = '', tipLife = 0;
  function drawTip() {
    if (tipLife <= 0) return;
    const a = Math.min(1, tipLife * 2.5);
    const boxH = 40, y = H * 0.20;
    ctx.globalAlpha = a * 0.94;
    ctx.fillStyle = '#1a1119';
    ctx.fillRect(10, y, W - 20, boxH);
    ctx.strokeStyle = '#f0b74a'; ctx.lineWidth = 2;
    ctx.strokeRect(10, y, W - 20, boxH);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f7ecd6';
    ctx.font = '8.5px "Space Mono", ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    // wrap into two lines
    const words = tipText.split(' ');
    let l1 = '', l2 = '';
    for (const w of words) {
      if (ctx.measureText(l1 + w).width < W - 44 && !l2) l1 += w + ' ';
      else l2 += w + ' ';
    }
    ctx.fillText(l1.trim(), W / 2, y + 17);
    if (l2) ctx.fillText(l2.trim(), W / 2, y + 29);
    ctx.globalAlpha = 1;
  }

  // ---- level flow -----------------------------------------------------
  // Straight from one level to the next. Shops appear on a schedule instead
  // of being placed on a map, so the upgrade loop survives intact.
  const SHOP_EVERY = 3;          // a market between every third level
  const FINAL_LEVEL = 60;

  // Finishing all sixty promotes you: the run restarts harder, keeping every
  // skill and piece of gear, with a permanent score multiplier. Without this
  // the game simply stops, which is the least satisfying way for a run to end.
  function stellePrestige() { return SAVE.data().stelle || 0; }
  function prestigeMult() { return 1 + stellePrestige() * 0.5; }

  function startLevel(lv) {
    if (!MUSIC.muted) MUSIC.start();
    // Past the final level the run prestiges: a star, a harder restart, and
    // everything you earned carries over.
    if (lv > FINAL_LEVEL) {
      const sv = SAVE.data();
      sv.stelle = (sv.stelle || 0) + 1;
      SAVE.save();
      lv = 1;
      flash('\u2605 ' + sv.stelle + ' STELLE \u2605', '#f0b74a', 30, H * 0.32, { slam: 1 });
      confettiBurst(90, W / 2, H * 0.5);
      SFX.rank(4);
    }
    level = lv;
    setLevelIdentity(lv);
    scene = 'play'; sceneT = 0;
    CONFETTI.length = 0; STEAM.length = 0; TITLEBITS.length = 0;
    waveOn = false; waveDone = false; LETTERS.length = 0; WAVEBITS.length = 0;
    overlay.classList.remove('on', 'title');
    reset(lv);
    running = true; over = false;
    if (lv === 1) setTimeout(() => showTip('launch'), 900);
    if (!GUIDED) showTip('blind'); else if (lv === 1) setTimeout(() => showTip('guide'), 2600);
    const t = NODE_TYPES[activeNode.type];
    const d = levelDistrict(lv);
    // Announce what kind of level this is, and the district rule with it.
    flash(t.name, t.col, 22, H * 0.40, { slam: 1 });
    setTimeout(() => { if (running && !over) flash(d.name, d.col, 15, H * 0.52); }, 620);
    // The twist is the thing the player most needs to read, so it lands
    // last and largest, colour-coded by whether it helps or hurts.
    if (activeTwist) {
      // Capture the twist by value: the callback fires 1.25s later, and if
      // the player dies or a new level starts in that window activeTwist
      // may already be null or replaced.
      const tw = activeTwist, forLevel = lv;
      setTimeout(() => {
        if (!running || over || level !== forLevel || !tw) return;
        flash(tw.name, tw.good ? '#96b260' : '#d13a30', 20, H * 0.62, { slam: 1 });
        if (tw.good) twinkleBurst(W/2, H*0.62, 22, '#cfe07a', W*0.7);
        else         speedRays(10, 'rgba(209,58,48,.35)');
        tipText = tw.desc; tipLife = 1.4;
      }, 1250);
    }
    pizSay(activeNode.type === 'boss' ? 'big' : 'idle');
  }

  function drawSling() {
    const a = clampAim(sling.aim);
    const pull = sling.power * MAXPULL;
    const wob = sling.wobble > 0 ? Math.sin(sling.wobble * 22) * sling.wobble * 7 : 0;
    const bx = SHOOTX - Math.cos(a)*pull;
    const by = SHOOTY - Math.sin(a)*pull;

    // chunky Y-frame
    const armS = 52, armA = 0.72;
    const lx = SHOOTX - Math.cos(armA)*armS + wob*0.3;
    const ly = SHOOTY - armS*0.72;
    const rx = SHOOTX + Math.cos(armA)*armS - wob*0.3;
    const ry = SHOOTY - armS*0.72;

    // bay floor
    ctx.fillStyle = 'rgba(35,24,15,.09)';
    ctx.fillRect(0, SHOOTY - 6, W, H - SHOOTY + 6);
    ctx.strokeStyle = 'rgba(35,24,15,.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, SHOOTY-6); ctx.lineTo(W, SHOOTY-6); ctx.stroke();

    // post
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 20;
    ctx.beginPath(); ctx.moveTo(SHOOTX, SHOOTY+50); ctx.lineTo(SHOOTX, SHOOTY-4); ctx.stroke();
    ctx.strokeStyle = '#8a6236'; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.moveTo(SHOOTX, SHOOTY+48); ctx.lineTo(SHOOTX, SHOOTY-4); ctx.stroke();

    // arms
    ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.moveTo(SHOOTX, SHOOTY-2); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SHOOTX, SHOOTY-2); ctx.lineTo(rx, ry); ctx.stroke();
    ctx.strokeStyle = '#8a6236'; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(SHOOTX, SHOOTY-2); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SHOOTX, SHOOTY-2); ctx.lineTo(rx, ry); ctx.stroke();

    // wood grain
    ctx.strokeStyle = 'rgba(35,24,15,.22)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(SHOOTX-3, SHOOTY+44); ctx.lineTo(SHOOTX-3, SHOOTY-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SHOOTX+4, SHOOTY+40); ctx.lineTo(SHOOTX+4, SHOOTY-2); ctx.stroke();

    // base bolt
    ctx.fillStyle = '#e0a63c';
    ctx.beginPath(); ctx.arc(SHOOTX, SHOOTY+50, 9, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#23180f'; ctx.lineWidth = 2.4; ctx.stroke();

    if (!shot) {
      // bands
      const tension = 5.5 - sling.power*2.4;
      ctx.strokeStyle = '#7a1a15'; ctx.lineWidth = tension + 2;
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(bx,by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(bx,by); ctx.stroke();
      ctx.strokeStyle = '#c0302c'; ctx.lineWidth = tension;
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(bx,by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(bx,by); ctx.stroke();

      // pouch
      ctx.save(); ctx.translate(bx,by); ctx.rotate(a + Math.PI/2);
      ctx.fillStyle = '#4a2f18';
      ctx.beginPath(); ctx.roundRect(-R*0.95, -6, R*1.9, 12, 4); ctx.fill();
      ctx.strokeStyle = '#23180f'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.restore();

      // loaded item, squashing under tension
      drawItem(bx, by, cur, 1.12, 0, sling.power*0.1);

      // charge glow at high pull
      if (sling.power > 0.72) {
        const g = (sling.power-0.72)/0.28;
        ctx.globalAlpha = g*0.65;
        ctx.strokeStyle = '#e0a63c'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(bx, by, R*1.5 + Math.sin(frame*0.26)*3, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
        if (Math.random() < 0.3) sparkle(bx + (Math.random()-.5)*40, by + (Math.random()-.5)*40, '#e0a63c');
      }
    } else {
      // snapped-back bands
      const sag = sling.wobble * 16;
      ctx.strokeStyle = '#c0302c'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(lx,ly);
      ctx.quadraticCurveTo(SHOOTX, SHOOTY + sag, rx, ry);
      ctx.stroke();
    }

    // power meter
    if (sling.power > 0.04) {
      const mw = 110, mx = SHOOTX - mw/2, my = SHOOTY + 64;
      ctx.fillStyle = 'rgba(35,24,15,.16)';
      ctx.beginPath(); ctx.roundRect(mx, my, mw, 8, 4); ctx.fill();
      ctx.fillStyle = sling.power > 0.85 ? '#c0302c' : sling.power > 0.55 ? '#e0a63c' : '#8a7355';
      ctx.beginPath(); ctx.roundRect(mx, my, mw*sling.power, 8, 4); ctx.fill();
      if (sling.power > 0.85) {
        ctx.fillStyle = '#c0302c';
        ctx.font = '900 10px Anton, Impact, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('FORZA!!', SHOOTX, my - 4);
      }
    }

    // on deck
    drawItem(SHOOTX + 74, SHOOTY + 16, next, 0.6);
    ctx.fillStyle = '#8a7355';
    ctx.font = 'bold 7px "Space Mono", ui-monospace, Menlo, monospace'; ctx.textAlign = 'center';
    ctx.fillText('PROSSIMO', SHOOTX + 74, SHOOTY + 38);
  }

  // ===================== GIOVANNI, THE PIZZAIOLO =====================
  // The game's only character. He stands in the bottom-left, full size,
  // tosses dough, and narrates every shot.
  const PIZZA_LINES = {
    pop:  ['che bello~', 'bravo!', 'perfetto!', 'sì sì sì!', 'bellissimo~', 'molto bene~'],
    big:  ['MAMMA MIA!!', 'SANTO CIELO!!', 'CHE MERAVIGLIA!!', 'BENISSIMO!!', 'AMORE MIO!!', 'MAGNIFICO!!'],
    miss: ['ohi ohi ohi...', 'aiuto~', 'quasi!', 'coraggio!', 'un altro!', 'no problema~'],
    bomb: ['THE FORNO IS READY!!', 'BOMBA MIA!!', 'now we COOK!!', 'stand back, amore!!'],
    streak:['you came back!~', 'every day, bello~', 'my best customer~', 'the usual? sì~'],
    idle: ['ciao bello~', 'more cheese?', 'is-a nice day~', 'i make you a pie~',
           'buon appetito~', 'the dough, she rises~', 'amore e pizza~',
           'you hungry? i cook~', 'extra basilico?', "that's amore~",
           'the oven, she is hot~', 'mangia, mangia~']
  };

  function initCast() {
    piz = { say:'', life:0, bounce:0, happy:0, blink:0, toss:0, spin:0, lean:0,
            mad:0, ecstatic:0, steam:0, fume:[] };
  }
  function pizSay(pool) {
    piz.say = pick(PIZZA_LINES[pool]);
    piz.life = 1; piz.bounce = 1;
    if (pool === 'pop')  { piz.happy = 1; piz.toss = 1; piz.mad = 0; }
    if (pool === 'big')  { piz.happy = 1; piz.toss = 1; piz.mad = 0; piz.ecstatic = 1; }
    if (pool === 'bomb') { piz.happy = 1; piz.toss = 1; piz.mad = 0; piz.ecstatic = 1.3; }
    if (pool === 'miss') {
      // A dud shot makes him cross, not just wobbly: red face, angled
      // brows, a grimace, and steam off the toque.
      piz.lean = 1; piz.mad = 1; piz.happy = 0; piz.ecstatic = 0;
      piz.steam = 1;
      for (let i = 0; i < 3 && piz.fume.length < 14; i++)
        piz.fume.push({ x: (Math.random()-.5)*14, y: -58 - Math.random()*6,
                        r: 2 + Math.random()*2.5, life: 1, vy: -0.5 - Math.random()*0.4 });
    }
  }

  // ---- speech bubble ----
  function speech(cx, cy, text, life, side, color) {
    if (life <= 0 || !text) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, life * 2.2);
    ctx.font = '900 12px Anton, Impact, sans-serif';
    ctx.textAlign = 'center';
    const w = Math.max(46, ctx.measureText(text).width + 18);
    const h = 24;
    const pop = life > 0.85 ? 0.7 + (1 - life) / 0.15 * 0.3 : 1;

    // keep the whole bubble on canvas no matter how long the line is
    const half = w / 2;
    const px = Math.max(half + 4, Math.min(W - half - 4, cx));
    const tailDx = cx - px;                 // tail still points at his head

    ctx.translate(px, cy);
    ctx.scale(pop, pop);

    ctx.fillStyle = '#f7f1e2';
    ctx.strokeStyle = '#23180f';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.roundRect(-half, -h, w, h, 7);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tailDx + side * 6, 0);
    ctx.lineTo(tailDx + side * 16, 10);
    ctx.lineTo(tailDx + side * 17, -1);
    ctx.closePath();
    ctx.fillStyle = '#f7f1e2'; ctx.fill();
    ctx.strokeStyle = '#23180f'; ctx.lineWidth = 2.4; ctx.stroke();

    ctx.fillStyle = color || '#23180f';
    ctx.fillText(text, 0, -7);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---- Giovanni ----
  // Giovanni's torso never changes — only his face, arms and dough do.
  // Painting it once to an offscreen canvas cuts ~90 path ops per frame.
  function paintGioBody(c) {
    // shadow
    c.fillStyle = 'rgba(35,24,15,.18)';
    c.beginPath(); c.ellipse(0, 1, 21, 4.6, 0, 0, Math.PI*2); c.fill();

    // ---- legs + shoes ----
    c.strokeStyle = '#3a3a42'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-6, -8); c.lineTo(-7.5, -1); c.stroke();
    c.beginPath(); c.moveTo(6, -8); c.lineTo(7.5, -1); c.stroke();
    c.fillStyle = '#2a2a30';
    c.beginPath(); c.ellipse(-8.5, -0.5, 5, 2.4, 0, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(8.5, -0.5, 5, 2.4, 0, 0, Math.PI*2); c.fill();

    // ---- body: white shirt ----
    c.fillStyle = '#f7f1e2';
    c.beginPath();
    c.moveTo(-15, -8);
    c.quadraticCurveTo(-17.5, -30, 0, -31.5);
    c.quadraticCurveTo(17.5, -30, 15, -8);
    c.closePath(); c.fill();
    c.strokeStyle = '#23180f'; c.lineWidth = 1.6; c.stroke();

    // rolled sleeves
    c.fillStyle = '#e9e2d0';
    c.beginPath(); c.ellipse(-14, -25, 4.5, 5.5, 0.3, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(14, -25, 4.5, 5.5, -0.3, 0, Math.PI*2); c.fill();
    c.strokeStyle = 'rgba(35,24,15,.5)'; c.lineWidth = 1.2;
    c.beginPath(); c.ellipse(-14, -25, 4.5, 5.5, 0.3, 0, Math.PI*2); c.stroke();
    c.beginPath(); c.ellipse(14, -25, 4.5, 5.5, -0.3, 0, Math.PI*2); c.stroke();

    // ---- apron ----
    c.fillStyle = '#e4ddc9';
    c.beginPath();
    c.moveTo(-9.5, -25); c.lineTo(9.5, -25);
    c.lineTo(11.5, -8); c.quadraticCurveTo(0, -6, -11.5, -8);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(35,24,15,.45)'; c.lineWidth = 1.3; c.stroke();
    // apron straps
    c.strokeStyle = '#d6cdb6'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-8, -25); c.lineTo(-5, -30); c.stroke();
    c.beginPath(); c.moveTo(8, -25); c.lineTo(5, -30); c.stroke();
    // flour handprints
    c.fillStyle = 'rgba(255,255,255,.8)';
    c.beginPath(); c.ellipse(-4.5, -17, 3.4, 4.2, 0.35, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(5, -14, 2.6, 3.2, -0.3, 0, Math.PI*2); c.fill();
    // a little sauce splash
    c.fillStyle = 'rgba(192,48,44,.55)';
    c.beginPath(); c.arc(2, -21, 1.6, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(-1, -23, 1, 0, Math.PI*2); c.fill();

    // ---- tricolore neckerchief ----
    c.fillStyle = '#3d6b3a';
    c.beginPath(); c.ellipse(-4.5, -29, 5, 3.4, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#f7f1e2';
    c.beginPath(); c.ellipse(0, -29.5, 4, 3.4, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = '#c0302c';
    c.beginPath(); c.ellipse(4.5, -29, 5, 3.4, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = 'rgba(35,24,15,.35)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(0, -29.2, 9.5, 3.6, 0, 0, Math.PI*2); c.stroke();

  }
  let GIO_SPR = null;
  const GIO_PAD = 40, GIO_OX = 40, GIO_OY = 46;   // local-space origin in the sprite
  function buildGioSprite() {
    const w = 80, h = 60;                          // covers x -40..40, y -46..14
    const cv2 = document.createElement('canvas');
    cv2.width = w * DPR; cv2.height = h * DPR;
    const c = cv2.getContext('2d');
    c.scale(DPR, DPR);
    c.translate(GIO_OX, GIO_OY);
    paintGioBody(c);
    GIO_SPR = cv2;
  }

  function drawPizzaiolo() {
    const bx = 70, by = H - 20;          // room below for shadow + nameplate
    const b = piz.bounce;
    const t = frame * 0.042;
    const breathe = Math.sin(t) * 1.6;
    const shout = piz.life > 0.5 ? (piz.life - 0.5) * 2 : 0;
    // He's the differentiator, so he's drawn large. 2.15 is the ceiling
    // before the tossed dough crosses the board line at y=SHOOTY.
    const K = 2.15;                        // overall character scale

    ctx.save();
    ctx.translate(bx, by + breathe * 0.4);
    ctx.translate(0, -b * 7);
    ctx.rotate(piz.lean * Math.sin(frame * 0.4) * 0.05);
    // Cross Giovanni physically shakes with it.
    if (piz.mad > 0.05) {
      ctx.translate(Math.sin(frame * 0.9) * piz.mad * 1.8, 0);
      ctx.rotate(Math.sin(frame * 0.7) * piz.mad * 0.03);
    }
    ctx.scale(K * (1 + b * 0.07), K * (1 - b * 0.05));

    // cached torso blit (see paintGioBody)
    if (GIO_SPR) {
      ctx.drawImage(GIO_SPR, -GIO_OX, -GIO_OY, 80, 60);
    } else {
      paintGioBody(ctx);
    }

    // ---- arms + hands ----
    const up = shout * 0.9 + piz.happy * 0.55;
    const lax = -18 - up * 3, lay = -30 - up * 15;
    const rax =  18 + up * 3, ray = -30 - up * 15;
    // Curved rather than straight: at this scale a rigid line reads as stiff.
    // Elbows bow outward and swing slightly with the breathe cycle.
    const sway = Math.sin(t * 1.3) * 0.9;
    ctx.strokeStyle = '#f0c79a'; ctx.lineWidth = 5.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-13.5, -24);
    ctx.quadraticCurveTo(-21 - up * 2 + sway, -26 - up * 6, lax, lay);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(13.5, -24);
    ctx.quadraticCurveTo(21 + up * 2 + sway, -26 - up * 6, rax, ray);
    ctx.stroke();
    // hands
    ctx.fillStyle = '#f6d3a8'; ctx.strokeStyle = '#23180f'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(lax, lay, 3.8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(rax, ray, 3.8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // fingers — three short strokes per hand, splayed when his arms are up
    ctx.strokeStyle = 'rgba(35,24,15,.45)'; ctx.lineWidth = 0.9;
    for (const [hx, hy, dir] of [[lax, lay, -1], [rax, ray, 1]]) {
      for (let f = -1; f <= 1; f++) {
        const a = -Math.PI / 2 + f * (0.42 + up * 0.16) + dir * 0.12;
        ctx.beginPath();
        ctx.moveTo(hx + Math.cos(a) * 2.2, hy + Math.sin(a) * 2.2);
        ctx.lineTo(hx + Math.cos(a) * 4.4, hy + Math.sin(a) * 4.4);
        ctx.stroke();
      }
    }

    // ---- spinning dough ----
    if (piz.toss > 0.05) {
      const ty = -54 - piz.toss * 16;
      ctx.save();
      ctx.translate(0, ty);
      ctx.rotate(piz.spin);
      ctx.scale(1, 0.32);
      ctx.fillStyle = '#efe0c0';
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#c9a878'; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.fillStyle = 'rgba(201,168,120,.4)';
      ctx.beginPath(); ctx.arc(4, 2, 4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(35,24,15,.22)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0, ty, 20, -2.6, -1.1); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, ty, 20, 0.5, 2.0); ctx.stroke();
      // flour puffs
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      for (let i=0;i<3;i++) {
        const a = t*2 + i*2.1;
        ctx.beginPath(); ctx.arc(Math.cos(a)*17, ty + Math.sin(a)*5, 1.8, 0, Math.PI*2); ctx.fill();
      }
    }

    // ---- head ----
    ctx.fillStyle = '#f6d3a8';
    ctx.beginPath(); ctx.arc(0, -40, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#23180f'; ctx.lineWidth = 1.8; ctx.stroke();
    // ears
    ctx.beginPath(); ctx.ellipse(-11.6, -39, 2.4, 3.2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(11.6, -39, 2.4, 3.2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    // hair + sideburns
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(0, -42.5, 12, Math.PI*1.0, Math.PI*2.0); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-11.8, -44, 3, 8, 1.5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(8.8, -44, 3, 8, 1.5); ctx.fill();

    // anger flush across the cheeks
    if (piz.mad > 0.1) {
      ctx.globalAlpha = piz.mad * 0.4;
      ctx.fillStyle = '#d13a30';
      ctx.beginPath(); ctx.arc(0, -40, 12.5, Math.PI * 0.15, Math.PI * 0.85); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // eyebrows — raised when pleased, driven down to a V when cross
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2 + piz.mad * 0.8;
    const brow = piz.happy > 0.3 ? -2 : 0;
    const mv = piz.mad;                       // 0..1 anger
    ctx.beginPath();
    ctx.moveTo(-9, -46.5 + brow + mv * 3.5);
    ctx.lineTo(-2.5, -46.5 + brow - mv * 2.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(9, -46.5 + brow + mv * 3.5);
    ctx.lineTo(2.5, -46.5 + brow - mv * 2.5);
    ctx.stroke();

    // big friendly eyes
    // Pupils track the live shot (or the aim line when idle) — the cheapest
    // change that stops him reading as a static sprite.
    let gzx = 0, gzy = 0;
    {
      let tx = null, ty = null;
      if (shot) { tx = shot.x; ty = shot.y; }
      else if (sling && sling.active) {
        const ga = clampAim(sling.aim);
        tx = SHOOTX + Math.cos(ga) * 120; ty = SHOOTY + Math.sin(ga) * 120;
      }
      if (tx !== null) {
        // convert world target into his local space
        const dx = (tx - bx) / K, dy = (ty - (by - 41 * 1)) / K;
        const d = Math.hypot(dx, dy) || 1;
        gzx = Math.max(-1, Math.min(1, dx / d)) * 1.15;
        gzy = Math.max(-1, Math.min(1, dy / d)) * 0.9;
      }
    }
    if (piz.blink > 0.93) {
      ctx.strokeStyle = '#23180f'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(-4.6, -41, 3, Math.PI*1.12, Math.PI*1.88); ctx.stroke();
      ctx.beginPath(); ctx.arc(4.6, -41, 3, Math.PI*1.12, Math.PI*1.88); ctx.stroke();
    } else {
      for (const ex of [-4.6, 4.6]) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(ex, -41, 3.3, 3.9, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(35,24,15,.5)'; ctx.lineWidth = .9; ctx.stroke();
        ctx.fillStyle = '#4a3520';
        ctx.beginPath(); ctx.ellipse(ex + 0.3 + gzx, -40.6 + gzy, 2.2, 2.7, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#23180f';
        ctx.beginPath(); ctx.arc(ex + 0.3 + gzx, -40.6 + gzy, 1.2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex - 0.9 + gzx * .6, -42.2 + gzy * .6, 1.3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + 1.4 + gzx * .6, -39.2 + gzy * .6, .7, 0, Math.PI*2); ctx.fill();
      }
    }

    // nose
    ctx.fillStyle = '#e8b98a';
    ctx.beginPath(); ctx.ellipse(0, -36.5, 2.4, 2, 0, 0, Math.PI*2); ctx.fill();

    // blush
    ctx.fillStyle = 'rgba(224,110,110,.42)';
    ctx.beginPath(); ctx.ellipse(-8.6, -36, 3.6, 2.4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8.6, -36, 3.6, 2.4, 0, 0, Math.PI*2); ctx.fill();

    // big curly moustache
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -33.5);
    ctx.quadraticCurveTo(-4.5, -32.4, -6.6, -34.6);
    ctx.quadraticCurveTo(-7.6, -35.8, -6, -36.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -33.5);
    ctx.quadraticCurveTo(4.5, -32.4, 6.6, -34.6);
    ctx.quadraticCurveTo(7.6, -35.8, 6, -36.2);
    ctx.stroke();

    // mouth
    if (piz.ecstatic > 0.2) {
      // Delighted: open grin with teeth showing.
      const e = Math.min(1, piz.ecstatic);
      ctx.fillStyle = '#8e2230';
      ctx.beginPath();
      ctx.ellipse(0, -30.6, 4.6 + e * 2.2, 3.2 + e * 2.6, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff6ee';
      ctx.beginPath();
      ctx.ellipse(0, -32.6 - e * 0.6, 3.6 + e * 1.6, 1.2, 0, 0, Math.PI*2);
      ctx.fill();
    } else if (piz.mad > 0.25) {
      // Cross: a downturned grimace with a clenched line through it.
      ctx.strokeStyle = '#23180f'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -28.4, 3.4, Math.PI + 0.35, -0.35);
      ctx.stroke();
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(-3.2, -30.6); ctx.lineTo(3.2, -30.6); ctx.stroke();
    } else if (shout > 0.15) {
      ctx.fillStyle = '#8e2230';
      ctx.beginPath();
      ctx.ellipse(0, -30.4, 3 + shout * 1.8, 2.4 + shout * 2.8, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#f0c0c0';
      ctx.beginPath(); ctx.ellipse(0, -32.4 - shout, 2 + shout, 1, 0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.strokeStyle = '#23180f'; ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.arc(0, -32.5, 3, 0.3, Math.PI - 0.3); ctx.stroke();
    }

    // ---- chef's toque ----
    ctx.fillStyle = '#f9f4e8';
    ctx.beginPath(); ctx.ellipse(-6, -57, 6.5, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, -57, 6.5, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -59.5, 7.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-11, -56, 22, 9, 3); ctx.fill();
    ctx.strokeStyle = '#23180f'; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-11, -47);
    ctx.lineTo(-11, -54);
    ctx.bezierCurveTo(-14, -58, -9, -64, -4, -61.5);
    ctx.bezierCurveTo(-1, -66, 6, -64, 6.5, -60);
    ctx.bezierCurveTo(12, -62, 14, -54, 11, -54);
    ctx.lineTo(11, -47);
    ctx.stroke();
    // hat band
    ctx.fillStyle = '#e9e2d0';
    ctx.beginPath(); ctx.roundRect(-11, -50, 22, 4, 1.5); ctx.fill();
    ctx.strokeStyle = 'rgba(35,24,15,.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(-11, -50, 22, 4, 1.5); ctx.stroke();

    // ---- sparkles when delighted ----
    // steam venting off the hat when he's cross
    for (const f of piz.fume) {
      if (f.life <= 0) continue;
      ctx.globalAlpha = f.life * 0.5;
      ctx.fillStyle = '#f2e4c8';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ecstatic: extra stars, bigger and faster than the happy ones
    if (piz.ecstatic > 0.2) {
      const e = Math.min(1, piz.ecstatic);
      ctx.globalAlpha = e;
      star(-34, -58, 7, t * 5, '#fff2a8', e);
      star(34, -52, 6, -t * 5, '#ffd98a', e);
      star(0, -78, 5.5, t * 4, '#ffffff', e);
      star(-16, -74, 4, -t * 6, '#f7c95e', e);
      ctx.globalAlpha = 1;
    }

    if (piz.happy > 0.3) {
      ctx.globalAlpha = piz.happy;
      star(-26, -50, 5, t * 3, '#e0a63c', piz.happy);
      star(26, -44, 4, -t * 3, '#f7d894', piz.happy);
      star(-20, -66, 3.4, t * 2, '#fff', piz.happy);
      ctx.globalAlpha = 1;
    }

    // sweat drop when he's worried
    if (piz.lean > 0.3) {
      ctx.fillStyle = 'rgba(140,200,235,.85)';
      ctx.beginPath();
      ctx.ellipse(13, -50 - piz.lean * 3, 2.2, 3.2, 0.2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // nameplate
    ctx.fillStyle = 'rgba(35,24,15,.4)';
    ctx.font = 'bold 7px "Space Mono", ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GIOVANNI', bx, H - 5);

    // Bubble rides above his head; both offsets derive from K so he can be
    // rescaled without the tail drifting off his face.
    speech(bx + 26, by - 68 * K, piz.say, piz.life, -1, '#c0302c');
  }
  // ---- flashes: slam-in impact text -----------------------------------
  function drawFlashes() {
    for (const f of flashes) {
      const p = 1 - f.life;
      let sc;
      if (p < 0.1) sc = 2.4 - (p/0.1)*1.35;        // slam down from huge
      else if (p < 0.18) sc = 1.05 + Math.sin((p-0.1)/0.08*Math.PI)*0.14;
      else sc = 1.05 - (p-0.18)*0.1;

      ctx.save();
      ctx.translate(W/2, f.y);
      ctx.rotate(f.sk);
      ctx.scale(sc, sc);
      ctx.globalAlpha = Math.min(1, f.life*2.4);
      ctx.font = '900 ' + f.size + 'px Anton, Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';

      if (!f.ghost) {
        // chromatic offset copies
        ctx.globalAlpha = Math.min(1, f.life*2.4) * 0.5;
        ctx.fillStyle = '#c0302c'; ctx.fillText(f.text, -3, 3);
        ctx.fillStyle = '#3d6b3a'; ctx.fillText(f.text, 3, -3);
        ctx.globalAlpha = Math.min(1, f.life*2.4);
      }
      ctx.strokeStyle = '#23180f'; ctx.lineWidth = 8;
      ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ---- loop -----------------------------------------------------------
  function step() {
    if (hitstop > 0) { hitstop--; frame++; draw(); requestAnimationFrame(step); return; }
    creak();
    if (chargeFlash > 0) chargeFlash -= 0.03;

    if (shot) {
      const sub = Math.ceil(Math.hypot(shot.vx, shot.vy) / 3);
      shot.trail.push({ x: shot.x, y: shot.y });
      if (shot.trail.length > 6) shot.trail.shift();
      // A cold draught nudges shots off-line. Computed once per frame and
      // divided across substeps: applying it inside the loop made fast shots
      // curve twice as hard as slow ones, since sub scales with speed.
      const drift = (activeNode && activeNode.type === 'ice' ? 0.030 : 0)
                  + dmod('drift', 0) + tmod('drift', 0);
      const driftStep = drift ? Math.sin(frame * 0.05) * drift / sub : 0;
      for (let s=0;s<sub;s++) {
        shot.x += shot.vx/sub; shot.y += shot.vy/sub;
        if (driftStep) shot.vx += driftStep;
        if (shot.x < R) { shot.x = R; shot.vx = -shot.vx; sparkle(R, shot.y, '#e0a63c'); SFX.wall(); }
        if (shot.x > W-R) { shot.x = W-R; shot.vx = -shot.vx; sparkle(W-R, shot.y, '#e0a63c'); SFX.wall(); }
        const landed = shot.y < R + offsetRow*ROWH || hitsAt(shot.x, shot.y);
        if (landed) { const {x,y,ci} = shot; shot = null; SFX.land(); settle(x,y,ci); snapshotRun(); break; }
      }
    }

    for (let i=particles.length-1;i>=0;i--) {
      const p = particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life-=0.032;
      if (p.life<=0) particles.splice(i,1);
    }
    for (let i=drops.length-1;i>=0;i--) {
      const d = drops[i];
      d.x+=d.vx; d.y+=d.vy; d.vy+=0.46; d.rot+=d.vr;
      if (d.y > H+R*2) drops.splice(i,1);
    }
    for (let i=rings.length-1;i>=0;i--) {
      const rg = rings[i];
      rg.r += (rg.max - rg.r) * 0.22; rg.life -= 0.045;
      if (rg.life<=0) rings.splice(i,1);
    }
    for (let i=rays.length-1;i>=0;i--) { rays[i].life -= 0.05; if (rays[i].life<=0) rays.splice(i,1); }
    for (let i=sparks.length-1;i>=0;i--) {
      const s = sparks[i];
      s.y += s.vy; s.rot += 0.12; s.life -= 0.038;
      if (s.life<=0) sparks.splice(i,1);
    }
    for (let i=flashes.length-1;i>=0;i--) { flashes[i].life -= 0.014; if (flashes[i].life<=0) flashes.splice(i,1); }
    for (let i=popups.length-1;i>=0;i--) {
      const pu = popups[i];
      pu.y += pu.vy; pu.vy *= 0.97; pu.life -= 0.018;
      if (pu.life<=0) popups.splice(i,1);
    }

    // sauce physics
    frame++;
    if (surge > 0) surge = Math.max(0, surge - 0.03);
    const ceilY = 7 + offsetRow*ROWH;
    for (const dp of sauceDrips) {
      dp.len += dp.grow * (1 + surge * 2.5);
      dp.sway += 0.02 + dp.grow * 0.3;
      // Heavier drips hang longer before the neck pinches off.
      if (dp.len > 14 + dp.w * 2.4 + Math.random()*10) {
        droplets.push({
          x: dp.x, y: ceilY + dp.len, vy: 1, r: dp.w*0.82, life: 1,
          str: 0,                                 // stretch factor, grows w/ speed
          // Some drips carry a chunk of veg down with them.
          veg: Math.random() < 0.45
            ? ['basil','onion','carrot','pepper','pepcorn'][(Math.random()*5)|0] : null,
          vr: (Math.random()-.5) * 0.3, rot: Math.random()*7
        });
        dp.len = 1.5 + Math.random()*3;
        dp.x = 12 + Math.random()*(W-24);
        dp.w = 2.4 + Math.random()*4.6;
        dp.grow = .03 + Math.random()*.075;
      }
    }
    for (let i=droplets.length-1;i>=0;i--) {
      const dl = droplets[i];
      dl.y += dl.vy; dl.vy += 0.28; dl.life -= 0.009;
      dl.str = Math.min(2.4, dl.vy * 0.22);       // teardrop elongates as it accelerates
      if (dl.veg) dl.rot = (dl.rot || 0) + (dl.vr || 0);
      // Land on the counter line and splatter instead of vanishing offscreen.
      const floor = SHOOTY - D*1.4 - R;
      if (dl.y > floor && dl.life > 0) {
        for (let k=0;k<4;k++)
          splats.push({ x: dl.x + (Math.random()-.5)*6, y: floor,
                        r: dl.r*(0.3+Math.random()*0.5),
                        vx:(Math.random()-.5)*2.2, vy:-Math.random()*1.6, life:1 });
        droplets.splice(i,1); continue;
      }
      if (dl.y > H || dl.life <= 0) droplets.splice(i,1);
    }
    for (let i=splats.length-1;i>=0;i--) {
      const sp = splats[i];
      sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.34; sp.life -= 0.028;
      if (sp.life <= 0) splats.splice(i,1);
    }
    if (splats.length > 90) splats.splice(0, splats.length - 90);
    // Droplets were uncapped; the heavier surge can now spike them. Cap in
    // the same spirit as MAX_PARTICLES — oldest go first so the newest
    // (most visible, nearest the ceiling) always survive.
    if (droplets.length > MAX_DROPLETS) droplets.splice(0, droplets.length - MAX_DROPLETS);

    stepTwinkles();
    // ---- creeping sauce -------------------------------------------------
    // Past level 20 the marinara sinks on its own, very slowly. This is the
    // only pressure that reaches an accurate player: without it, perfect
    // aim meant unlimited time and no failure risk at all.
    if (running && !over && level > 20) {
      const creep = Math.min(0.00055, (level - 20) * 0.000014);
      offsetRow += creep;
      creepWarn += creep;
      if (creepWarn > 0.5) {        // a nudge each time it sinks half a row
        creepWarn = 0;
        shake = Math.max(shake, 3);
        SFX.surge();
      }
    }
    if (tipLife > 0) tipLife -= 0.0045;
    if (waveOn) stepDeathWave();

    if (shake > 0) shake *= 0.85;
    if (zoom > 0) zoom *= 0.88;
    if (sling.wobble > 0) sling.wobble = Math.max(0, sling.wobble - 0.05);

    // pizzaiolo animation
    if (piz.life > 0)   piz.life   = Math.max(0, piz.life - 0.009);
    if (piz.bounce > 0) piz.bounce = Math.max(0, piz.bounce - 0.055);
    if (piz.happy > 0)  piz.happy  = Math.max(0, piz.happy - 0.012);
    if (piz.toss > 0)   piz.toss   = Math.max(0, piz.toss - 0.015);
    if (piz.lean > 0)   piz.lean   = Math.max(0, piz.lean - 0.02);
    // Anger fades slower than joy — a bad shot should linger on his face.
    if (piz.mad > 0)      piz.mad      = Math.max(0, piz.mad - 0.007);
    if (piz.ecstatic > 0) piz.ecstatic = Math.max(0, piz.ecstatic - 0.014);
    if (piz.steam > 0)    piz.steam    = Math.max(0, piz.steam - 0.02);
    // steam puffs rise and thin out
    for (let i = piz.fume.length - 1; i >= 0; i--) {
      const f = piz.fume[i];
      f.y += f.vy; f.r += 0.12; f.life -= 0.022;
      if (f.life <= 0) piz.fume.splice(i, 1);
    }
    if (piz.fume.length > 14) piz.fume.splice(0, piz.fume.length - 14);
    piz.spin += 0.09 + piz.toss * 0.16;
    piz.blink = (piz.blink + 0.004 + Math.random()*0.002) % 1;

    // idle chatter
    if (running && !over) {
      nagTimer--;
      if (nagTimer <= 0) {
        const r = Math.random();
        pizSay('idle');
        nagTimer = 260 + Math.random()*260;
      }
    }

    draw();
    requestAnimationFrame(step);
  }

  // ---- input ----------------------------------------------------------
  function pt(e) {
    const rect = cv.getBoundingClientRect();
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    return {
      x: (t.clientX - rect.left) * (W / rect.width),
      y: (t.clientY - rect.top) * (H / rect.height)
    };
  }
  function beginPull(e) {
    SFX.unlock(); MUSIC.unlock();
    if (scene === 'trial') { const p = pt(e); tapMiniGame(p.x, p.y); return; }
    if (shot||over||!running) return;
    sling.active = true;
    const p = pt(e);
    sling.startX = p.x; sling.startY = p.y;
    // Touching low in the sling bay reads as a grab-and-pull; anywhere
    // else reads as point-to-aim and starts with usable power.
    sling.grab = p.y > SHOOTY - 40;
    sling.power = sling.grab ? 0 : 0.62;
    updatePull(e);
  }
  function updatePull(e) {
    if (!sling.active) return;
    const p = pt(e);

    // Vector from launcher to finger. This is where you're pointing.
    const tx = p.x - SHOOTX, ty = p.y - SHOOTY;
    const dist = Math.hypot(tx, ty);

    if (dist > 6) {
      if (ty < -4) {
        // Finger above the launcher: aim straight at it. Guide tracks 1:1.
        sling.aim = clampAim(Math.atan2(ty, tx));
      } else {
        // Finger at or below the launcher: classic pull-back. Fire opposite.
        sling.aim = clampAim(Math.atan2(-ty, -tx));
      }
    }

    if (sling.grab) {
      // Power is how far you dragged from where you grabbed.
      const drag = Math.hypot(p.x - sling.startX, p.y - sling.startY);
      sling.power = Math.max(0, Math.min(1, drag / MAXPULL));
    } else {
      // Pointing mode: drag down past the launcher to add force.
      const extra = Math.max(0, p.y - (SHOOTY - 40)) / 90;
      sling.power = Math.max(0, Math.min(1, 0.62 + extra * 0.38));
    }
  }
  function endPull() { if (sling.active) release(); }
  // Band creak: a soft tick every few frames while the draw deepens.
  let lastCreak = 0;
  function creak() {
    if (sling.active && sling.power > 0.12 && frame - lastCreak > 7) {
      lastCreak = frame; SFX.pull();
    }
  }

  cv.addEventListener('mousedown', e => { e.preventDefault(); beginPull(e); });
  window.addEventListener('mousemove', updatePull);
  window.addEventListener('mouseup', endPull);
  cv.addEventListener('touchstart', e => { e.preventDefault(); beginPull(e); }, {passive:false});
  cv.addEventListener('touchmove',  e => { e.preventDefault(); updatePull(e); }, {passive:false});
  cv.addEventListener('touchend',   e => { e.preventDefault(); endPull(); }, {passive:false});
  cv.addEventListener('touchcancel', () => { sling.active=false; sling.power=0; });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); const t = cur; cur = next; next = t; }
    if (e.code === 'ArrowLeft')  { sling.aim = clampAim(sling.aim-0.05); sling.active=true; sling.power=Math.max(sling.power,.55); }
    if (e.code === 'ArrowRight') { sling.aim = clampAim(sling.aim+0.05); sling.active=true; sling.power=Math.max(sling.power,.55); }
    if (e.code === 'ArrowDown')  { sling.active=true; sling.power=Math.min(1, sling.power+0.08); }
    if (e.code === 'Enter' || e.code === 'ArrowUp') { if (sling.power<.2) sling.power=.85; release(); }
  });

  btn.addEventListener('click', () => {
    SFX.unlock(); SFX.ui();
    const act = btn.dataset.act || 'start';
    if (act === 'leaveShop') {
      osub.onclick = null;
      overlay.classList.remove('on');
      // Shop sits between levels; leaving it starts the next one.
      startLevel(level + 1);
      return;
    }
    if (act === 'backToTitle') {
      otitle.textContent = 'Mamma Mia!'; otitle.className = '';
      btn.textContent = 'Open Up!'; btn.dataset.act = '';
      overlay.classList.add('title');
      paintModes(); paintRank();
      return;
    }
    if (act === 'initials') {
      if (pendingInitials) { const f = pendingInitials; pendingInitials = null; f(); }
      return;
    }
    waveOn = false; waveDone = false; LETTERS.length = 0; WAVEBITS.length = 0;
    rankedUp = false;
    btn.dataset.act = '';
    paintRank();
    if (act === 'next') {
      const nextLv = level + 1;
      // Market every few levels, then straight on to the next service.
      if (nextLv % SHOP_EVERY === 1 && nextLv > 1) {
        overlay.classList.remove('on');
        level = nextLv - 1;              // startLevel(level+1) after the shop
        openShop();
        return;
      }
      startLevel(nextLv);
      return;
    }
    score = 0; newRecord = false;
    overlay.classList.remove('on', 'title');
    startLevel(1);
    return;
    if (level === 3) {
      flash('OCCHIO! NO MORE GUIDE', '#c0302c', 19, H*0.42, { sk:0 });
      setTimeout(() => { if (running) { piz.say = 'use-a your eyes~'; piz.life = 1; piz.bounce = 1; } }, 900);
    } else if (!GUIDED) {
      setTimeout(() => { if (running) { piz.say = 'no guide, no problema~'; piz.life = 1; piz.bounce = 1; } }, 900);
    } else if (dayStreak > 1 && level === 1) {
      setTimeout(() => { if (running) pizSay('streak'); }, 900);
    } else {
      setTimeout(() => { if (running) pizSay('idle'); }, 900);
    }
  });

  // Scale the whole stage to fit the viewport so no part of the board —
  // Giovanni included — is ever cut off.
  const stage = document.getElementById('stage');
  function fitStage() {
    stage.style.transform = 'none';
    const wrapH = document.getElementById('wrap').clientHeight;
    const chrome = wrapH - stage.offsetHeight;      // header + footer + gaps
    const availH = wrapH - Math.max(chrome, 0) - 4;
    const availW = document.getElementById('wrap').clientWidth - 12;
    const k = Math.min(1, availH / H, availW / W);
    if (k < 1) stage.style.transform = 'scale(' + k.toFixed(4) + ')';
  }
  // Mobile sessions usually end by backgrounding, not by closing.
  document.addEventListener('visibilitychange', () => { if (document.hidden) snapshotRun(); });
  window.addEventListener('pagehide', snapshotRun);

  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', () => setTimeout(fitStage, 120));
  setTimeout(fitStage, 0);

  // ---- audio unlock ------------------------------------------------------
  // Browsers refuse to start an AudioContext outside a user gesture, and the
  // canvas handler alone missed every DOM-button path (the title screen's
  // "Open Up!" among them) — which is why the game could run start to finish
  // in silence. This listens on the document for the very first interaction
  // of ANY kind, unlocks both engines, and removes itself.
  let audioReady = false;
  function unlockAudio() {
    if (audioReady) return;
    audioReady = true;
    try { SFX.unlock(); } catch (e) {}
    try { MUSIC.unlock(); MUSIC.restoreMute(); } catch (e) {}
    // If we're already mid-level when audio finally unlocks, start the music
    // now rather than waiting for the next level transition.
    try { if (!MUSIC.muted && running && !over) MUSIC.start(); } catch (e) {}
    for (const ev of ['pointerdown', 'touchstart', 'mousedown', 'keydown'])
      document.removeEventListener(ev, unlockAudio, true);
  }
  for (const ev of ['pointerdown', 'touchstart', 'mousedown', 'keydown'])
    document.addEventListener(ev, unlockAudio, true);

  // ---- boot: restore progress ----
  SFX.init();
  const _sv = SAVE.load();
  hiScore = _sv.hi || 0;
  if (_sv.mode && MODES[_sv.mode]) mode = MODES[_sv.mode];

  // --- mode picker ---
  const modeBtns = [...document.querySelectorAll('.modebtn')];
  function paintModes() {
    for (const b of modeBtns) b.classList.toggle('on', b.dataset.mode === mode.key);
    osub.textContent = mode.blurb;
  }
  for (const b of modeBtns) {
    b.addEventListener('click', () => {
      SFX.unlock(); SFX.ui();
      mode = MODES[b.dataset.mode];
      const sv = SAVE.data(); sv.mode = mode.key; SAVE.save();
      paintModes(); paintRank();
      if (!running) reset(1);          // reseed the preview board behind the title
    });
  }

  // --- rank bar ---
  const rnEl = document.getElementById('rankname');
  const rxEl = document.getElementById('rankxp');
  const rfEl = document.getElementById('rankfill');
  const plEl = document.getElementById('perklist');
  function paintRank() {
    const sv = SAVE.data();
    const xp = sv.xp || 0;
    const r = rankFromXP(xp);
    rnEl.textContent = RANK_NAMES[r];
    const nx = xpToNext(xp);
    if (nx) {
      rxEl.textContent = nx.need.toLocaleString() + ' XP to next';
      rfEl.style.width = Math.round(nx.into / nx.span * 100) + '%';
    } else {
      rxEl.textContent = xp.toLocaleString() + ' XP';
      rfEl.style.width = '100%';
    }
    const chips = [];
    if (sv.stelle) chips.push('<span class="perkchip" style="color:#f0b74a;border-color:#f0b74a">' +
      '\u2605'.repeat(Math.min(5, sv.stelle)) + (sv.stelle > 5 ? ' \u00d7' + sv.stelle : '') + '</span>');
    for (const id of (sv.perks || []))
      if (PERKS[id]) chips.push('<span class="perkchip">' + PERKS[id].name + '</span>');
    // Gear is permanent, so surface it here too — it's the clearest signal
    // that the game is something you build across sessions.
    for (const g of Object.keys(GEAR)) {
      const lv = gearLv(g);
      if (lv) chips.push('<span class="perkchip" style="opacity:.75">' +
        GEAR[g].name + ' ' + lv + '</span>');
    }
    plEl.innerHTML = chips.join('');
  }

  // --- perk chooser: offer three, keep one ---
  function offerPerk() {
    const sv = SAVE.data();
    const owned = sv.perks || [];
    const pool = Object.keys(PERKS).filter(id => owned.indexOf(id) < 0);
    if (!pool.length) { pendingPerk = false; return false; }
    const offer = [];
    while (offer.length < Math.min(3, pool.length)) {
      const id = pool[(Math.random()*pool.length)|0];
      if (offer.indexOf(id) < 0) offer.push(id);
    }
    osub.onclick = null;
    otitle.textContent = 'RANKED UP!';
    otitle.className = '';
    osub.innerHTML =
      '<div style="font-family:\'Space Mono\',monospace;font-style:normal;font-size:11px;letter-spacing:.06em">' +
      '<div style="color:#e0a63c;font-size:14px;font-weight:700;margin-bottom:3px">' +
      RANK_NAMES[rankFromXP(sv.xp || 0)] + '</div>' +
      '<div style="opacity:.75;margin-bottom:9px">Choose your perk — it is yours for good.</div>' +
      offer.map(id =>
        '<button class="perkpick" data-perk="' + id + '" style="display:block;width:100%;' +
        'margin:5px 0;padding:10px 12px;background:linear-gradient(180deg,#4a3550,#33223c);border:2px solid #1a1119;' +
        'border-radius:3px;color:#f2e4c8;font:inherit;font-size:10px;cursor:pointer;text-align:left">' +
        '<b style="color:#e0a63c;font-size:11px">' + PERKS[id].name + '</b><br>' +
        '<span style="opacity:.7">' + PERKS[id].desc + '</span></button>').join('') +
      '</div>';
    btn.style.display = 'none';
    overlay.classList.remove('title');
    overlay.classList.add('on');
    for (const pb of document.querySelectorAll('.perkpick')) {
      pb.addEventListener('click', () => {
        SFX.power();
        const sv2 = SAVE.data();
        sv2.perks = (sv2.perks || []).concat([pb.dataset.perk]);
        SAVE.save();
        pendingPerk = false;
        btn.style.display = '';
        paintRank();
        if (endQueue.length) runEndQueue();
        else overlay.classList.remove('on');
      });
    }
    return true;
  }

  // --- save tools ---
  const resumeBtn = document.getElementById('resumeBtn');
  // Re-read the saved run and update the button. Called at boot and after
  // any operation that could create or destroy a run (import, wipe, death).
  function refreshResume() {
    const r = SAVE.loadRun();
    if (!r) { resumeBtn.style.display = 'none'; return; }
    resumeBtn.style.display = '';
    resumeBtn.textContent = 'Resume \u2014 Lv ' + r.level +
      ' \u00b7 ' + (r.score || 0).toLocaleString();
  }
  refreshResume();
  resumeBtn.addEventListener('click', () => {
    SFX.unlock(); SFX.ui();
    const r = SAVE.loadRun();
    if (!r) { resumeBtn.style.display = 'none'; return; }
    restoreRun(r);
    overlay.classList.remove('on', 'title');
    btn.dataset.act = '';
    scene = 'play'; sceneT = 0;
    CONFETTI.length = 0; STEAM.length = 0; TITLEBITS.length = 0;
    running = true;
    paintRank();
  });

  // ---- sharing ---------------------------------------------------------
  // Uses the Web Share API on mobile (opens the real system share sheet,
  // so it lands in Messages/WhatsApp properly), and falls back to the
  // clipboard on desktop where that API doesn't exist.
  function shareText(extra) {
    const sv = SAVE.data();
    const best = sv.hi || 0;
    const stars = sv.stelle || 0;
    let msg = 'MAMMA MIA! POMODORO PANIC';
    if (extra) msg += '\n' + extra;
    if (best) msg += '\nMy best: ' + best.toLocaleString() + ' lire';
    if (stars) msg += ' \u00b7 ' + stars + '\u2605';
    msg += '\nThink you can beat that?';
    return msg;
  }
  async function doShare(extra) {
    const text = shareText(extra);
    // Some embedded webviews expose no usable location; fall back to the
    // text alone rather than throwing inside an async handler where the
    // rejection would be invisible to the player.
    let url = '';
    try { url = (location && location.href || '').split('#')[0]; } catch (e) {}
    try {
      if (navigator.share) {
        const payload = { title: 'Mamma Mia! Pomodoro Panic', text };
        if (url) payload.url = url;
        await navigator.share(payload);
        return;
      }
    } catch (e) { /* user cancelled the sheet — not an error */ }
    const full = url ? text + '\n' + url : text;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(full);
        flashToast('Copied \u2014 paste it to a friend');
        return;
      }
    } catch (e) {}
    showModal({
      title: 'SHARE',
      msg: 'Copy this and send it to someone.',
      field: true, value: full, readOnly: true, ok: 'Done', noCancel: true
    });
  }

  // ---- in-page dialog -------------------------------------------------
  // Replaces window.prompt/confirm, which mobile browsers suppress. Returns
  // the entered text (or true) on OK, null on cancel, via callback.
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalMsg = document.getElementById('modalMsg');
  const modalField = document.getElementById('modalField');
  const modalOk = document.getElementById('modalOk');
  const modalCancel = document.getElementById('modalCancel');
  let modalDone = null;

  function showModal(opts) {
    modalTitle.textContent = opts.title || '';
    modalMsg.textContent = opts.msg || '';
    if (opts.field) {
      modalField.style.display = '';
      modalField.value = opts.value || '';
      modalField.readOnly = !!opts.readOnly;
    } else {
      modalField.style.display = 'none';
    }
    modalOk.textContent = opts.ok || 'OK';
    modalCancel.style.display = opts.noCancel ? 'none' : '';
    modalDone = opts.done || null;
    modal.classList.add('on');
    // focus()/select() can throw or be no-ops in some mobile webviews, and
    // this runs inside a timeout where a throw would be silent.
    if (opts.field) setTimeout(() => {
      try {
        if (!opts.readOnly && modalField.focus) modalField.focus();
        else if (opts.readOnly && modalField.select) modalField.select();
      } catch (e) {}
    }, 60);
  }
  function closeModal() { modal.classList.remove('on'); modalDone = null; }
  modalCancel.addEventListener('click', () => { SFX.ui(); closeModal(); });
  modalOk.addEventListener('click', () => {
    SFX.ui();
    const f = modalDone, v = modalField.value;
    closeModal();
    if (f) f(v);
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    SFX.ui(); doShare();
  });

  document.getElementById('boardBtn').addEventListener('click', () => {
    SFX.ui();
    showBoard(-1);
    btn.textContent = 'Back';
    btn.dataset.act = 'backToTitle';
  });

  document.getElementById('expBtn').addEventListener('click', () => {
    SFX.ui();
    const code = SAVE.exportCode();
    if (!code) { flashToast('Nothing to export'); return; }
    // Try the clipboard, but always show the code so it can be copied by
    // hand if the clipboard API is unavailable or denied.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(
        () => flashToast('Copied to clipboard'),
        () => {}
      );
    }
    showModal({
      title: 'YOUR SAVE CODE',
      msg: 'Copy this and keep it somewhere safe. Paste it into Import to restore your progress on any device.',
      field: true, value: code, readOnly: true,
      ok: 'Done', noCancel: true
    });
  });

  document.getElementById('impBtn').addEventListener('click', () => {
    SFX.ui();
    showModal({
      title: 'IMPORT SAVE',
      msg: 'Paste your save code below. This replaces your current rank, perks and records.',
      field: true, value: '', ok: 'Load',
      done: (code) => {
        if (!code || !code.trim()) { flashToast('No code entered'); return; }
        if (SAVE.importCode(code)) {
          const sv = SAVE.data();
          hiScore = sv.hi || 0;
          if (sv.mode && MODES[sv.mode]) mode = MODES[sv.mode];
          hiEl.textContent = hiScore;
          paintModes(); paintRank(); refreshResume();
          reset(1);
          flashToast('Save loaded');
          SFX.power();
        } else {
          flashToast('Invalid code');
        }
      }
    });
  });

  document.getElementById('wipeBtn').addEventListener('click', () => {
    SFX.ui();
    showModal({
      title: 'ERASE EVERYTHING?',
      msg: 'This deletes your rank, perks, high scores and saved run. It cannot be undone.',
      ok: 'Erase',
      done: () => {
        SAVE.wipe();
        hiScore = 0; hiEl.textContent = '0';
        mode = MODES.normale;
        refreshResume();
        paintModes(); paintRank();
        reset(1);
        flashToast('Progress erased');
      }
    });
  });

  // Small non-blocking confirmation strip.
  let toastEl = null, toastT = 0;
  function flashToast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:absolute;left:50%;bottom:14px;transform:translateX(-50%);' +
        'background:rgba(35,24,15,.94);color:#f2e4c8;font-family:"Space Mono", ui-monospace, Menlo, monospace;' +
        'font-size:10px;letter-spacing:.06em;padding:7px 14px;border-radius:4px;' +
        'border:1px solid rgba(224,166,60,.5);pointer-events:none;opacity:0;' +
        'transition:opacity .25s;z-index:9';
      document.getElementById('stage').appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastEl.style.opacity = '0'; }, 1800);
  }

  paintModes(); paintRank();
  dayStreak = SAVE.touchDay();
  const stEl = document.getElementById('st');
  const stBox = document.getElementById('streakBox');
  if (dayStreak > 1) { stEl.textContent = dayStreak; stBox.style.display = ''; }
  const stelEl = document.getElementById('stel');
  const starBox = document.getElementById('starBox');
  if ((_sv.stelle || 0) > 0) { stelEl.textContent = _sv.stelle; starBox.style.display = ''; }
  const muteBtn = document.getElementById('mute');
  function paintMute() { muteBtn.style.opacity = SFX.muted ? '0.4' : '1'; }
  muteBtn.addEventListener('click', () => {
    unlockAudio();
    const nowMuted = !SFX.muted;
    SFX.toggle();
    // Keep music in lockstep with the single mute control.
    if (MUSIC.muted !== nowMuted) MUSIC.toggle();
    if (nowMuted) MUSIC.stop();
    else if (running && !over) MUSIC.start();
    paintMute();
  });
  paintMute();

  buildSprites();
  buildGioSprite();
  buildPizzaSprite();
  buildSplatSprite();
  // Anton may still be loading; repaint the sprites once it lands.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
    buildSprites(); buildGioSprite(); buildPizzaSprite(); buildSplatSprite();
  });
  score = 0; reset(1); running = false;
  hiEl.textContent = hiScore;
  scene = 'title'; sceneT = 0;
  overlay.classList.add('title');
  overlay.classList.add('on');
  step();
})();
</script>
</body>
</html>
