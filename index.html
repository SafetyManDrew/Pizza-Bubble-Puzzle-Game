  // ---- preview --------------------------------------------------------
  // Only the cells near a point can possibly collide with it. Derive the
  // row/col from the position and check a small window instead of all 126.
  function hitsAt(x, y) {
    const rBase = Math.round((y - R - offsetRow*ROWH) / ROWH);
    for (let r = rBase - 1; r <= rBase + 1; r++) {
      if (r < 0 || r >= ROWS) continue;
      const row = grid[r], n = colsIn(r), off = r % 2 ? R : 0;
      const cBase = Math.round((x - R - off) / D);
      const yd = y - (R + r*ROWH + offsetRow*ROWH);
      const yd2 = yd*yd;
      if (yd2 >= D*D*0.92) continue;
      for (let c = cBase - 1; c <= cBase + 1; c++) {
        if (c < 0 || c >= n || row[c] < 0) continue;
        const xd = x - (R + c*D + off);
        if (xd*xd + yd2 < D*D*0.92) return true;
      }
    }
    return false;
  }

  function previewPath() {
    const a = clampAim(sling.aim);
    let x=SHOOTX, y=SHOOTY, vx=Math.cos(a)*7, vy=Math.sin(a)*7;
    const pts=[x,y];
    const reach = sling.grab ? (40 + sling.power * 280) : 320;
    const ceilLimit = R + offsetRow*ROWH;
    for (let i=0;i<reach;i++) {
      x+=vx; y+=vy;
      if (x<R)   { x=R;   vx=-vx; pts.push(x,y); }
      if (x>W-R) { x=W-R; vx=-vx; pts.push(x,y); }
      if (y < ceilLimit) { pts.push(x,y); break; }
      if (hitsAt(x,y))   { pts.push(x,y); break; }
    }
    pts.push(x,y);
    return pts;
  }

  // ---- item art -------------------------------------------------------
  function paintItem(ctx, x, y, ci, scale, rot, squash) {
    const it = ITEMS[ci];
    const rr = R * (scale || 1);
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (squash) ctx.scale(1 + squash, 1 - squash);

    ctx.lineJoin = 'round';

    // ---- glass shell: every item is a bubble first ----
    const shell = ctx.createRadialGradient(-rr*.34, -rr*.4, rr*.06, 0, 0, rr);
    shell.addColorStop(0,   it.lit);
    shell.addColorStop(.42, it.base);
    shell.addColorStop(.86, it.base);
    shell.addColorStop(1,   it.dark);
    ctx.fillStyle = shell;
    ctx.beginPath(); ctx.arc(0, 0, rr - 1, 0, Math.PI*2); ctx.fill();

    // clip the contents to the sphere
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, rr - 1.5, 0, Math.PI*2); ctx.clip();

    // ---- the food suspended inside ----
    if (it.id === 'tomato') {
      ctx.fillStyle = 'rgba(125,26,24,.5)';
      for (let i=0;i<5;i++) {
        const a = -Math.PI/2 + i*(Math.PI*2/5);
        ctx.save(); ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(0,-rr*.18);
        ctx.quadraticCurveTo(rr*.22,-rr*.5, 0,-rr*.72);
        ctx.quadraticCurveTo(-rr*.22,-rr*.5, 0,-rr*.18);
        ctx.fill();
        ctx.restore();
      }
      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.4;
      for (let i=0;i<4;i++) {
        const a = i*(Math.PI/4);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*rr*.75, Math.sin(a)*rr*.75);
        ctx.lineTo(-Math.cos(a)*rr*.75, -Math.sin(a)*rr*.75);
        ctx.stroke();
      }

    } else if (it.id === 'pizza') {
      // wedge inside the orb
      ctx.fillStyle = '#c0392c';
      ctx.beginPath();
      ctx.moveTo(0, -rr*.72);
      ctx.lineTo(rr*.66, rr*.46);
      ctx.quadraticCurveTo(0, rr*.7, -rr*.66, rr*.46);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(160,90,20,.55)'; ctx.lineWidth = rr*.14;
      ctx.beginPath();
      ctx.moveTo(-rr*.62, rr*.44);
      ctx.quadraticCurveTo(0, rr*.68, rr*.62, rr*.44);
      ctx.stroke();
      ctx.fillStyle = '#8e2230';
      for (const [px,py,pr] of [[0,-rr*.2,rr*.15],[-rr*.24,rr*.22,rr*.13],[rr*.26,rr*.2,rr*.12]]) {
        ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();
      }

    } else if (it.id === 'olive') {
      // Green olive seen end-on: brine-green flesh, a recessed hole with a
      // pimento pushed into it, and a wet highlight. Bright enough to sit
      // clearly apart from tomato, chianti and the yellows.
      ctx.save();
      ctx.rotate(-0.14);

      // flesh
      ctx.fillStyle = '#8fa63c';
      ctx.beginPath(); ctx.ellipse(0, 0, rr*.72, rr*.78, 0, 0, Math.PI*2); ctx.fill();

      // shading on the lower right for roundness
      ctx.fillStyle = 'rgba(88,106,32,.45)';
      ctx.beginPath(); ctx.ellipse(rr*.1, rr*.12, rr*.66, rr*.7, 0, 0, Math.PI*2); ctx.fill();

      // brighter crown, upper left, where the light lands
      ctx.fillStyle = 'rgba(196,214,110,.55)';
      ctx.beginPath(); ctx.ellipse(-rr*.14, -rr*.2, rr*.5, rr*.46, -0.3, 0, Math.PI*2); ctx.fill();

      // faint vertical striations, the way a real olive's skin reads
      ctx.strokeStyle = 'rgba(70,86,24,.28)'; ctx.lineWidth = rr*.05;
      for (const sx of [-0.36, -0.12, 0.14, 0.38]) {
        ctx.beginPath();
        ctx.moveTo(rr*sx, -rr*.62);
        ctx.quadraticCurveTo(rr*(sx*1.25), 0, rr*sx, rr*.62);
        ctx.stroke();
      }

      // the hole: a dark socket with the pimento pressed inside
      ctx.fillStyle = 'rgba(56,68,18,.9)';
      ctx.beginPath(); ctx.ellipse(0, -rr*.02, rr*.30, rr*.29, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#d8452f';
      ctx.beginPath(); ctx.ellipse(0, 0, rr*.24, rr*.23, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f4805c';
      ctx.beginPath(); ctx.ellipse(-rr*.06, -rr*.06, rr*.12, rr*.10, 0, 0, Math.PI*2); ctx.fill();

      // wet highlights
      ctx.fillStyle = 'rgba(255,255,255,.42)';
      ctx.beginPath(); ctx.ellipse(-rr*.32, -rr*.38, rr*.19, rr*.1, -0.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.2)';
      ctx.beginPath(); ctx.ellipse(rr*.28, rr*.32, rr*.1, rr*.055, -0.5, 0, Math.PI*2); ctx.fill();

      ctx.restore();

    } else if (it.id === 'mozz') {
      // Fresh mozzarella: a soft white ball with a torn seam, a faint
      // milky pooling at the base and a basil leaf laid across it. Near
      // white, so it's the brightest silhouette in the set by a distance.
      ctx.save();
      ctx.rotate(0.08);

      // body — slightly squat, like a ball resting under its own weight
      ctx.fillStyle = '#f7f0dc';
      ctx.beginPath(); ctx.ellipse(0, rr*.02, rr*.76, rr*.72, 0, 0, Math.PI*2); ctx.fill();

      // cool shading at the base
      ctx.fillStyle = 'rgba(178,168,140,.42)';
      ctx.beginPath(); ctx.ellipse(rr*.06, rr*.2, rr*.68, rr*.56, 0, 0, Math.PI*2); ctx.fill();

      // bright crown
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.ellipse(-rr*.14, -rr*.22, rr*.52, rr*.42, -0.25, 0, Math.PI*2); ctx.fill();

      // the torn seam that says fresh mozzarella rather than a plain ball
      ctx.strokeStyle = 'rgba(196,184,152,.75)'; ctx.lineWidth = rr*.07;
      ctx.beginPath();
      ctx.moveTo(-rr*.5, -rr*.1);
      ctx.quadraticCurveTo(-rr*.16, rr*.1, rr*.06, -rr*.06);
      ctx.quadraticCurveTo(rr*.3, -rr*.2, rr*.54, rr*.04);
      ctx.stroke();

      // a couple of soft dimples
      ctx.fillStyle = 'rgba(206,194,162,.45)';
      ctx.beginPath(); ctx.ellipse(-rr*.3, rr*.3, rr*.13, rr*.08, 0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(rr*.34, -rr*.3, rr*.1, rr*.07, -0.4, 0, Math.PI*2); ctx.fill();

      // basil leaf laid across — keeps a hint of green in the set without
      // owning a whole slot, and breaks up the white silhouette
      ctx.save();
      ctx.translate(rr*.1, -rr*.34); ctx.rotate(-0.5);
      ctx.fillStyle = '#4e8f47';
      ctx.beginPath();
      ctx.moveTo(0, -rr*.26);
      ctx.bezierCurveTo(rr*.2, -rr*.1, rr*.16, rr*.16, 0, rr*.26);
      ctx.bezierCurveTo(-rr*.16, rr*.16, -rr*.2, -rr*.1, 0, -rr*.26);
      ctx.fill();
      ctx.strokeStyle = 'rgba(226,242,214,.5)'; ctx.lineWidth = rr*.03;
      ctx.beginPath(); ctx.moveTo(0, -rr*.22); ctx.lineTo(0, rr*.22); ctx.stroke();
      ctx.restore();

      // wet highlight
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath(); ctx.ellipse(-rr*.34, -rr*.34, rr*.16, rr*.09, -0.6, 0, Math.PI*2); ctx.fill();

      ctx.restore();

    } else if (it.id === 'lemon') {
      // citrus segments
      ctx.fillStyle = 'rgba(255,251,205,.6)';
      ctx.beginPath(); ctx.arc(0,0,rr*.72,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(179,148,28,.65)'; ctx.lineWidth = 1.5;
      for (let i=0;i<7;i++) {
        const a = i*(Math.PI*2/7);
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a)*rr*.72, Math.sin(a)*rr*.72);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(179,148,28,.5)';
      ctx.beginPath(); ctx.arc(0,0,rr*.72,0,Math.PI*2); ctx.stroke();

    } else if (it.id === 'prosc') {
      // A folded slice of prosciutto: rosy meat with pale marbling and a
      // rippled edge. Warm pink keeps it clear of tomato's hard red.
      ctx.save();
      ctx.rotate(-0.1);
      ctx.fillStyle = '#e07a86';
      ctx.beginPath();
      ctx.moveTo(-rr*.72, -rr*.18);
      ctx.quadraticCurveTo(-rr*.34, -rr*.62, rr*.06, -rr*.36);
      ctx.quadraticCurveTo(rr*.5, -rr*.1, rr*.7, rr*.16);
      ctx.quadraticCurveTo(rr*.3, rr*.58, -rr*.14, rr*.42);
      ctx.quadraticCurveTo(-rr*.56, rr*.28, -rr*.72, -rr*.18);
      ctx.closePath(); ctx.fill();
      // deeper fold beneath
      ctx.fillStyle = 'rgba(160,60,74,.5)';
      ctx.beginPath();
      ctx.moveTo(-rr*.5, rr*.06);
      ctx.quadraticCurveTo(-rr*.1, rr*.34, rr*.42, rr*.14);
      ctx.quadraticCurveTo(rr*.1, rr*.54, -rr*.2, rr*.42);
      ctx.closePath(); ctx.fill();
      // marbled fat — pale ribbons
      ctx.strokeStyle = 'rgba(255,228,224,.72)';
      ctx.lineWidth = rr*.075; ctx.lineCap = 'round';
      for (const [ax, ay, bx, by] of [
        [-.5,-.1, .1,-.22], [-.34,.14, .34,-.02], [-.1,.3, .5,.1], [-.46,-.3, -.06,-.4]
      ]) {
        ctx.beginPath();
        ctx.moveTo(rr*ax, rr*ay);
        ctx.quadraticCurveTo(rr*(ax+bx)/2, rr*((ay+by)/2 - .1), rr*bx, rr*by);
        ctx.stroke();
      }
      // highlight
      ctx.fillStyle = 'rgba(255,255,255,.3)';
      ctx.beginPath(); ctx.ellipse(-rr*.26, -rr*.3, rr*.18, rr*.08, -0.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // inner shading so contents sit inside a sphere
    const inner = ctx.createRadialGradient(-rr*.3, -rr*.34, rr*.1, 0, 0, rr*1.05);
    inner.addColorStop(0, 'rgba(255,255,255,.16)');
    inner.addColorStop(.55, 'rgba(255,255,255,0)');
    inner.addColorStop(1, 'rgba(0,0,0,.4)');
    ctx.fillStyle = inner;
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.fill();

    ctx.restore(); // end clip

    // ---- glass rim ----
    ctx.strokeStyle = 'rgba(28,18,10,.5)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0,0,rr-1,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(0,0,rr-3, Math.PI*0.9, Math.PI*1.75); ctx.stroke();

    // ---- specular highlights: the bubble tell ----
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.ellipse(-rr*.33, -rr*.4, rr*.26, rr*.17, -0.65, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(rr*.36, rr*.34, rr*.11, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }


  // ---- static backdrop, rendered once ----
  const BG = (() => {
    const c = document.createElement('canvas');
    c.width = (W+80) * DPR; c.height = (H+80) * DPR;
    const g = c.getContext('2d');
    g.scale(DPR, DPR);
    const BW = W+80, BH = H+80;

    // Warm plaster base with a light source top-left, so the board reads as
    // a lit surface rather than flat paper.
    const base = g.createLinearGradient(0, 0, BW*0.6, BH);
    base.addColorStop(0, '#fdf3e0');
    base.addColorStop(0.45, '#f7ecd6');
    base.addColorStop(1, '#ecd9ba');
    g.fillStyle = base;
    g.fillRect(0, 0, BW, BH);

    // Faint tablecloth check — barely there, gives the eye texture to hold.
    g.strokeStyle = 'rgba(209,58,48,.055)';
    g.lineWidth = 13;
    for (let x = -20; x < BW + 40; x += 46) {
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, BH); g.stroke();
    }
    for (let y = -20; y < BH + 40; y += 46) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(BW, y); g.stroke();
    }

    // Diagonal awning stripes, softer than before and only in the upper half
    // so the launcher bay stays clean.
    g.save();
    g.globalAlpha = 0.5;
    g.strokeStyle = 'rgba(209,58,48,.06)'; g.lineWidth = 10;
    for (let i=-BH; i<BW+BH; i+=34) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i+BH, BH); g.stroke();
    }
    g.restore();

    // Speckle — tiny flour/semolina flecks, deterministic so it never shifts.
    let seed = 7;
    const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
    for (let i = 0; i < 420; i++) {
      const sx = rnd() * BW, sy = rnd() * BH, sr = 0.4 + rnd() * 1.1;
      g.fillStyle = rnd() > 0.5 ? 'rgba(120,80,40,.05)' : 'rgba(255,255,255,.28)';
      g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
    }

    // Corner vignette so the playfield edges recede.
    const vig = g.createRadialGradient(BW/2, BH*0.42, Math.min(BW,BH)*0.25,
                                       BW/2, BH*0.5, Math.max(BW,BH)*0.72);
    vig.addColorStop(0, 'rgba(90,50,20,0)');
    vig.addColorStop(1, 'rgba(90,50,20,.16)');
    g.fillStyle = vig;
    g.fillRect(0, 0, BW, BH);

    return c;
  })();

  // ---- sprite cache -----------------------------------------------------
  // Each bubble is expensive to paint (two gradients, a clip, and detail
  // work). They never change, so render each once at device resolution and
  // blit thereafter. 126 gradient builds per frame becomes 0.
  const SPR = [];
  const SPR_PAD = 3;
  function buildSprites() {
    SPR.length = 0;
    const size = Math.ceil((R + SPR_PAD) * 2 * DPR);
    for (let i = 0; i < ITEMS.length; i++) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const g = c.getContext('2d');
      g.scale(DPR, DPR);
      paintItem(g, R + SPR_PAD, R + SPR_PAD, i, 1, 0, 0);
      SPR.push(c);
    }
  }

  function drawItem(x, y, ci, scale, rot, squash) {
    const sc = scale || 1;
    if (ci === -2) { paintBomba(x, y, sc); return; }
    if (ci === -3) { paintWild(x, y, sc); return; }
    // Cached blit for the common case: full size, no rotation or squash.
    if (!rot && !squash && SPR[ci]) {
      const w = (R + SPR_PAD) * 2 * sc;
      if (sc === 1) {
        ctx.drawImage(SPR[ci], x - R - SPR_PAD, y - R - SPR_PAD, w, w);
      } else {
        ctx.drawImage(SPR[ci], x - (R + SPR_PAD) * sc, y - (R + SPR_PAD) * sc, w, w);
      }
      return;
    }
    paintItem(ctx, x, y, ci, sc, rot, squash);
  }

  // A glowing forno bomba — reads instantly as "not a normal bubble".
  // The wild bubble: pearly white with the palette cycling through it, so
  // it reads as "any ingredient" at a glance.
  function paintWild(x, y, sc) {
    const rr = R * sc;
    ctx.save();
    ctx.translate(x, y);
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.12);
    ctx.globalAlpha = 0.25 + pulse * 0.25;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, rr * (1.35 + pulse * 0.18), 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fbf6e8';
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.fill();
    // palette wedges rotating inside
    for (let i = 0; i < ITEMS.length; i++) {
      const a0 = (i / ITEMS.length) * Math.PI * 2 + frame * 0.02;
      const a1 = ((i + 1) / ITEMS.length) * Math.PI * 2 + frame * 0.02;
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = ITEMS[i].base;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, rr * 0.68, a0, a1); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(0, 0, rr * 0.3, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(60,40,20,.6)'; ctx.lineWidth = 2 * sc;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(-rr*.32, -rr*.36, rr*.2, rr*.11, -0.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  function paintBomba(x, y, sc) {
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.16);
    const rr = R * sc;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = 0.32 + pulse * 0.28;
    ctx.fillStyle = '#ff9a3c';
    ctx.beginPath(); ctx.arc(0, 0, rr * (1.45 + pulse * 0.2), 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(-rr*.3, -rr*.35, rr*.15, 0, 0, rr);
    g.addColorStop(0, '#fff3c0');
    g.addColorStop(0.45, '#ffae3a');
    g.addColorStop(1, '#a8321a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(60,18,10,.85)'; ctx.lineWidth = 2 * sc;
    ctx.stroke();
    // ember flecks
    for (let i = 0; i < 5; i++) {
      const a = frame * 0.05 + i * 1.256;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.2 + i);
      ctx.fillStyle = '#fff0b8';
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rr * 0.45, Math.sin(a) * rr * 0.45, rr * 0.11, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function star(x, y, sz, rot, color, alpha) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.beginPath();
    for (let i=0;i<8;i++) {
      const a = (i/8)*Math.PI*2;
      const rad = i%2 ? sz*0.28 : sz;
      ctx[i?'lineTo':'moveTo'](Math.cos(a)*rad, Math.sin(a)*rad);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }

  // ---- render ---------------------------------------------------------
  function draw() {
    if (scene === 'title') { sceneT++; stepTitleBits(); stepTitleActors(); stepSteam(W*0.5, H*0.28, 0.34); stepConfetti(); drawTitleScene(); return; }
    if (scene === 'inter') { sceneT++; stepTitleActors(); stepSteam(W*0.5, H*0.26, 0.38); stepConfetti(); drawInterstitial(); return; }
    if (scene === 'trial') {
      sceneT++; stepMiniGame(); stepTwinkles();
      // stepMiniGame() can resolve the trial and flip scene back to 'play'
      // on this exact frame; drawing the mini-game after that reads a null
      // trial and throws. Guard rather than draw blind.
      if (scene === 'trial') drawMiniGame();
      return;
    }

    ctx.save();

    const z = 1 + zoom;
    ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.translate(-W/2, -H/2);
    if (shake > 0.2) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

    // backdrop (pre-rendered; the stripes never change)
    ctx.drawImage(BG, -40, -40, W+80, H+80);

    // speed rays behind everything
    for (const rr of rays) {
      const a = rr.a, d0 = rr.off + (1-rr.life)*70, d1 = d0 + rr.len;
      ctx.globalAlpha = rr.life * 0.9;
      ctx.strokeStyle = rr.color; ctx.lineWidth = rr.w * rr.life; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(W/2 + Math.cos(a)*d0, H/2 + Math.sin(a)*d0);
      ctx.lineTo(W/2 + Math.cos(a)*d1, H/2 + Math.sin(a)*d1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ---- marinara flood ----
    const ceil = 7 + offsetRow*ROWH;
    const t = frame * 0.05;

    // sauce body
    const sg = ctx.createLinearGradient(0, 0, 0, ceil + 8);
    sg.addColorStop(0, '#7d1512');
    sg.addColorStop(.55, '#a8241d');
    sg.addColorStop(1, '#c0302c');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(W, 0);
    // wobbling underside
    ctx.lineTo(W, ceil);
    for (let x = W; x >= 0; x -= 12) {
      const wob = Math.sin(x * 0.055 + t) * 2.2 + Math.sin(x * 0.021 - t * 1.4) * 1.6;
      ctx.lineTo(x, ceil + wob + surge * 3);
    }
    ctx.closePath();
    ctx.fill();

    // glossy sheen
    ctx.fillStyle = 'rgba(255,150,130,.16)';
    ctx.fillRect(0, 2, W, Math.max(0, ceil * 0.38));

    // chopped veg suspended in the sauce, each type drawn distinctly
    // (skipped entirely while the ceiling is shallow — nothing would show)
    if (ceil > 14) for (const h of herbs) {
      const hy = h.y * ceil;
      // Cull before any save/transform: when the ceiling is high most of
      // these are off-band, and save/restore is the expensive part.
      if (hy >= ceil - 2 || hy < 2) continue;
      ctx.save();
      ctx.translate(h.x * W + Math.sin(t * 0.6 + h.bob) * 1.6, hy);
      ctx.rotate(h.r + t * 0.2);
      ctx.scale(h.sc, h.sc);
      switch (h.kind) {
        case 'basil':
          ctx.fillStyle = 'rgba(74,128,70,.72)';
          ctx.beginPath();
          ctx.moveTo(0,-3); ctx.bezierCurveTo(3,-1,2.4,2,0,3.4);
          ctx.bezierCurveTo(-2.4,2,-3,-1,0,-3); ctx.fill();
          ctx.strokeStyle='rgba(150,200,140,.5)'; ctx.lineWidth=.5;
          ctx.beginPath(); ctx.moveTo(0,-2.6); ctx.lineTo(0,3); ctx.stroke();
          break;
        case 'onion':
          ctx.strokeStyle = 'rgba(248,240,228,.66)'; ctx.lineWidth = 1.1;
          ctx.beginPath(); ctx.arc(0,0,3.2,0.4,4.2); ctx.stroke();
          ctx.beginPath(); ctx.arc(0,0,1.9,0.6,4.0); ctx.stroke();
          break;
        case 'garlic':
          ctx.fillStyle = 'rgba(244,238,222,.7)';
          ctx.beginPath(); ctx.moveTo(-2,2); ctx.quadraticCurveTo(0,-3.2,2,2);
          ctx.quadraticCurveTo(0,3,-2,2); ctx.fill();
          break;
        case 'pepper':
          ctx.fillStyle = 'rgba(60,140,60,.7)';
          ctx.beginPath(); ctx.roundRect(-2.6,-1.2,5.2,2.4,1.2); ctx.fill();
          ctx.fillStyle = 'rgba(120,190,110,.45)';
          ctx.beginPath(); ctx.roundRect(-1.8,-.6,3.6,.9,.5); ctx.fill();
          break;
        case 'carrot':
          ctx.fillStyle = 'rgba(232,140,50,.78)';
          ctx.beginPath(); ctx.arc(0,0,2.6,0,7); ctx.fill();
          ctx.fillStyle = 'rgba(255,190,110,.55)';
          ctx.beginPath(); ctx.arc(0,0,1.3,0,7); ctx.fill();
          break;
        default: // peppercorn
          ctx.fillStyle = 'rgba(40,28,22,.7)';
          ctx.beginPath(); ctx.arc(0,0,1.5,0,7); ctx.fill();
          ctx.fillStyle = 'rgba(120,100,90,.5)';
          ctx.beginPath(); ctx.arc(-.4,-.4,.6,0,7); ctx.fill();
      }
      ctx.restore();
    }

    // hanging drips — the long ones sway and their necks pinch inward
    for (const dp of sauceDrips) {
      const swing = Math.sin(dp.sway) * Math.min(2.6, dp.len * 0.12);
      const tipX = dp.x + swing;
      const dy = ceil + dp.len;
      const neck = dp.w * (1 - Math.min(0.55, dp.len / 46));  // thins as it stretches
      ctx.fillStyle = '#a8241d';
      ctx.beginPath();
      ctx.moveTo(dp.x - dp.w, ceil - 1);
      ctx.quadraticCurveTo(tipX - neck * 0.5, dy - dp.w, tipX, dy);
      ctx.quadraticCurveTo(tipX + neck * 0.5, dy - dp.w, dp.x + dp.w, ceil - 1);
      ctx.closePath(); ctx.fill();
      // swollen bead at the tip
      ctx.beginPath(); ctx.arc(tipX, dy - dp.w * 0.3, dp.w * 0.78, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,170,150,.34)';
      ctx.beginPath(); ctx.arc(tipX - dp.w*0.28, dy - dp.w*0.6, dp.w*0.26, 0, Math.PI*2); ctx.fill();
    }

    // falling droplets — elongate with speed, with a thin trailing strand
    for (const dl of droplets) {
      ctx.globalAlpha = Math.min(1, dl.life * 2);
      ctx.fillStyle = '#b82a22';
      const st = 1 + (dl.str || 0);
      ctx.beginPath();
      ctx.ellipse(dl.x, dl.y, dl.r * 0.72, dl.r * 1.35 * st, 0, 0, Math.PI*2);
      ctx.fill();
      if (st > 1.5) {
        ctx.beginPath();
        ctx.moveTo(dl.x - dl.r*0.3, dl.y - dl.r*st);
        ctx.quadraticCurveTo(dl.x, dl.y - dl.r*st*2.1, dl.x + dl.r*0.3, dl.y - dl.r*st);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,170,150,.3)';
      ctx.beginPath(); ctx.arc(dl.x - dl.r*0.22, dl.y - dl.r*0.3, dl.r*0.24, 0, Math.PI*2); ctx.fill();
      if (dl.veg) {
        ctx.save(); ctx.translate(dl.x, dl.y); ctx.rotate(dl.rot || 0);
        if (dl.veg === 'basil')      { ctx.fillStyle='rgba(74,128,70,.9)';
          ctx.beginPath(); ctx.ellipse(0,0,2.6,1.4,0,0,7); ctx.fill(); }
        else if (dl.veg === 'onion') { ctx.strokeStyle='rgba(248,240,228,.85)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.arc(0,0,2.4,0.4,4.2); ctx.stroke(); }
        else if (dl.veg === 'carrot'){ ctx.fillStyle='rgba(232,140,50,.92)';
          ctx.beginPath(); ctx.arc(0,0,2.2,0,7); ctx.fill(); }
        else if (dl.veg === 'pepper'){ ctx.fillStyle='rgba(60,140,60,.85)';
          ctx.fillRect(-2.2,-1,4.4,2); }
        else                         { ctx.fillStyle='rgba(40,28,22,.85)';
          ctx.beginPath(); ctx.arc(0,0,1.3,0,7); ctx.fill(); }
        ctx.restore();
      }
    }
    // splatter on the counter line
    for (const sp of splats) {
      ctx.globalAlpha = Math.min(1, sp.life);
      ctx.fillStyle = '#9e2019';
      ctx.beginPath(); ctx.ellipse(sp.x, sp.y, sp.r*1.2, sp.r*0.8, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // rim highlight along the sauce edge
    ctx.strokeStyle = 'rgba(255,170,150,.32)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const wob = Math.sin(x * 0.055 + t) * 2.2 + Math.sin(x * 0.021 - t * 1.4) * 1.6;
      const yy = ceil + wob + surge * 3;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();

    // counter line
    const dy = SHOOTY - D*1.4 - R;
    ctx.strokeStyle = 'rgba(192,48,40,.5)';
    ctx.setLineDash([7,5]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,dy); ctx.lineTo(W,dy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(192,48,40,.45)';
    ctx.font = 'bold 8px "Space Mono", ui-monospace, Menlo, monospace'; ctx.textAlign = 'left';
    ctx.fillText('IL BANCONE — DO NOT CROSS', 6, dy-5);

    // aim guide — full trajectory for the first two levels, then just a
    // short launch stub so you have to read the angle yourself.
    if (!shot && running && !over && sling.active && sling.power > 0.04) {
      const a = clampAim(sling.aim);
      if (GUIDED) {
        const pts = previewPath();
        ctx.strokeStyle = 'rgba(35,24,15,' + (0.12 + sling.power*0.34) + ')';
        ctx.setLineDash([2,8]); ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
        for (let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i], pts[i+1]);
        ctx.stroke(); ctx.setLineDash([]);
        const ex = pts[pts.length-2], ey = pts[pts.length-1];
        ctx.strokeStyle = 'rgba(192,48,40,' + (0.3+sling.power*0.55) + ')'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.arc(ex, ey, R*0.9, 0, Math.PI*2); ctx.stroke();
      } else {
        const stub = 52 + sling.power * 26;
        ctx.strokeStyle = 'rgba(35,24,15,' + (0.16 + sling.power*0.3) + ')';
        ctx.setLineDash([2,7]); ctx.lineWidth = 3.2; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(SHOOTX + Math.cos(a)*R*1.3, SHOOTY + Math.sin(a)*R*1.3);
        ctx.lineTo(SHOOTX + Math.cos(a)*stub, SHOOTY + Math.sin(a)*stub);
        ctx.stroke(); ctx.setLineDash([]);
        // arrowhead so the angle stays readable
        const hx = SHOOTX + Math.cos(a)*stub, hy = SHOOTY + Math.sin(a)*stub;
        ctx.fillStyle = 'rgba(192,48,40,' + (0.4 + sling.power*0.4) + ')';
        ctx.save(); ctx.translate(hx, hy); ctx.rotate(a);
        ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-5,-4.5); ctx.lineTo(-5,4.5);
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
    }

    // grid
    for (let r=0;r<ROWS;r++) {
      const row = grid[r], n = colsIn(r);
      const yy = R + r*ROWH + offsetRow*ROWH, off = r % 2 ? R : 0;
      if (yy - R > H) break;                       // below the board, stop
      for (let c=0;c<n;c++) {
        const v = row[c];
        if (v < 0) continue;
        // A slow positional wave so the board breathes instead of sitting
        // frozen. Offsetting the position keeps this on the cached-blit
        // path — passing rot/squash here would drop 126 bubbles onto
        // paintItem and cost ~250 gradients a frame.
        const ph = (r * 0.7 + c * 0.45);
        const bobY = Math.sin(frame * 0.028 + ph) * 0.9;
        const bobX = Math.cos(frame * 0.021 + ph) * 0.5;
        drawItem(R + c*D + off + bobX, yy + bobY, v);
      }
    }

    for (const d of drops) drawItem(d.x, d.y, d.ci, 1, d.rot);

    // shockwave rings
    for (const rg of rings) {
      ctx.globalAlpha = rg.life * 0.75;
      ctx.strokeStyle = rg.color;
      ctx.lineWidth = 5 * rg.life;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = ITEMS[p.ci].lit;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz*p.life, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const s of sparks) star(s.x, s.y, s.sz*s.life, s.rot, s.color, s.life);

    for (const pu of popups) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, pu.life * 1.8);
      ctx.font = '900 ' + pu.size + 'px Anton, Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(28,18,10,.9)'; ctx.lineWidth = 4;
      ctx.strokeText(pu.text, pu.x, pu.y);
      ctx.fillStyle = pu.color;
      ctx.fillText(pu.text, pu.x, pu.y);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (shot) {
      for (let i=0;i<shot.trail.length;i++) {
        const t = shot.trail[i], f = (i+1)/shot.trail.length;
        ctx.globalAlpha = f*0.32;
        drawItem(t.x, t.y, shot.ci, 0.55 + f*0.4);
      }
      ctx.globalAlpha = 1;
      drawItem(shot.x, shot.y, shot.ci);
    }

    // Theme wash for the active node — a flat tint plus a directional
    // light, cheap enough to run every frame (no gradients built here).
    if (activeNode && NODE_TYPES[activeNode.type]) {
      const th = NODE_TYPES[activeNode.type];
      // 'overlay' saturates rather than darkening: a normal-mode fillRect
      // always subtracts light, which is why later levels kept dimming as
      // node and district washes stacked. This keeps the hue shift while
      // preserving the brightness of everything underneath.
      if (th.tint) {
        ctx.globalCompositeOperation = 'overlay';
        ctx.fillStyle = th.tint;
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';
      }
      if (th.light) {
        // Light shaft added on top, so the board gains brightness overall.
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.30 + 0.10 * Math.sin(frame * 0.02);
        ctx.fillStyle = th.light;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(W * 0.62, 0);
        ctx.lineTo(W * 0.2, H); ctx.lineTo(0, H);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    drawSling();
    drawCharge();
    // ambient glimmer across settled bubbles — keeps idle frames alive
    if (running && !over && frame % 26 === 0) {
      for (let r = 0; r < ROWS; r++) {
        const c = (Math.random() * colsIn(r)) | 0;
        if (grid[r] && grid[r][c] >= 0) {
          twinkle(cellX(r,c) + (Math.random()-.5)*R, cellY(r) + (Math.random()-.5)*R,
                  'rgba(255,248,220,.9)', 0.55);
          break;
        }
      }
    }
    // ---- danger warning --------------------------------------------------
    // How close is the sauce to the launcher? 0 = safe, 1 = about to lose.
    if (running && !over) {
      const ceilNow = 7 + offsetRow * ROWH;
      const danger = Math.max(0, Math.min(1, (ceilNow - SHOOTY * 0.42) / (SHOOTY * 0.46)));
      if (danger > 0.25) {
        const pulse = 0.5 + 0.5 * Math.sin(frame * (0.06 + danger * 0.1));
        ctx.globalAlpha = (danger - 0.25) * 0.5 * pulse;
        ctx.fillStyle = '#c0302c';
        // edge-only bleed, so it never obscures the board itself
        ctx.fillRect(0, 0, 10, H);
        ctx.fillRect(W - 10, 0, 10, H);
        ctx.fillRect(0, H - 12, W, 12);
        ctx.globalAlpha = 1;
        if (danger > 0.62 && frame % 34 === 0) {
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = '#f7ecd6';
          ctx.font = '900 12px Anton, Impact, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('ATTENZIONE!', W / 2, SHOOTY - 6);
          ctx.globalAlpha = 1;
        }
      }
    }

    drawTwinkles();
    if (waveOn) drawDeathWave();
    drawTip();
    ctx.restore();

    // Giovanni draws outside the shake/zoom transform: he stands on solid
    // ground and must never be pushed past the canvas edge.
    drawPizzaiolo();

    drawFlashes();
  }

  // ---- the big sling --------------------------------------------------
  // Forno charge meter: a wood-oven gauge along the left of the launcher bay.
  function drawCharge() {
    const bx = 10, by = SHOOTY - 96, bw = 9, bh = 120;
    ctx.save();
    ctx.fillStyle = 'rgba(30,20,14,.55)';
    ctx.fillRect(bx, by, bw, bh);
    const f = charge / CHARGE_MAX;
    const fh = bh * f;
    if (fh > 0) {
      const g = ctx.createLinearGradient(0, by + bh - fh, 0, by + bh);
      g.addColorStop(0, armed ? '#fff2c4' : '#ffae3a');
      g.addColorStop(1, armed ? '#ff8a2a' : '#c0302c');
      ctx.fillStyle = g;
      ctx.fillRect(bx, by + bh - fh, bw, fh);
    }
    if (armed) {
      const pu = 0.5 + 0.5 * Math.sin(frame * 0.18);
      ctx.globalAlpha = 0.35 + pu * 0.4;
      ctx.strokeStyle = '#ffd98a'; ctx.lineWidth = 2.5;
      ctx.strokeRect(bx - 2, by - 2, bw + 4, bh + 4);
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(bx + bw / 2, by - 12);
      ctx.rotate(Math.sin(frame * 0.1) * 0.12);
      ctx.fillStyle = '#ffd98a';
      ctx.font = '700 9px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!', 0, 0);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(242,228,200,.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.save();
    ctx.translate(bx + bw / 2, by + bh + 13);
    ctx.fillStyle = 'rgba(242,228,200,.65)';
    ctx.font = '700 7px "Space Mono", ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('FORNO', 0, 0);
    ctx.restore();
    ctx.restore();
  }

  // ---- cinematics -----------------------------------------------------
  // Title attract-loop and between-level interstitials. Both draw straight
  // to the canvas so they share the game's vocabulary (and Giovanni),
  // rather than being separate DOM screens that break the visual world.

  const CONFETTI = [];
  function confettiBurst(n, cx, cy) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI/2 + (Math.random()-.5) * 2.4;
      const sp = 2.5 + Math.random() * 6.5;
      CONFETTI.push({
        x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        rot: Math.random()*7, vr: (Math.random()-.5)*.4,
        w: 3 + Math.random()*5, h: 5 + Math.random()*7,
        c: ['#c0302c','#3d6b3a','#f2e4c8','#e0a63c'][(Math.random()*4)|0],
        life: 1
      });
    }
  }
  function stepConfetti() {
    for (let i = CONFETTI.length-1; i >= 0; i--) {
      const p = CONFETTI[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.vx *= 0.995;
      p.rot += p.vr; p.life -= 0.007;
      if (p.life <= 0 || p.y > H + 20) CONFETTI.splice(i,1);
    }
    if (CONFETTI.length > 160) CONFETTI.splice(0, CONFETTI.length - 160);
  }
  function drawConfetti() {
    for (const p of CONFETTI) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 2.5);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * (0.4 + 0.6*Math.abs(Math.cos(p.rot))));
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // Steam curls — used on both scenes, drifting up from the oven.
  const STEAM = [];
  function stepSteam(originX, originY, rate) {
    if (Math.random() < rate) STEAM.push({
      x: originX + (Math.random()-.5)*26, y: originY,
      r: 5 + Math.random()*9, life: 1,
      vy: -0.35 - Math.random()*0.5, drift: (Math.random()-.5)*0.42, ph: Math.random()*7
    });
    for (let i = STEAM.length-1; i >= 0; i--) {
      const s = STEAM[i];
      s.y += s.vy; s.x += Math.sin(sceneT*0.03 + s.ph) * 0.5 + s.drift;
      s.r += 0.16; s.life -= 0.0075;
      if (s.life <= 0) STEAM.splice(i,1);
    }
    if (STEAM.length > 70) STEAM.splice(0, STEAM.length - 70);
  }
  function drawSteam() {
    for (const s of STEAM) {
      ctx.globalAlpha = s.life * 0.22;
      ctx.fillStyle = '#f2e4c8';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // A brick pizza oven with a live fire inside.
  function drawOven(ox, oy, sc) {
    const t = sceneT * 0.05;
    ctx.save();
    ctx.translate(ox, oy); ctx.scale(sc, sc);
    // dome
    ctx.fillStyle = '#8d6a4a';
    ctx.beginPath(); ctx.arc(0, 0, 46, Math.PI, 0); ctx.fill();
    ctx.fillRect(-46, 0, 92, 16);
    // brick courses
    ctx.strokeStyle = 'rgba(35,24,15,.3)'; ctx.lineWidth = 1.2;
    for (let ry = -40; ry <= 12; ry += 13) {
      ctx.beginPath(); ctx.moveTo(-46, ry); ctx.lineTo(46, ry); ctx.stroke();
    }
    for (let rx = -40; rx <= 40; rx += 18) {
      ctx.beginPath(); ctx.moveTo(rx, -Math.sqrt(Math.max(0,46*46-rx*rx))); ctx.lineTo(rx, 16); ctx.stroke();
    }
    ctx.strokeStyle = '#23180f'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, 46, Math.PI, 0); ctx.stroke();
    ctx.strokeRect(-46, 0, 92, 16);
    // mouth
    ctx.fillStyle = '#1a0e08';
    ctx.beginPath(); ctx.ellipse(0, 2, 26, 20, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(-26, 2, 52, 8);
    // fire
    const fl = 0.7 + 0.3*Math.sin(t*3.1);
    const fg = ctx.createRadialGradient(0, 2, 2, 0, 2, 26);
    fg.addColorStop(0, 'rgba(255,240,180,' + (0.95*fl) + ')');
    fg.addColorStop(0.4, 'rgba(255,150,40,' + (0.8*fl) + ')');
    fg.addColorStop(1, 'rgba(180,40,20,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.ellipse(0, 4, 24, 17, 0, 0, Math.PI*2); ctx.fill();
    for (let i = 0; i < 4; i++) {
      const fx = -12 + i*8, h = 10 + Math.sin(t*4 + i*1.7)*7;
      ctx.fillStyle = 'rgba(255,190,70,.75)';
      ctx.beginPath();
      ctx.moveTo(fx-3, 8); ctx.quadraticCurveTo(fx, 8-h, fx+3, 8);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // Bubbles drifting up behind the title like bubbles in a pot.
  const TITLEBITS = [];
  function stepTitleBits() {
    if (TITLEBITS.length < 14 && Math.random() < 0.06)
      TITLEBITS.push({ x: 20 + Math.random()*(W-40), y: H + 20,
                       ci: (Math.random()*ITEMS.length)|0,
                       vy: -0.45 - Math.random()*0.7,
                       ph: Math.random()*7, sc: 0.5 + Math.random()*0.45,
                       rot: (Math.random()-.5)*0.02, r0: 0 });
    for (let i = TITLEBITS.length-1; i >= 0; i--) {
      const b = TITLEBITS[i];
      b.y += b.vy; b.r0 += b.rot;
      if (b.y < -30) TITLEBITS.splice(i,1);
    }
  }
  function drawTitleBits() {
    for (const b of TITLEBITS) {
      ctx.globalAlpha = 0.42;
      drawItem(b.x + Math.sin(sceneT*0.02 + b.ph)*11, b.y, b.ci, b.sc, b.r0);
    }
    ctx.globalAlpha = 1;
  }

  // ---- title scene ----
  // ---- title scene: the shop at full chaos --------------------------
  // A cat, a delivery scooter, a dancing pepperoni, flying pizzas, a
  // cuckoo-clock tomato and Giovanni juggling. Everything runs on its own
  // timer so the loop never lines up the same way twice.
  const FLYPIZZA = [];
  const GARLIC = [];
  let catX = -40, catVX = 0.6, catNap = 0, catBlink = 0;
  let scootX = W + 60, scootNext = 380, scootBounce = 0;
  let danceT = 0, clockPop = 0, clockNext = 300;
  let mouseSquish = 0;

  function stepTitleActors() {
    // --- flying pizzas arcing across the shop ---
    if (Math.random() < 0.018 && FLYPIZZA.length < 5) {
      const fromLeft = Math.random() < 0.5;
      FLYPIZZA.push({
        x: fromLeft ? -30 : W + 30, y: H*0.25 + Math.random()*H*0.28,
        vx: (fromLeft ? 1 : -1) * (1.6 + Math.random()*1.5),
        vy: -1.4 - Math.random()*1.2, rot: 0,
        vr: (fromLeft ? 1 : -1) * (0.09 + Math.random()*0.07),
        sc: 0.75 + Math.random()*0.5
      });
    }
    for (let i = FLYPIZZA.length-1; i >= 0; i--) {
      const f = FLYPIZZA[i];
      f.x += f.vx; f.y += f.vy; f.vy += 0.035; f.rot += f.vr;
      if (f.x < -60 || f.x > W+60 || f.y > H+50) FLYPIZZA.splice(i,1);
    }

    // --- garlic bulbs bouncing along the floor ---
    if (Math.random() < 0.01 && GARLIC.length < 4) {
      GARLIC.push({ x: -20, y: H-52, vx: 1.1+Math.random()*0.9, vy: -3, sc: .6+Math.random()*.4, rot:0 });
    }
    for (let i = GARLIC.length-1; i >= 0; i--) {
      const g = GARLIC[i];
      g.x += g.vx; g.y += g.vy; g.vy += 0.22; g.rot += 0.14;
      if (g.y > H-52) { g.y = H-52; g.vy = -2.4 - Math.random()*1.4; }   // bounce
      if (g.x > W+30) GARLIC.splice(i,1);
    }

    // --- the shop cat: struts, naps, wakes, struts ---
    if (catNap > 0) {
      catNap--;
      if (catNap === 0) catVX = Math.random() < 0.5 ? 0.6 : -0.6;
    } else {
      catX += catVX;
      if (catX > W - 30) { catVX = -0.6; }
      if (catX < 24) { catVX = 0.6; }
      if (Math.random() < 0.004) catNap = 140 + Math.random()*180;
    }
    catBlink = (catBlink + 0.014) % 1;

    // --- delivery scooter zips past on a timer ---
    scootNext--;
    if (scootNext <= 0 && scootX > W + 40) { scootX = -70; scootNext = 420 + Math.random()*500; }
    if (scootX <= W + 60) { scootX += 3.4; scootBounce = Math.sin(sceneT*0.5)*1.6; }

    // --- dancing pepperoni + cuckoo tomato ---
    danceT += 0.075;
    clockNext--;
    if (clockNext <= 0) { clockPop = 1; clockNext = 260 + Math.random()*300; SFX.ui(); }
    if (clockPop > 0) clockPop -= 0.014;
    if (mouseSquish > 0) mouseSquish -= 0.05;
  }

  // A wedge of pizza with a face, doing a little shimmy.
  function drawDancingSlice(x, y, sc) {
    const wob = Math.sin(danceT) * 0.3;
    const hop = Math.abs(Math.sin(danceT * 1.5)) * 5;
    ctx.save();
    ctx.translate(x, y - hop); ctx.scale(sc, sc); ctx.rotate(wob);
    // crust wedge
    ctx.fillStyle = '#f0b64a';
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(-13, 12); ctx.lineTo(13, 12); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#23180f'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#c9873a';
    ctx.beginPath(); ctx.moveTo(-13, 12); ctx.quadraticCurveTo(0, 17, 13, 12); ctx.lineTo(13,12); ctx.closePath(); ctx.fill();
    // pepperoni
    ctx.fillStyle = '#c0302c';
    ctx.beginPath(); ctx.arc(-4, 2, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(5, 5, 2.6, 0, 7); ctx.fill();
    // face
    ctx.fillStyle = '#23180f';
    ctx.beginPath(); ctx.arc(-4, -4, 1.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -4, 1.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#23180f'; ctx.lineWidth = 1.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0, -1, 3.4, 0.25, Math.PI-0.25); ctx.stroke();
    // arms waving
    ctx.lineWidth = 1.8;
    const aw = Math.sin(danceT*2)*0.7;
    ctx.beginPath(); ctx.moveTo(-11,2); ctx.lineTo(-16, -2 + aw*5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11,2); ctx.lineTo(16, -2 - aw*5); ctx.stroke();
    ctx.restore();
  }

  // Shop cat — sits, walks, sleeps with a Z.
  function drawCat(x, y, napping, dir) {
    const t = sceneT * 0.06;
    ctx.save();
    ctx.translate(x, y); ctx.scale(dir < 0 ? -1 : 1, 1);
    const bob = napping ? 0 : Math.sin(t*2)*0.8;
    ctx.translate(0, bob);
    ctx.fillStyle = '#3a3a42';
    if (napping) {
      ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(-11, -3, 6.5, 0, 7); ctx.fill();
      // tail curled
      ctx.strokeStyle='#3a3a42'; ctx.lineWidth=3.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(13,1); ctx.quadraticCurveTo(21,4,17,-4); ctx.stroke();
      // closed eyes
      ctx.strokeStyle='#16161c'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(-13,-4,1.8,0.2,Math.PI-0.2); ctx.stroke();
      // Zs
      ctx.fillStyle = 'rgba(242,228,200,'+(0.35+0.35*Math.sin(t*1.6))+')';
      ctx.font='700 9px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.fillText('z', -18, -14 - Math.sin(t)*3);
      ctx.font='700 7px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.fillText('z', -12, -20 - Math.sin(t+1)*3);
    } else {
      ctx.beginPath(); ctx.ellipse(0, 0, 13, 7, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(-10, -6, 6, 0, 7); ctx.fill();
      // ears
      ctx.beginPath(); ctx.moveTo(-14,-10); ctx.lineTo(-13,-15); ctx.lineTo(-9,-11); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-7,-11); ctx.lineTo(-5,-15); ctx.lineTo(-4,-10); ctx.fill();
      // legs trotting
      ctx.strokeStyle='#3a3a42'; ctx.lineWidth=2.4; ctx.lineCap='round';
      for (let i=0;i<2;i++){
        const lx = -6 + i*11, sw = Math.sin(t*5 + i*2.1)*3;
        ctx.beginPath(); ctx.moveTo(lx, 5); ctx.lineTo(lx+sw, 11); ctx.stroke();
      }
      // tail up
      ctx.lineWidth=3; ctx.beginPath();
      ctx.moveTo(12,-1); ctx.quadraticCurveTo(19,-6,16+Math.sin(t*3)*2,-13); ctx.stroke();
      // eye
      ctx.fillStyle = catBlink > 0.95 ? '#3a3a42' : '#e0a63c';
      ctx.beginPath(); ctx.arc(-12,-7,1.7,0,7); ctx.fill();
    }
    ctx.restore();
  }

  // Vespa-style scooter with a stacked pizza box.
  function drawScooter(x, y) {
    ctx.save();
    ctx.translate(x, y + scootBounce);
    // body
    ctx.fillStyle = '#3d6b3a';
    ctx.beginPath(); ctx.roundRect(-16, -14, 30, 14, 5); ctx.fill();
    ctx.strokeStyle='#23180f'; ctx.lineWidth=2; ctx.stroke();
    // wheels
    ctx.fillStyle='#2a2a30';
    for (const wx of [-11, 12]) {
      ctx.beginPath(); ctx.arc(wx, 2, 5.5, 0, 7); ctx.fill();
      ctx.strokeStyle='#6a6a72'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(wx, 2, 2.4, 0, 7); ctx.stroke();
    }
    // handlebar + rider
    ctx.strokeStyle='#23180f'; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(12,-14); ctx.lineTo(17,-24); ctx.stroke();
    ctx.fillStyle='#f6d3a8';
    ctx.beginPath(); ctx.arc(2,-25,6,0,7); ctx.fill();
    ctx.strokeStyle='#23180f'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#c0302c';
    ctx.beginPath(); ctx.arc(2,-27,6.4,Math.PI,0); ctx.fill();  // cap
    // pizza boxes stacked, wobbling
    const wob = Math.sin(sceneT*0.3)*0.09;
    ctx.save(); ctx.translate(-12,-18); ctx.rotate(wob);
    ctx.fillStyle='#e4ddc9';
    for (let i=0;i<3;i++){ ctx.fillRect(-8,-6-i*5,17,5); ctx.strokeStyle='#23180f'; ctx.lineWidth=1.1; ctx.strokeRect(-8,-6-i*5,17,5); }
    ctx.restore();
    // speed lines
    ctx.strokeStyle='rgba(242,228,200,.35)'; ctx.lineWidth=1.6;
    for(let i=0;i<3;i++){
      const ly=-16+i*7;
      ctx.beginPath(); ctx.moveTo(-22-i*7,ly); ctx.lineTo(-34-i*9,ly); ctx.stroke();
    }
    ctx.restore();
  }

  // A tomato that pops out of a clock and yells.
  function drawCuckoo(x, y) {
    const p = clockPop;
    ctx.save();
    ctx.translate(x, y);
    // clock box
    ctx.fillStyle='#8d6a4a';
    ctx.beginPath(); ctx.roundRect(-17,-16,34,30,3); ctx.fill();
    ctx.strokeStyle='#23180f'; ctx.lineWidth=2; ctx.stroke();
    // roof
    ctx.fillStyle='#c0302c';
    ctx.beginPath(); ctx.moveTo(-21,-16); ctx.lineTo(0,-28); ctx.lineTo(21,-16); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#23180f'; ctx.stroke();
    // face
    ctx.fillStyle='#f2e4c8';
    ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
    ctx.strokeStyle='#23180f'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.strokeStyle='#23180f'; ctx.lineWidth=1.6; ctx.lineCap='round';
    const ha = sceneT*0.04;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ha)*5, Math.sin(ha)*5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ha*3)*7, Math.sin(ha*3)*7); ctx.stroke();
    // the tomato bursts out of the little door
    if (p > 0.02) {
      const out = Math.sin(Math.min(1,p*1.6) * Math.PI) * 22;
      ctx.save();
      ctx.translate(0, -20 - out*0.2);
      ctx.translate(0, -out*0.7);
      drawItem(0, 0, 0, 0.7 + p*0.15);
      // tiny yelling mouth
      ctx.fillStyle='#5a1410';
      ctx.beginPath(); ctx.ellipse(0, 3, 2.6*p, 3.4*p, 0, 0, 7); ctx.fill();
      ctx.restore();
      if (p > 0.55) {
        ctx.fillStyle='rgba(242,228,200,'+((p-0.55)*2.2)+')';
        ctx.font='900 11px Anton, Impact, sans-serif'; ctx.textAlign='center';
        ctx.fillText('CUCU!', 26, -22 - out*0.6);
      }
    }
    ctx.restore();
  }

  function drawTitleScene() {
    ctx.save();
    ctx.drawImage(BG, -40, -40, W+80, H+80);
    drawTitleBits();

    const vg = ctx.createRadialGradient(W/2, H*0.42, 40, W/2, H*0.42, H*0.72);

        for(let i=0;i<5;i++) { ctx.beginPath(); ctx.arc(-4+Math.random()*8, 30+i*8, 1.5, 0, 7); ctx.fill(); }

    }

    drawSteam();
    drawOven(W*0.5, H*0.28, 1.15);
    drawCuckoo(W - 42, H*0.13);

    // flying pizzas behind Giovanni
    for (const f of FLYPIZZA) {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.scale(f.sc, f.sc);
      ctx.fillStyle='#f0b64a';
      ctx.beginPath(); ctx.arc(0,0,15,0,7); ctx.fill();
      ctx.strokeStyle='#c9873a'; ctx.lineWidth=3.5; ctx.stroke();
      ctx.fillStyle='#c0302c';
      for (const [px,py] of [[-5,-4],[6,-2],[-1,6],[7,6]]) { ctx.beginPath(); ctx.arc(px,py,3,0,7); ctx.fill(); }

    for (const g of GARLIC) {
      ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot); ctx.scale(g.sc,g.sc);
      ctx.fillStyle='#efe6d2';
      ctx.beginPath(); ctx.ellipse(0,0,8,9,0,0,7); ctx.fill();
      ctx.strokeStyle='rgba(35,24,15,.4)'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.strokeStyle='#8a7355'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(0,-13); ctx.stroke();

    }

    drawDancingSlice(W*0.80, H*0.55, 1.15);
    drawCat(catX, H - 46, catNap > 0, catVX);
    if (scootX <= W + 60) drawScooter(scootX, H - 40);

    // Giovanni juggling, hyper
    piz.toss = 0.75 + 0.25*Math.sin(sceneT*0.09);
    piz.spin = sceneT * 0.16;
    piz.happy = 0.6 + 0.4*Math.sin(sceneT*0.055);
    piz.bounce = Math.max(0, Math.sin(sceneT*0.11)) * 0.4;
